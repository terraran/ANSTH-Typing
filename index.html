// ── SAFE ZONE CONFIG ──────────────────────────────────────────────────
// Zone starts 30s into the race, advances at ZONE_CPM chars/min.
// Players more than ZONE_GAP chars behind lose 1 life every ZONE_TICK ms.
// Text display: show ~2 lines at a time, advance on completion
const CHUNK_CHARS = 76; // chars per chunk (~2 lines at 34px Thai font)

// Build word-boundary chunks — extracted to module level so Babel handles it reliably
function buildChunks(targetChars) {
  if (!targetChars.length) return [{start:0,end:0}];
  const result = [];
  let start = 0;
  while (start < targetChars.length) {
    let end = Math.min(start + CHUNK_CHARS, targetChars.length);
    if (end < targetChars.length) {
      // Advance to end of current word — never split mid-word
      while (end < targetChars.length && targetChars[end] !== ' ') end++;
      // Include the trailing space in this chunk
      if (end < targetChars.length) end++;
    }
    result.push({start, end});
    start = end;
    if (result.length > 200) break; // safety cap
  }
  return result;
}

const ZONE_GRACE = 30;    // seconds before zone starts moving
const ZONE_CPM   = 18;    // zone advance speed in chars/minute
const ZONE_GAP   = 40;    // chars behind zone before taking damage
const ZONE_TICK  = 10000; // damage check every 10 seconds

function getZonePos(startTime, totalChars) {
  if (!startTime) return 0;
  const elapsed = (Date.now() - startTime) / 1000;
  if (elapsed < ZONE_GRACE) return 0;
  const active = elapsed - ZONE_GRACE;
  return Math.min(Math.floor((active / 60) * ZONE_CPM), totalChars);
}

async function fbCreate(code,info) {
  const db=getDB(); if(!db) return;
  await db.ref('rooms/'+code).set({info:{...info,createdAt:Date.now(),status:'lobby'},players:{}});
}
async function fbJoin(code,name,lives=3) {
  const db=getDB(); if(!db) return;
  await db.ref('rooms/'+code+'/players/'+name).set({pos:0,cpm:0,errors:0,lives,status:'waiting',finishedAt:0});
}
async function fbGet(code) {
  const db=getDB(); if(!db) return null;
  const s=await db.ref('rooms/'+code).once('value'); return s.val();

function fbListen(code,cb) {
  const db=getDB(); if(!db) return ()=>{};
  const ref=db.ref('rooms/'+code);
  ref.on('value',s=>cb(s.val()));
  return ()=>ref.off('value');

// Fetch student roster for a given class code
async function fetchRoster(classCode) {
  const url = SCRIPT_URL + '?action=roster&code=' + encodeURIComponent(classCode);
  const res = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// Save one completed session to Google Sheets
// Uses GET (not POST) to avoid Apps Script redirect stripping the body.
async function saveSession(data) {
  const p = new URLSearchParams({
    action: 'saveSession',
    code:     data.classCode,
    student:  data.studentName,
    lessonId: String(data.lessonId),
    exercise: data.exerciseTitle,
    cpm:      String(data.cpm),
    wpm:      String(data.wpm),
    accuracy: String(data.accuracy),
    errors:   String(data.errors),
    chars:    String(data.totalChars),
    duration: String(data.duration),
  });
  const res = await fetch(SCRIPT_URL + '?' + p.toString(), { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function mapKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return null;
  const entry = KEYMAP[e.code];
  return entry ? (entry[e.shiftKey ? 1 : 0] ?? null) : null;
}

function validateInput(expected, typed) {
  const pos = typed.length - 1;
  if (pos < 0) return { ok: true };
  const got = typed[pos], want = expected[pos];
  if (got === want) return { ok: true, position: pos };
  if (pos >= expected.length) return { ok:false, errorType:'OVERFLOW', costsLife:true };
  const gC = CHAR_CLASS[got] ?? 'NON', wC = CHAR_CLASS[want] ?? 'NON';
  if (wC==='AV'  && gC==='TONE') return { ok:false, expected:want, got, hint:`พิมพ์สระ (${want}) ก่อนวรรณยุกต์ (${got})`, costsLife:false };
  if (wC==='TONE'&& gC==='AV')   return { ok:false, expected:want, got, hint:`พิมพ์วรรณยุกต์ (${want}) หลังสระ`,          costsLife:false };
  if (wC==='LV'  && gC==='CONS') return { ok:false, expected:want, got, hint:`สระหน้า (${want}) พิมพ์ก่อนพยัญชนะ (${got})`, costsLife:false };
  return { ok:false, hint:null, costsLife:true };
}

function findKeyForChar(char) {
  for (const [code, [u, s]] of Object.entries(KEYMAP)) {
    if (u === char) return { code, needsShift: false };
    if (s === char) return { code, needsShift: true };
  }
  return null;
}

// TEXT GENERATOR

function generateText(words, minChars) {
  const arr = [...words];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const result = [];
  let chars = 0, i = 0;
  while (chars < minChars) {
    const word = arr[i % arr.length];
    result.push(word);
    chars += [...word].length + 1;
    i++;
    if (i > arr.length * 6) break;
  }
  return result.join(' ');
}

  { id:2, label:'Chapter 2', title:'Shift ง่าย', subtitle:'ตัวอักษรที่ใช้บ่อย',    icon:'⇧',  from:'#059669', to:'#34D399', dot:'#059669', lessonIds:[5,6,7,8] },
  { id:3, label:'Chapter 3', title:'Shift ยาก',  subtitle:'ตัวอักษรหายาก',         icon:'⚡', from:'#DC2626', to:'#F87171', dot:'#DC2626', lessonIds:[9,10,11] },
  { id:4, label:'Chapter 4', title:'ตัวพิเศษ',  subtitle:'เลขไทยและเครื่องหมาย',  icon:'🔢', from:'#7C3AED', to:'#A78BFA', dot:'#7C3AED', lessonIds:[12,13] },
  { id:5, label:'Chapter 5', title:'Final Stage', subtitle:'ด่านสุดท้าย · ชิงบัลลังก์', icon:'👑', from:'#1C1917', to:'#B45309', dot:'#D97706', lessonIds:[14,15,16] },
];

// LESSON SELECTOR

function LessonScreen({ studentName, classCode, onSelect, onOpenSetup, onJoin, joinCode, setJoinCode, joinError, mpBusy, storyPath, storyPower }) {
  const savedCh=(()=>{try{return Math.min(parseInt(localStorage.getItem('lastChapter')||'0')||0,CHAPTERS.length-1);}catch{return 0;}})();
  const getExercises=(lesson)=>{
    if(!lesson.story) return lesson.exercises||[];
    if(lesson.id===15) return storyPath==='B'?(lesson.exercisesB||[]):(lesson.exercisesA||[]);
    if(lesson.id===16){
      if(storyPath==='B') return lesson.exercisesCave||[];
      return storyPower==='lightning'?(lesson.exercisesLightning||[]):(lesson.exercisesGold||[]);
    }
    return lesson.exercises||[];
  };
  const [chIdx,       setChIdx]       = useState(savedCh);
  const [openLesson,  setOpenLesson]  = useState(null);
  const [cardW,       setCardW]       = useState(0);
  const carouselRef = useRef(null);
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  useEffect(()=>{ if(carouselRef.current) setCardW(carouselRef.current.offsetWidth); },[]);

  const gotoChapter = (i) => {
    const c=Math.max(0,Math.min(i,CHAPTERS.length-1));
    setChIdx(c); setOpenLesson(null);
    try{ localStorage.setItem('lastChapter',String(c)); }catch{}
  };

  const PEEK=28, GAP=10;
  const cw = cardW>0 ? cardW-PEEK : 0;
  const stripTransform = cw>0
    ? `translateX(-${chIdx*(cw+GAP)}px)`
    : `translateX(-${chIdx*100}%)`;
  const minCardW = cw>0 ? cw+'px' : '100%';

  const atFirst = chIdx===0;
  const atLast  = chIdx===CHAPTERS.length-1;

  return (
    <div style={{fontFamily:tf}}>

      {/* ── Player badge ── */}
      {studentName&&(
        <div style={{display:'flex',alignItems:'center',gap:12,background:'#F8FAFC',
          borderRadius:14,padding:'12px 16px',marginBottom:20,border:'1.5px solid #E2E8F0'}}>
          <div style={{width:42,height:42,borderRadius:'50%',flexShrink:0,
            background:'linear-gradient(135deg,#1D4ED8,#7C3AED)',
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>👤</div>
          <div>
            <div style={{fontSize:15,fontWeight:800,color:'#0F172A'}}>{studentName}</div>
            <div style={{fontSize:11,color:'#94A3B8'}}>ห้อง {classCode}</div>
          </div>
        </div>
      )}

      {/* ── Chapter carousel ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:800,color:'#94A3B8',letterSpacing:1,
          marginBottom:12,textAlign:'center'}}>🎮 เลือก CHAPTER</div>

        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {/* Prev */}
          <button onClick={()=>gotoChapter(chIdx-1)} disabled={atFirst}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid #E2E8F0',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atFirst?'default':'pointer',
              color:atFirst?'#CBD5E1':'#64748B',opacity:atFirst?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ‹
          </button>

          {/* Card strip */}
          <div ref={carouselRef} style={{flex:1,overflow:'hidden'}}>
            <div style={{display:'flex',gap:GAP+'px',transition:'transform .35s cubic-bezier(.4,0,.2,1)',
              transform:stripTransform}}>
              {CHAPTERS.map(ch=>{
                const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
                return (
                  <div key={ch.id} style={{minWidth:minCardW,flexShrink:0}}>
                    <div style={{background:`linear-gradient(135deg,${ch.from},${ch.to})`,
                      borderRadius:18,padding:'22px 20px',textAlign:'center',
                      position:'relative',overflow:'hidden'}}>
                      <div style={{position:'absolute',top:-20,right:-20,width:80,height:80,
                        borderRadius:'50%',background:'rgba(255,255,255,.08)'}}/>
                      <div style={{fontSize:30,marginBottom:6}}>{ch.icon}</div>
                      <div style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.65)',
                        letterSpacing:1,marginBottom:3}}>{ch.label.toUpperCase()}</div>
                      <div style={{fontSize:19,fontWeight:800,color:'#fff',marginBottom:4,
                        fontFamily:tf}}>{ch.title}</div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.75)'}}>
                        {chLessons.length} บทเรียน · {ch.subtitle}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Next */}
          <button onClick={()=>gotoChapter(chIdx+1)} disabled={atLast}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid #E2E8F0',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atLast?'default':'pointer',
              color:atLast?'#CBD5E1':'#64748B',opacity:atLast?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ›
          </button>
        </div>

        {/* Dots */}
        <div style={{display:'flex',justifyContent:'center',gap:6,marginTop:10}}>
          {CHAPTERS.map((_,ci)=>(
            <div key={ci} onClick={()=>gotoChapter(ci)}
              style={{width:chIdx===ci?20:6,height:6,borderRadius:99,cursor:'pointer',
                background:chIdx===ci?(CHAPTERS[ci]?.dot||'#1D4ED8'):'#CBD5E1',
                transition:'all .25s'}}/>
          ))}
        </div>
      </div>

      {/* ── Lesson list ── */}
      {(()=>{
        const ch=CHAPTERS[chIdx];
        const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
        return (
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,fontWeight:800,color:'#94A3B8',letterSpacing:1,marginBottom:10}}>
              บทเรียนใน {ch.label.toUpperCase()}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {chLessons.map((lesson)=>{
                const ghostKey=ex=>'ghostv2_'+lesson.id+'_'+encodeURIComponent(ex.title);
                const exHasGhost=ex=>{try{return !!localStorage.getItem(ghostKey(ex));}catch{return false;}};
                const lessonExs=getExercises(lesson);
                const allDone=lessonExs.every(exHasGhost);
                const hasGhost=lessonExs.some(exHasGhost);
                const isOpen=openLesson===lesson.id;
                const cardBg=allDone?lesson.accent:'#fff';
                const cardBorder=allDone?`2px solid ${lesson.accent}`:'1.5px solid #E2E8F0';
                const numBg=allDone?'rgba(255,255,255,.22)':lesson.al;
                const numColor=allDone?'#fff':lesson.accent;
                const titleColor=allDone?'#fff':'#0F172A';
                const subColor=allDone?'rgba(255,255,255,.7)':'#94A3B8';
                const arrowColor=allDone?'rgba(255,255,255,.8)':'#94A3B8';
                return (
                  <div key={lesson.id}>
                    <div onClick={()=>setOpenLesson(o=>o===lesson.id?null:lesson.id)}
                      style={{background:cardBg,border:cardBorder,
                        borderRadius:isOpen?'12px 12px 0 0':12,
                        padding:'12px 16px',display:'flex',alignItems:'center',gap:12,
                        cursor:'pointer',transition:'opacity .15s, border-radius .1s'}}
                      onMouseEnter={e=>e.currentTarget.style.opacity='.88'}
                      onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                      <div style={{width:36,height:36,borderRadius:10,background:numBg,
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:13,fontWeight:800,color:numColor,flexShrink:0}}>
                        {lesson.id}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:800,color:titleColor}}>{lesson.thaiName}</div>
                        <div style={{fontSize:11,color:subColor,marginTop:1}}>
                          {getExercises(lesson).length} exercises{hasGhost?' · 👻':''}
                        </div>
                      </div>
                      <span style={{color:arrowColor,fontSize:16,flexShrink:0}}>{isOpen?'▲':'▼'}</span>
                    </div>
                    {isOpen&&(
                      <div style={{border:cardBorder,borderTop:'none',
                        borderRadius:'0 0 12px 12px',background:'#fff',padding:'8px 10px'}}>
                        {lessonExs.map((ex,i)=>{
                          const hasEx=exHasGhost(ex);
                          return (
                            <button key={i} onClick={()=>onSelect(lesson,ex)}
                              style={{width:'100%',display:'flex',justifyContent:'space-between',
                                alignItems:'center',
                                background:hasEx?lesson.accent:'transparent',
                                border:`1.5px solid ${lesson.accent}`,borderRadius:8,
                                padding:'7px 10px',cursor:'pointer',fontFamily:tf,
                                marginBottom:i<lessonExs.length-1?6:0,
                                transition:'opacity .1s'}}
                              onMouseEnter={e=>e.currentTarget.style.opacity='.8'}
                              onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                              <span style={{fontSize:12,fontWeight:700,
                                color:hasEx?'#fff':lesson.accent}}>{ex.title}</span>
                              <span style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                                {hasEx&&<span style={{fontSize:10}}>👻</span>}
                                <span style={{fontSize:10,
                                  color:hasEx?'rgba(255,255,255,.7)':'#94A3B8'}}>~{ex.minChars}ตัว</span>
                                <span style={{color:hasEx?'rgba(255,255,255,.8)':lesson.accent,fontSize:12}}>→</span>
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* ── Multiplayer ── */}
      <div style={{borderTop:'1.5px solid #E2E8F0',paddingTop:16}}>
        <div style={{fontSize:11,fontWeight:800,color:'#94A3B8',letterSpacing:1,
          marginBottom:12,textAlign:'center'}}>⚡ MULTIPLAYER</div>
        <div style={{display:'flex',gap:10,marginBottom:10}}>
          <button onClick={()=>onOpenSetup&&onOpenSetup('1v1')}
            style={{flex:1,background:'linear-gradient(135deg,#1D4ED8,#2563EB)',color:'#fff',
              border:'none',borderRadius:14,padding:'16px 14px',cursor:'pointer',
              textAlign:'center',fontFamily:tf,transition:'opacity .15s'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <div style={{fontSize:26,marginBottom:5}}>⚔️</div>
            <div style={{fontSize:14,fontWeight:800}}>1 vs 1</div>
            <div style={{fontSize:10,color:'#BFDBFE',marginTop:3}}>แข่ง 2 คน</div>
          </button>
          <button onClick={()=>onOpenSetup&&onOpenSetup('royale')}
            style={{flex:1,background:'linear-gradient(135deg,#92400E,#D97706)',color:'#fff',
              border:'none',borderRadius:14,padding:'16px 14px',cursor:'pointer',
              textAlign:'center',fontFamily:tf,transition:'opacity .15s'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <div style={{fontSize:26,marginBottom:5}}>🏆</div>
            <div style={{fontSize:14,fontWeight:800}}>Battle Royale</div>
            <div style={{fontSize:10,color:'#FDE68A',marginTop:3}}>แข่งหลายคน</div>
          </button>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={joinCode||''} onChange={e=>setJoinCode&&setJoinCode(e.target.value.toUpperCase())}
            onKeyDown={e=>e.key==='Enter'&&onJoin&&onJoin(joinCode)}
            placeholder="มีรหัสห้องอยู่แล้ว? — A7K2" maxLength={4}
            style={{flex:1,padding:'10px 14px',border:'1.5px solid #E2E8F0',borderRadius:10,
              fontSize:13,fontFamily:tf,outline:'none',boxSizing:'border-box'}}/>
          <button onClick={()=>onJoin&&onJoin(joinCode)}
            disabled={!joinCode||joinCode.length<4||mpBusy}
            style={{background:'#0F172A',color:'#fff',border:'none',borderRadius:10,
              padding:'10px 16px',cursor:'pointer',fontSize:13,fontWeight:700,
              opacity:(!joinCode||joinCode.length<4||mpBusy)?0.4:1,whiteSpace:'nowrap'}}>
            {mpBusy?'...':'เข้าร่วม →'}
          </button>
        </div>
        {joinError&&<div style={{fontSize:12,color:'#DC2626',marginTop:6,fontFamily:tf}}>{joinError}</div>}
      </div>
    </div>
  );
}

function ResultsScreen({ cpm, accuracy, errors, totalChars, lesson, saveStatus, studentName, ghostData, newRecord, roomCode, roomType, roomPlayers, myName, onRestart, onBack }) {
  const grade =
    accuracy>=98&&cpm>=40 ? {label:'ยอดเยี่ยม 🏆',color:'#D97706'} :
    accuracy>=95&&cpm>=25 ? {label:'ดีมาก ⭐',     color:'#2563EB'} :
    accuracy>=90           ? {label:'ดี 👍',         color:'#059669'} :
                             {label:'ฝึกต่อ 💪',    color:'#7C3AED'};
  return (
    <div style={{textAlign:'center',fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
      <div style={{fontSize:52,marginBottom:8}}>{accuracy>=95?'🎉':accuracy>=85?'👏':'💪'}</div>
      <h2 style={{fontSize:26,fontWeight:800,color:'#0F172A',marginBottom:4}}>เสร็จแล้ว!</h2>
      <div style={{color:grade.color,fontWeight:800,fontSize:18,marginBottom:ghostData||newRecord?12:22}}>
        {grade.label}
      </div>
      {/* Ghost comparison */}
      {(ghostData || newRecord) && (
        <div style={{marginBottom:22,padding:'12px 20px',borderRadius:12,
          background: !ghostData ? '#EDE9FE'
            : cpm > ghostData.cpm ? '#D1FAE5'
            : cpm === ghostData.cpm ? '#EFF6FF'
            : '#EDE9FE',
          border:`1.5px solid ${!ghostData ? '#8B5CF6'
            : cpm > ghostData.cpm ? '#059669'
            : cpm === ghostData.cpm ? '#2563EB'
            : '#8B5CF6'}`,
          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
          fontSize:15, fontWeight:700,
        }}>
          {!ghostData
            ? `👻 บันทึก Ghost แล้ว! (${cpm} KPM) — ลองแข่งรอบหน้า`
            : cpm > ghostData.cpm
            ? `🏆 ชนะ Ghost! ${cpm} vs ${ghostData.cpm} KPM${newRecord ? ' — สถิติใหม่! 🎉' : ''}`
            : cpm === ghostData.cpm
            ? `🤝 เสมอกับ Ghost! (${cpm} KPM)`
            : `👻 Ghost ชนะ — ${ghostData.cpm} vs ${cpm} KPM — สู้ต่อไป!`}
        </div>
      )}
      <div style={{display:'flex',gap:14,justifyContent:'center',marginBottom:24,flexWrap:'wrap'}}>
        <StatPill label="KPM"       value={cpm}              color={cpm>=30?'#059669':'#D97706'}/>
        <StatPill label="WPM"       value={Math.round(cpm/5)} color="#2563EB"/>
        <StatPill label="ความแม่น" value={`${accuracy}%`}   color={accuracy>=95?'#059669':'#D97706'}/>
        <StatPill label="ผิด"       value={errors}           color={errors===0?'#059669':'#EF4444'}/>
        <StatPill label="ตัวอักษร" value={totalChars}/>
      </div>
      <div style={{background:'#F1F5F9',borderRadius:12,height:10,marginBottom:22,overflow:'hidden'}}>
        <div style={{width:`${accuracy}%`,height:'100%',borderRadius:12,
          background:accuracy>=95?'#059669':accuracy>=85?'#2563EB':'#F59E0B',
          transition:'width 1s ease-out'}}/>
      </div>
      {/* Race standings */}
      {roomCode && Object.keys(roomPlayers||{}).length > 0 && (
        <div style={{background:'#F8FAFC',border:'1.5px solid #E2E8F0',borderRadius:12,
          padding:'14px 16px',marginBottom:20,textAlign:'left'}}>
          <div style={{fontSize:13,fontWeight:800,marginBottom:10,
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
            {roomType==='royale'?'🏆 Battle Royale':'⚡ 1v1'} — ผลการแข่ง</div>
          {Object.entries(roomPlayers)
            .sort((a,b)=>{
              const [,ap]=a, [,bp]=b;
              // Tier: finished (0) > still racing (1) > eliminated (2)
              const tier=p=>p.status==='done'?0:p.status==='eliminated'?2:1;
              const ta=tier(ap), tb=tier(bp);
              if (ta!==tb) return ta-tb;
              // Both finished → earliest finish time wins
              if (ta===0 && ap.finishedAt && bp.finishedAt) return ap.finishedAt-bp.finishedAt;
              // Otherwise → most characters typed
              if ((bp.pos||0)!==(ap.pos||0)) return (bp.pos||0)-(ap.pos||0);
              // Tiebreak → higher CPM
              return (bp.cpm||0)-(ap.cpm||0);
            })
            .map(([name,p],i)=>(
              <div key={name} style={{display:'flex',alignItems:'center',gap:10,
                padding:'8px 0',borderBottom:'1px solid #F1F5F9'}}>
                <span style={{fontSize:18,width:28}}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '}</span>
                <span style={{flex:1,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                  fontWeight:700,color:name===(myName||'ผู้เล่น1')?'#059669':'#0F172A',fontSize:14}}>
                  {name}
                  {p.status==='done'&&' 🏁'}
                  {p.status==='eliminated'&&' 💀'}
                </span>
                <span style={{fontSize:13,color:'#64748B'}}>{p.cpm||0} KPM</span>
              </div>
            ))}
        </div>
      )}
      <div style={{display:'flex',gap:12,justifyContent:'center'}}>
        <button onClick={onRestart} style={{background:'#0F172A',color:'#fff',border:'none',
          borderRadius:10,padding:'11px 26px',cursor:'pointer',fontSize:14,fontWeight:700}}>
          สุ่มคำใหม่ / ลองอีกครั้ง
        </button>
        <button onClick={onBack} style={{background:'#F1F5F9',color:'#0F172A',border:'none',
          borderRadius:10,padding:'11px 26px',cursor:'pointer',fontSize:14,fontWeight:600}}>
          เลือกบทเรียน
        </button>
      </div>
      {studentName && (
        <div style={{marginTop:18,fontSize:12,color:'#94A3B8',
          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
          {saveStatus==='saving' && '💾 กำลังบันทึกผล...'}
          {saveStatus==='saved'  && '✅ บันทึกผลแล้ว'}
          {saveStatus==='error'  && '⚠️ บันทึกไม่ได้ — ตรวจสอบสัญญาณ'}
        </div>
      )}
    </div>
  );
}

function generateStoryText(words, name) {
  const n = name||'นักผจญภัย';
  return words.map(w=>w.replace(/__NAME__/g,n)).join(' ');
}

function StoryChoiceScreen({ exercise, adventureName, onChoose }) {
  return <div>choice</div>;
}

function NameModal({ onConfirm }) {
  return <div><button onClick={()=>onConfirm('test')}>OK</button></div>;
}

// MAIN APP// MAIN APP

const CLASS_NAMES = {
  LV:'สระหน้า',CONS:'พยัญชนะ',FV:'สระหลัง',AV:'สระบน',
  BV:'สระล่าง',BD:'จุดล่าง',TONE:'วรรณยุกต์',AD:'ทัณฑฆาต',NON:'อื่นๆ',
};

function ThaiTypingApp() {
  const [screen,        setScreen]        = useState(SCRIPT_URL ? 'join' : 'lessons');
  const [classCode,     setClassCode]     = useState('');
  const [studentName,   setStudentName]   = useState('');
  const [displayName,   setDisplayName]   = useState('');
  const [students,      setStudents]      = useState([]);
  const [saveStatus,    setSaveStatus]    = useState('idle'); // idle|saving|saved|error
  const [lesson,        setLesson]        = useState(null);
  const [exercise,      setExercise]      = useState(null);
  const [target,        setTarget]        = useState('');
  const [pos,           setPos]           = useState(0);
  const [errors,        setErrors]        = useState(0);
  const [startTime,     setStartTime]     = useState(null);
  const [endTime,       setEndTime]       = useState(null);
  const [hint,          setHint]          = useState(null);
  const [flashCode,     setFlashCode]     = useState(null);
  const [shiftHeld,     setShiftHeld]     = useState(false);
  const [capsLockOn,    setCapsLockOn]    = useState(false);
  const [now,           setNow]           = useState(Date.now());
  const [penaltySecs,   setPenaltySecs]   = useState(0);  // >0 = frozen by spam penalty
  const [maxLives,      setMaxLives]      = useState(3);  // BR life count for this room
  const [pressureSecs,  setPressureSecs]  = useState(0);  // 1v1 countdown after opponent finishes
  // Multiplayer (Phase 4)
  const [roomCode,    setRoomCode]    = useState('');
  const [roomType,    setRoomType]    = useState(''); // '1v1'|'royale'
  const [isHost,      setIsHost]      = useState(false);
  const [roomPlayers, setRoomPlayers] = useState({});
  const [roomInfo,    setRoomInfo]    = useState(null);
  const [playerLives, setPlayerLives] = useState(3);
  const [countNum,    setCountNum]    = useState(3);
  const [joinCode,    setJoinCode]    = useState('');
  const [joinError,   setJoinError]   = useState('');
  const [mpBusy,      setMpBusy]      = useState(false);
  const [raceStand,   setRaceStand]   = useState([]);
  const [mpSetupMode, setMpSetupMode] = useState(''); // '1v1'|'royale'
  const [zonePos,     setZonePos]     = useState(0); // safe zone boundary position
  const [ghostData,     setGhostData]     = useState(null);  // best previous run {timings,cpm,accuracy}
  const [ghostPos,      setGhostPos]      = useState(0);     // ghost's current character position
  const [ghostKey,      setGhostKey]      = useState('');    // localStorage key for this exercise
  const [newRecord,     setNewRecord]     = useState(false); // did this run set a new ghost record?
  const [adventureName, setAdventureName] = useState(()=>{ try{return localStorage.getItem('adventureName')||'';}catch(e){return '';} });
  const [storyPath,     setStoryPath]     = useState(()=>{ try{return localStorage.getItem('storyPath')||'';}catch(e){return '';} });
  const [storyPower,    setStoryPower]    = useState(()=>{ try{return localStorage.getItem('storyPower')||'';}catch(e){return '';} });
  const [showNameModal, setShowNameModal] = useState(false);
  const pendingStoryRef = useRef(null);

  const keystrokeTimes = useRef([]);
  const errorTimes     = useRef([]);
  const hasSaved       = useRef(false);   // prevents double-save on same results screen
  const fbUnsub        = useRef(null);    // Firebase listener cleanup
  const lastFBUp       = useRef(0);       // throttle Firebase position writes
  const rcRef          = useRef('');      // roomCode ref (avoids stale closures)
  const rtRef          = useRef('');      // roomType ref
  const plRef          = useRef(3);       // playerLives ref
  const snRef          = useRef('');      // studentName ref
  const myRoomName     = useRef('');      // name used when joining/creating room (used for all Firebase writes)
  const currentTimings = useRef([]);       // inter-keystroke intervals for ghost recording
  const lastCorrectTime= useRef(null);     // timestamp of last correct keypress
  const frozenRef      = useRef(false);    // true while spam penalty is active
  const raceEndedRef   = useRef(false);    // guards against double race-end triggers
  const pressCountRef  = useRef(0);        // total keypresses for KPM calculation

  // ── Derived values — declared early so all effects can reference them ──
  const targetChars = target ? [...target] : [];
  const totalChars  = targetChars.length;
  // Split target into ~2-line word-boundary chunks (see buildChunks above)
  const chunks = buildChunks(targetChars);
  // Derive chunkIdx from pos — always in sync, no stale-state lag
  const chunkIdx = (() => {
    for (let i=0; i<chunks.length; i++) { if (pos < chunks[i].end) return i; }
    return Math.max(0, chunks.length-1);
  })();
  const curChunk    = chunks[chunkIdx] || {start:0, end:totalChars};
  const displayChars = targetChars.slice(curChunk.start, curChunk.end);
  const displayPos   = Math.max(0, pos - curChunk.start);

  const elapsed     = startTime ? ((endTime??now)-startTime)/60000 : 0;
  const kpm         = elapsed>0 ? Math.round(pressCountRef.current/elapsed) : 0;
  const wpm         = elapsed>0 ? Math.round(pos/elapsed/5) : 0;
  const accuracy    = (pos+errors)>0 ? Math.round((pos/(pos+errors))*100) : 100;
  const isEliminated = roomType==='royale' && playerLives<=0;
  const nextChar    = pos<targetChars.length ? targetChars[pos] : null;
  const nextKey     = nextChar ? findKeyForChar(nextChar) : null;
  const nextCode    = nextKey?.code ?? null;
  const needsShift  = nextKey?.needsShift ?? false;
  // Correct shift hand: left-hand target → Right Shift; right-hand target → Left Shift
  const correctShiftCode = (needsShift && nextCode)
    ? (['LP','LR','LM','LI'].includes(KEY_META[nextCode]?.f) ? 'ShiftRight' : 'ShiftLeft')
    : null;

  // Hide loading screen after React's first render completes
  useEffect(() => {
    const el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }, []);

  useEffect(() => {
    if (screen!=='practice'||!startTime||endTime) return;
    const id=setInterval(()=>setNow(Date.now()),500);
    return ()=>clearInterval(id);
  },[screen,startTime,endTime]);

  // Spam penalty freeze — 5s, then resume the SAME race at the same position
  useEffect(() => {
    if (penaltySecs<=0) return;
    const t=setTimeout(()=>{
      const next=penaltySecs-1;
      setPenaltySecs(next);
      if (next<=0) {
        frozenRef.current=false;
        keystrokeTimes.current=[]; errorTimes.current=[];
        lastCorrectTime.current=null;   // don't count frozen time as a keystroke gap
      }
    },1000);
    return ()=>clearTimeout(t);
  },[penaltySecs]);

  // 1v1 pressure timer — starts when the opponent finishes first
  useEffect(() => {
    if (pressureSecs<=0) return;
    const t=setTimeout(()=>{
      const next=pressureSecs-1;
      setPressureSecs(next);
      if (next<=0 && screen==='practice') {
        setEndTime(Date.now());
        setScreen('results');
      }
    },1000);
    return ()=>clearTimeout(t);
  },[pressureSecs,screen]);

  // Firebase room listener — active during lobby / countdown / practice
  useEffect(() => {
    if (!roomCode) return;
    if (screen!=='mp-lobby' && screen!=='countdown' && screen!=='practice') return;
    const unsub = fbListen(roomCode, (data) => {
      if (!data) return;
      setRoomInfo(data.info);
      const pl = data.players || {};
      setRoomPlayers(pl);
      if (data.info?.maxLives) setMaxLives(data.info.maxLives);

      // ── Lobby/countdown: host manually triggers countdown ──
      if (data.info?.status==='countdown' && screen==='mp-lobby') setScreen('countdown');

      // ── Practice: race-end detection (consolidated here to avoid dual-listener issues) ──
      if (screen==='practice') {
        const type     = data.info?.type;
        const me       = myRoomName.current||snRef.current||'ผู้เล่น1';
        const entries  = Object.entries(pl);
        const someoneDone = entries.some(([,p])=>p.status==='done');
        const iAmDone  = pl[me]?.status==='done';

        if (type==='royale') {
          const stillRacing = entries.filter(([,p])=>
            p.status!=='eliminated' && p.status!=='done');
          const lastStanding = entries.length>=2 && stillRacing.length<=1 && !someoneDone;
          if ((someoneDone || lastStanding) && !raceEndedRef.current) {
            raceEndedRef.current=true;
            setEndTime(Date.now());
            setTimeout(()=>setScreen(s=>s==='practice'?'results':s),400);
          }
        } else if (type==='1v1') {
          if (someoneDone && !iAmDone && !raceEndedRef.current) {
            raceEndedRef.current=true;
            setPressureSecs(PRESSURE_SECS);
          }
        }
      }
    });
    fbUnsub.current = unsub;
    return () => { unsub(); fbUnsub.current=null; };
  },[roomCode, screen, isHost]);

  // Countdown 3,2,1 → start race
  useEffect(() => {
    if (screen !== 'countdown') return;
    let n=3; setCountNum(n);
    const id = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(id);
        // Reset practice state and begin race
        setPos(0); setErrors(0); setStartTime(null); setEndTime(null);
        setHint(null); setFlashCode(null); setShiftHeld(false); setNow(Date.now());
        keystrokeTimes.current=[]; errorTimes.current=[];
        currentTimings.current=[]; lastCorrectTime.current=null;
        hasSaved.current=false; setSaveStatus('idle');
        setNewRecord(false); setGhostPos(0);
        setPlayerLives(maxLives); plRef.current=maxLives;
        setRaceStand([]); setZonePos(0);
        setPenaltySecs(0); setPressureSecs(0);
        frozenRef.current=false; raceEndedRef.current=false;
        pressCountRef.current=0;
        setScreen('practice');
        // Race-end detection is now in the lobby useEffect listener (consolidated)
      } else { setCountNum(n); }
    }, 1000);
    return () => clearInterval(id);
  },[screen]);

  // Live zone position ticker (updates every second for smooth UI)
  useEffect(() => {
    if (screen !== 'practice' || roomType !== 'royale' || !startTime) return;
    const id = setInterval(() => setZonePos(getZonePos(startTime, totalChars)), 1000);
    return () => clearInterval(id);
  }, [screen, roomType, startTime, totalChars]);

  // Zone damage check (every ZONE_TICK ms during BR)
  useEffect(() => {
    if (screen !== 'practice' || roomType !== 'royale' || !startTime) return;
    const id = setInterval(() => {
      const zp  = getZonePos(stateRef.current.startTime, totalChars);
      const myPos = stateRef.current.pos;
      if (zp > 0 && myPos < zp - ZONE_GAP) {
        const newLives = Math.max(0, plRef.current - 1);
        setPlayerLives(newLives); plRef.current = newLives;
        fbUpdatePlayer(rcRef.current, myRoomName.current||snRef.current||'Player', {lives:newLives});
        if (newLives === 0) {
          fbUpdatePlayer(rcRef.current, myRoomName.current||snRef.current||'Player', {status:'eliminated'});
        }
      }
    }, ZONE_TICK);
    return () => clearInterval(id);
  }, [screen, roomType, startTime]);

  // Animate the ghost cursor during practice
  useEffect(() => {
    if (screen !== 'practice' || !ghostData || !startTime) return;
    const id = setInterval(() => {
      const elapsed = Date.now() - startTime;
      let cum = 0, gp = 0;
      for (const t of ghostData.timings) {
        cum += t;
        if (cum <= elapsed) gp++;
        else break;
      }
      setGhostPos(Math.min(gp, ghostData.timings.length));
    }, 60);
    return () => clearInterval(id);
  }, [screen, ghostData, startTime]);

  // Save ghost to localStorage when results screen appears
  useEffect(() => {
    if (screen !== 'results') return;
    if (currentTimings.current.length < 5) return;   // too short to be meaningful
    const elapsed = startTime && endTime ? (endTime - startTime) / 60000 : 0;
    const finalKpm = elapsed > 0 ? Math.round(pressCountRef.current / elapsed) : 0;
    const finalAcc = (pos + errors) > 0 ? Math.round((pos / (pos + errors)) * 100) : 100;
    if (finalKpm < 5 || finalAcc < 70) return;       // too poor to save
    try {
      const existing   = localStorage.getItem(ghostKey);
      const existingData = existing ? JSON.parse(existing) : null;
      if (!existingData || finalKpm > existingData.cpm) {
        localStorage.setItem(ghostKey, JSON.stringify({
          timings:  [...currentTimings.current],
          cpm:      finalKpm,
          accuracy: finalAcc,
        }));
        setNewRecord(true);
      }
    } catch (e) { /* localStorage unavailable */ }
  }, [screen]);

  // Save session to Google Sheets when results screen appears (class mode only)
  useEffect(() => {
    if (screen !== 'results') return;
    if (!studentName || !SCRIPT_URL) return;
    if (hasSaved.current) return;         // guard — only save once per results view
    hasSaved.current = true;
    setSaveStatus('saving');
    const elapsed = startTime && endTime ? (endTime - startTime) / 60000 : 0;
    const finalKpm = elapsed > 0 ? Math.round(pressCountRef.current / elapsed) : 0;
    const finalAcc = (pos + errors) > 0 ? Math.round((pos / (pos + errors)) * 100) : 100;
    saveSession({
      classCode, studentName,
      lessonId: lesson?.id || 0,
      exerciseTitle: exercise?.title || '',
      cpm: finalKpm, wpm: Math.round(finalKpm / 5),
      accuracy: finalAcc, errors,
      totalChars: pos,
      duration: endTime && startTime ? Math.round((endTime - startTime) / 1000) : 0,
    })
      .then(d => setSaveStatus(d.ok ? 'saved' : 'error'))
      .catch(()  => setSaveStatus('error'));
  }, [screen]);

  const stateRef = useRef({});
  stateRef.current = { pos, target, targetChars, startTime };
  rcRef.current = roomCode; rtRef.current = roomType;
  plRef.current = playerLives; snRef.current = studentName;

  const startExercise = useCallback((les,ex) => {
    if (les.story && les.id===14) {
      const nm=(()=>{try{return localStorage.getItem('adventureName')||'';}catch(e){return '';}})();
      if (!nm) { pendingStoryRef.current={les,ex}; setShowNameModal(true); return; }
    }
    setLesson(les); setExercise(ex);
    if (les.story) {
      const nm=(()=>{try{return localStorage.getItem('adventureName')||'นักผจญภัย';}catch(e){return 'นักผจญภัย';}})();
      setTarget(generateStoryText(ex.words, nm));
    } else {
      setTarget(generateText(ex.words,ex.minChars));
    }
    setPos(0); setErrors(0); setStartTime(null); setEndTime(null);
    setHint(null); setFlashCode(null); setShiftHeld(false); setNow(Date.now());
    keystrokeTimes.current=[]; errorTimes.current=[];
    currentTimings.current=[]; lastCorrectTime.current=null;
    hasSaved.current = false;
    frozenRef.current = false; raceEndedRef.current = false;
    pressCountRef.current = 0;
    setPenaltySecs(0); setPressureSecs(0);
    setSaveStatus('idle');
    setNewRecord(false);
    setGhostPos(0);
    const gk = (les.story?'story_':'ghostv2_') + les.id + '_' + encodeURIComponent(ex.title);
    setGhostKey(gk);
    try {
      const saved = localStorage.getItem(gk);
      setGhostData(saved ? JSON.parse(saved) : null);
    } catch { setGhostData(null); }
    setScreen('practice');
  },[]);

  // Create a 1v1 room for a specific exercise
  const handleCreate1v1 = useCallback(async (les) => {
    setMpBusy(true); setJoinError('');
    const code = makeCode();
    // Combine all words from the lesson's word bank for the race
    const allWords = [...new Set(les.exercises.flatMap(ex=>ex.words))];
    const text = generateText(allWords, 200);
    try {
      await fbCreate(code,{type:'1v1',lessonId:les.id,
        exerciseTitle:les.thaiName,targetText:text,
        hostName:snRef.current||'ผู้เล่น1'});
      const h1name = snRef.current || 'ผู้เล่น1';
      myRoomName.current = h1name;
      await fbJoin(code, h1name);
      setRoomCode(code); rcRef.current=code;
      setRoomType('1v1'); rtRef.current='1v1';
      setIsHost(true);
      setLesson(les); setExercise(null); setTarget(text);
      setScreen('mp-lobby');
    } catch(e) { setJoinError('สร้างห้องไม่ได้: '+e.message); }
    setMpBusy(false);
  },[]);

  // Create a Battle Royale room (called from teacher panel link)
  const handleCreateBR = useCallback(async (les, lives=3) => {
    setMpBusy(true); setJoinError('');
    const code = makeCode();
    // Combine all words from lesson for BR — longer text, more competitive
    const allWords = [...new Set(les.exercises.flatMap(ex=>ex.words))];
    const text = generateText(allWords, 500);
    try {
      await fbCreate(code,{type:'royale',lessonId:les.id,
        exerciseTitle:les.thaiName,targetText:text,maxLives:lives,
        hostName:snRef.current||'ครู'});
      const hBRname = snRef.current || 'ครู';
      myRoomName.current = hBRname;
      await fbJoin(code, hBRname, lives);
      setMaxLives(lives); setPlayerLives(lives); plRef.current=lives;
      setRoomCode(code); rcRef.current=code;
      setRoomType('royale'); rtRef.current='royale';
      setIsHost(true);
      setLesson(les); setExercise(null); setTarget(text);
      setScreen('mp-lobby');
    } catch(e) { setJoinError('สร้างห้องไม่ได้'); }
    setMpBusy(false);
  },[]);

  // Join an existing room by code
  const handleJoin = useCallback(async (code) => {
    if (!code.trim()) return;
    setMpBusy(true); setJoinError('');
    try {
      const data = await fbGet(code.trim().toUpperCase());
      if (!data) { setJoinError('ไม่พบห้อง '+code.toUpperCase()); setMpBusy(false); return; }
      if (data.info?.status!=='lobby') { setJoinError('ห้องนี้กำลังแข่งอยู่แล้ว'); setMpBusy(false); return; }
      const name = snRef.current || ('ผู้เล่น'+(Object.keys(data.players||{}).length+1));
      myRoomName.current = name;
      const rl = data.info?.maxLives || 3;
      setMaxLives(rl); setPlayerLives(rl); plRef.current=rl;
      await fbJoin(code.trim().toUpperCase(), name, rl);
      const les = LESSONS.find(l=>l.id===data.info.lessonId)||null;
      setRoomCode(code.trim().toUpperCase()); rcRef.current=code.trim().toUpperCase();
      setRoomType(data.info.type); rtRef.current=data.info.type;
      setIsHost(false);
      setLesson(les); setTarget(data.info.targetText);
      setScreen('mp-lobby');
    } catch(e) { setJoinError('เชื่อมต่อไม่ได้'); }
    setMpBusy(false);
  },[]);

  // Host starts Battle Royale manually
  const handleStartRace = useCallback(async () => {
    await fbSetStatus(rcRef.current,'countdown');
  },[]);

  // Leave/cleanup room
  const handleLeaveRoom = useCallback(async () => {
    const code=rcRef.current, name=snRef.current||'ผู้เล่น1';
    if (code) {
      try {
        await getDB()?.ref('rooms/'+code+'/players/'+(myRoomName.current||name)).remove();
        if (isHost) await fbRemove(code);
      } catch{}
    }
    if (fbUnsub.current) { fbUnsub.current(); fbUnsub.current=null; }
    setRoomCode(''); rcRef.current='';
    setRoomType(''); rtRef.current='';
    setIsHost(false); setRoomPlayers({}); setRoomInfo(null);
    setPressureSecs(0); setPenaltySecs(0);
    frozenRef.current=false; raceEndedRef.current=false;
    myRoomName.current='';
    setScreen('lessons');
  },[isHost]);

  // Log the student out → back to join screen
  const handleLogout = useCallback(() => {
    setClassCode(''); setStudentName(''); setDisplayName(''); setStudents([]);
    setLesson(null); setExercise(null); setTarget(''); setPos(0);
    setErrors(0); setStartTime(null); setEndTime(null); setSaveStatus('idle');
    setScreen(SCRIPT_URL ? 'join' : 'lessons');
  },[]);

  useEffect(() => {
    if (screen!=='practice') return;
    const handleKeyDown=(e)=>{
      if (e.key==='Shift') { setShiftHeld(true); return; }
      if (e.key==='CapsLock') { setCapsLockOn(e.getModifierState('CapsLock')); return; }
      if (e.ctrlKey||e.altKey||e.metaKey) return;
      e.preventDefault();
      if (frozenRef.current) return;   // spam penalty active — ignore typing
      if (e.key==='Escape') { setScreen('lessons'); return; }
      const { pos,target,targetChars,startTime } = stateRef.current;
      if (e.code==='Backspace') {
        if (pos>0) setPos(p=>p-1);
        setHint(null); return;
      }
      const char=mapKey(e);
      if (!char) return;

      // Compute needsShift from current position (stateRef) for KPM counting
      const _nextChForKPM = pos<targetChars.length ? targetChars[pos] : null;
      const _needsShiftForKPM = _nextChForKPM ? (findKeyForChar(_nextChForKPM)?.needsShift??false) : false;

      // SPAM CHECK 1: speed
      const nowMs=Date.now();
      const kBuf=keystrokeTimes.current;
      kBuf.push(nowMs);
      if (kBuf.length>15) kBuf.shift();
      if (kBuf.length>=8) {
        const span=kBuf[kBuf.length-1]-kBuf[0];
        if (span>0 && ((kBuf.length-1)/span)*60000>SPEED_CPM) {
          keystrokeTimes.current=[]; errorTimes.current=[];
          frozenRef.current=true; setPenaltySecs(SPAM_PENALTY); return;
        }
      }

      if (!startTime) setStartTime(Date.now());
      const typedSoFar=targetChars.slice(0,pos).join('')+char;
      const result=validateInput(target,typedSoFar);

      if (result.ok) {
        setHint(null); setFlashCode(null);
        // Count keypresses for KPM: +1 for the key, +1 extra for shift when needed
        pressCountRef.current += _needsShiftForKPM ? 2 : 1;
        // Record timing for ghost replay
        const nowForGhost = Date.now();
        if (lastCorrectTime.current !== null) {
          currentTimings.current.push(nowForGhost - lastCorrectTime.current);
        }
        lastCorrectTime.current = nowForGhost;
        setPos(p=>{
          const next=p+1;
          if (next>=targetChars.length){
            setEndTime(Date.now());
            // Mark race finish in Firebase
            if (rcRef.current) {
              fbUpdatePlayer(rcRef.current, myRoomName.current||snRef.current||'ผู้เล่น1',
                {pos:next,status:'done',finishedAt:Date.now()});
              fbSetStatus(rcRef.current,'done').catch(()=>{});
            }
            setTimeout(()=>setScreen('results'),600);
          }
          return next;
        });
        // Throttled Firebase position sync
        if (rcRef.current) {
          const nowFB=Date.now();
          if (nowFB-lastFBUp.current>350) {
            lastFBUp.current=nowFB;
            const el=stateRef.current.startTime?(nowFB-stateRef.current.startTime)/60000:0;
            const np=stateRef.current.pos+1;
            const nc=el>0?Math.round(np/el):0;
            fbUpdatePlayer(rcRef.current,myRoomName.current||snRef.current||'ผู้เล่น1',{pos:np,cpm:nc,status:'racing'});
          }
        }
      } else {
        if (result.costsLife) {
          setErrors(er=>er+1);
          setFlashCode(e.code);
          setTimeout(()=>setFlashCode(null),400);
          // Battle Royale lives
          if (rcRef.current && rtRef.current==='royale') {
            const newLives=Math.max(0,plRef.current-1);
            setPlayerLives(newLives); plRef.current=newLives;
            fbUpdatePlayer(rcRef.current,myRoomName.current||snRef.current||'ผู้เล่น1',{lives:newLives});
            if (newLives===0) {
              // Eliminated — screen greys out but the student keeps typing for practice
              fbUpdatePlayer(rcRef.current,myRoomName.current||snRef.current||'ผู้เล่น1',{status:'eliminated'});
            }
          }
          // SPAM CHECK 2: error burst
          const eBuf=errorTimes.current;
          eBuf.push(nowMs);
          const cutoff=nowMs-ERROR_WINDOW_MS;
          while (eBuf.length&&eBuf[0]<cutoff) eBuf.shift();
          if (eBuf.length>=ERROR_BURST) {
            keystrokeTimes.current=[]; errorTimes.current=[];
            frozenRef.current=true; setPenaltySecs(SPAM_PENALTY); return;
          }
        }
        if (result.hint) setHint(result.hint);
      }
    };
    const handleKeyUp=(e)=>{ if (e.key==='Shift') setShiftHeld(false); };
    window.addEventListener('keydown',handleKeyDown);
    window.addEventListener('keyup',handleKeyUp);
    return ()=>{ window.removeEventListener('keydown',handleKeyDown); window.removeEventListener('keyup',handleKeyUp); };
  },[screen]);

  return (
    <div style={{minHeight:'100vh',background:'#F1F5F9',fontFamily:'system-ui,sans-serif',
      display:'flex',flexDirection:'column',alignItems:'center',padding:'24px 16px 40px'}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');`}</style>

      {penaltySecs>0 && <PenaltyScreen countdown={penaltySecs}/>}
      {showNameModal && (
        <NameModal onConfirm={(name)=>{
          setAdventureName(name);
          try{localStorage.setItem('adventureName',name);}catch(e){}
          setShowNameModal(false);
          if(pendingStoryRef.current){
            const p=pendingStoryRef.current; pendingStoryRef.current=null;
            setTimeout(()=>startExercise(p.les,p.ex),80);
          }
        }}/>
      )}

      {/* Header */}
      <div style={{width:'100%',maxWidth:860,display:'flex',
        justifyContent:'space-between',alignItems:'center',marginBottom:22}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:26}}>⌨️</span>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:'#0F172A',
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>แบบฝึกพิมพ์ภาษาไทย</div>
            <div style={{fontSize:10,color:'#94A3B8'}}>Thai Typing Practice — Kedmanee (TIS 820-2538)</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {/* Student badge */}
          {studentName && (
            <div style={{background:'#F1F5F9',border:'1.5px solid #E2E8F0',
              borderRadius:8,padding:'5px 10px',fontSize:11,color:'#475569',
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
              ห้อง {classCode} | <strong>{studentName}</strong>
            </div>
          )}
          {/* Back to lessons */}
          {screen!=='lessons'&&screen!=='join'&&screen!=='roster'&&screen!=='spam'&&(
            <button onClick={()=>setScreen('lessons')} style={{background:'transparent',
              border:'1.5px solid #CBD5E1',borderRadius:8,padding:'6px 12px',cursor:'pointer',
              fontSize:11,color:'#64748B',fontWeight:600,
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>← บทเรียน</button>
          )}
          {/* Logout (class mode only) */}
          {studentName && (
            <button onClick={handleLogout} style={{background:'transparent',
              border:'1.5px solid #FCA5A5',borderRadius:8,padding:'6px 12px',cursor:'pointer',
              fontSize:11,color:'#DC2626',fontWeight:600,
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>ออกจากระบบ</button>
          )}
          {/* Link to teacher panel */}
          <a href="teacher.html" style={{fontSize:11,color:'#94A3B8',textDecoration:'none',
            fontWeight:600,padding:'6px 10px',border:'1.5px solid #E2E8F0',borderRadius:8,
            display:'flex',alignItems:'center',gap:3}}>🎓 ครู</a>
        </div>
      </div>

      {/* Card */}
      <div style={{width:'100%',maxWidth:860,background:'#fff',borderRadius:20,
        boxShadow:'0 4px 24px rgba(0,0,0,.08)',padding:'30px 26px'}}>

        {screen==='join' && (
          <JoinScreen
            onJoin={(code, sts) => { setClassCode(code); setStudents(sts); setScreen('roster'); }}
            onSolo={() => { setClassCode(''); setStudentName(''); setScreen('lessons'); }}
          />
        )}
        {screen==='roster' && (
          <RosterScreen
            classCode={classCode}
            students={students}
            onSelect={s => { setStudentName(s.name); setDisplayName(s.displayName||s.name); setScreen('lessons'); }}
            onBack={() => setScreen('join')}
          />
        )}
        {screen==='lessons' && (
          <LessonScreen onSelect={startExercise}
            onOpenSetup={(mode)=>{ setMpSetupMode(mode); setScreen('mp-setup'); }}
            onJoin={handleJoin}
            joinCode={joinCode} setJoinCode={setJoinCode}
            joinError={joinError} mpBusy={mpBusy}
            studentName={studentName} classCode={classCode}
            storyPath={storyPath} storyPower={storyPower}/>
        )}

        {screen==='practice'&&lesson&&target&&(
          <div style={isEliminated?{filter:'grayscale(1)',opacity:.65,transition:'filter .6s, opacity .6s'}:undefined}>
            {/* Eliminated banner — student keeps typing for practice */}
            {isEliminated&&(
              <div style={{background:'#1F2937',borderRadius:12,padding:'12px 16px',
                marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:24}}>💀</span>
                <div>
                  <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                    fontSize:15,fontWeight:800,color:'#fff'}}>ถูกคัดออกแล้ว</div>
                  <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                    fontSize:12,color:'#9CA3AF'}}>พิมพ์ต่อได้เพื่อฝึกซ้อม — รอดูผลตอนจบรอบ</div>
                </div>
              </div>
            )}
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:18,flexWrap:'wrap'}}>
              <div style={{background:'#1D4ED8',color:'#fff',borderRadius:99,
                padding:'4px 12px',fontSize:10,fontWeight:800,letterSpacing:.5,whiteSpace:'nowrap'}}>
                {lesson.thaiName.toUpperCase()}</div>
              <div style={{background:lesson.al,color:lesson.accent,borderRadius:99,
                padding:'4px 12px',fontSize:10,fontWeight:800,whiteSpace:'nowrap',
                fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                {exercise?.title ?? (roomType==='royale'?'🏆 Battle Royale':'⚡ 1v1')}</div>
              <div style={{fontSize:10,color:'#94A3B8'}}>🎲</div>
              <div style={{marginLeft:'auto',fontSize:10,color:'#94A3B8'}}>Esc = ออก</div>
            </div>

            <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
              <StatPill label="WPM"       value={wpm}               color="#2563EB"/>
              <StatPill label="ความแม่น" value={`${accuracy}%`}   color={accuracy>=95?'#059669':'#D97706'}/>
              <StatPill label="ผิด"       value={errors}           color={errors===0?'#0F172A':'#EF4444'}/>
              <div style={{flex:1,minWidth:120}}>
                <div style={{fontSize:10,color:'#94A3B8',marginBottom:5,fontWeight:600}}>
                  {pos} / {totalChars} ตัวอักษร</div>
                {/* Progress bar with optional zone marker */}
                <div style={{position:'relative',height:10}}>
                  <div style={{position:'absolute',inset:0,background:'#F1F5F9',borderRadius:8,overflow:'hidden'}}>
                    <div style={{width:`${totalChars>0?(pos/totalChars)*100:0}%`,height:'100%',
                      borderRadius:8,background:lesson?.accent??'#059669',transition:'width .15s'}}/>
                  </div>
                  {/* Zone marker — red line on the bar */}
                  {roomType==='royale'&&zonePos>0&&(
                    <div style={{position:'absolute',top:-2,bottom:-2,
                      left:`${Math.min((zonePos/totalChars)*100,100)}%`,
                      width:3,background:'#EF4444',borderRadius:2,
                      boxShadow:'0 0 6px #EF4444',zIndex:2,transition:'left 1s linear'}}/>
                  )}
                </div>
                {ghostData && (
                  <div style={{marginTop:5}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                      <span style={{fontSize:9,color:'#8B5CF6',fontWeight:700,
                        fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                        👻 Ghost {ghostData.cpm} CPM</span>
                      <span style={{fontSize:9,color:'#8B5CF6'}}>
                        {Math.round((ghostPos/totalChars)*100)}%</span>
                    </div>
                    <div style={{background:'#F1F5F9',borderRadius:6,height:5,overflow:'hidden'}}>
                      <div style={{width:`${totalChars>0?(ghostPos/totalChars)*100:0}%`,
                        height:'100%',borderRadius:6,background:'#8B5CF6',
                        transition:'width .06s'}}/>
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div style={{background:'#F8FAFC',borderRadius:14,padding:'22px 18px',
              marginBottom:14,border:'1.5px solid #E2E8F0',minHeight:96,
              display:'flex',alignItems:'center',justifyContent:'center'}}>
              <TextDisplay displayChars={displayChars} displayPos={displayPos}/>
            </div>

            {nextChar&&(
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,
                padding:'9px 14px',background:'#EFF6FF',borderRadius:9,
                border:'1.5px solid #BFDBFE'}}>
                <span style={{fontSize:10,color:'#2563EB',fontWeight:700,
                  fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>กำลังพิมพ์:</span>
                <span style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                  fontSize:22,fontWeight:800,color:'#1D4ED8'}}>
                  {nextChar===' '?'(เว้นวรรค)':nextChar}</span>
                <span style={{fontSize:10,color:'#3B82F6',
                  fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                  {CLASS_NAMES[CHAR_CLASS[nextChar]]??''}</span>
                {nextKey&&(
                  <span style={{marginLeft:'auto',fontSize:10,color:'#3B82F6',fontWeight:700}}>
                    {needsShift?'⇧ + ':''}
                    {nextKey.code.replace('Key','').replace('Digit','')
                      .replace('BracketLeft','[').replace('BracketRight',']')
                      .replace('Semicolon',';').replace('Quote',"'")
                      .replace('Comma',',').replace('Period','.').replace('Slash','/')}
                  </span>
                )}
              </div>
            )}

            {hint&&(
              <div style={{padding:'9px 14px',background:'#FEF3C7',borderRadius:9,
                border:'1.5px solid #FCD34D',marginBottom:10,
                display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:16}}>💡</span>
                <span style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                  fontSize:13,color:'#92400E',fontWeight:600}}>{hint}</span>
              </div>
            )}

            {/* 1v1 pressure timer — opponent already finished */}
            {pressureSecs>0&&(
              <div style={{background:'#FEF2F2',border:'2px solid #EF4444',borderRadius:12,
                padding:'12px 16px',marginBottom:12,display:'flex',alignItems:'center',gap:14,
                animation:'none'}}>
                <span style={{fontSize:30,fontWeight:800,color:'#DC2626',minWidth:44,
                  textAlign:'center'}}>{pressureSecs}</span>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                    fontSize:14,fontWeight:800,color:'#DC2626'}}>
                    คู่แข่งพิมพ์เสร็จแล้ว! รีบพิมพ์ให้จบ!</div>
                  <div style={{background:'#FECACA',borderRadius:6,height:6,marginTop:6,overflow:'hidden'}}>
                    <div style={{width:`${(pressureSecs/PRESSURE_SECS)*100}%`,height:'100%',
                      background:'#DC2626',borderRadius:6,transition:'width 1s linear'}}/>
                  </div>
                </div>
              </div>
            )}
            {/* Zone warning — BR only */}
            {roomType==='royale'&&roomCode&&zonePos>0&&pos<(zonePos-ZONE_GAP+10)&&(
              <div style={{background:'#FEF2F2',border:'1.5px solid #FCA5A5',borderRadius:10,
                padding:'8px 14px',marginBottom:10,display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:18}}>⚠️</span>
                <span style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                  fontSize:13,fontWeight:700,color:'#DC2626'}}>
                  กำลังออกนอก Safe Zone! ต้องไวกว่านี้แล้วนะ !
                </span>
              </div>
            )}
            {/* Opponents panel */}
            {roomCode&&Object.keys(roomPlayers).length>0&&(
              <div style={{background:'#F8FAFC',borderRadius:12,padding:'12px 14px',
                marginBottom:10,border:'1.5px solid #E2E8F0'}}>
                <div style={{fontSize:11,color:'#64748B',fontWeight:700,marginBottom:10,
                  fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                  {roomType==='royale'?'🏆 Battle Royale':'⚡ 1v1'} — ห้อง {roomCode}
                </div>
                {Object.entries(roomPlayers).map(([name,p])=>{
                  const isMe=name===(myRoomName.current||studentName||'ผู้เล่น1');
                  const pct=totalChars>0?Math.round((p.pos/totalChars)*100):0;
                  const col=p.status==='eliminated'?'#94A3B8':isMe?'#059669':'#EF4444';
                  return(
                    <div key={name} style={{marginBottom:8}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                        <span style={{fontSize:12,fontWeight:700,color:col,
                          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                          {p.status==='eliminated'?'💀':p.status==='done'?'🏁':isMe?'👤':'🏃'} {name}
                          {roomType==='royale'&&(p.lives||0)>0&&(
                            <span style={{fontSize:10,marginLeft:4}}>
                              {p.lives<=5?'❤️'.repeat(p.lives):'❤️×'+p.lives}</span>
                          )}
                        </span>
                        <span style={{fontSize:11,color:'#64748B'}}>{p.cpm||0} KPM · {pct}%</span>
                      </div>
                      <div style={{background:'#E2E8F0',borderRadius:4,height:5,overflow:'hidden'}}>
                        <div style={{width:pct+'%',height:'100%',borderRadius:4,
                          background:col,transition:'width .3s'}}/>
                      </div>
                    </div>
                  );
                })}
                {roomType==='royale'&&(
                  <div style={{marginTop:8,fontSize:12,color:'#64748B',
                    fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
                    ชีวิตของคุณ: {playerLives>0
                      ? (playerLives<=5?'❤️'.repeat(playerLives):'❤️ × '+playerLives)
                      : '💀 ถูกคัดออก'}
                  </div>
                )}
              </div>
            )}
            <div style={{marginTop:8}}>
              <OnScreenKeyboard nextCode={nextCode} needsShift={needsShift} flashCode={flashCode}
                shiftHeld={shiftHeld} correctShiftCode={correctShiftCode}/>
              {capsLockOn&&(
                <div style={{marginTop:8,padding:'7px 14px',background:'#FEF9C3',
                  border:'1.5px solid #FDE047',borderRadius:8,
                  display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:15}}>⚠️</span>
                  <span style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                    fontSize:12,color:'#713F12',fontWeight:600}}>
                    Caps Lock เปิดอยู่ — ภาษาไทยไม่ใช้ Caps Lock กรุณากด Caps Lock เพื่อปิด แล้วใช้ Shift แทน
                  </span>
                  <button onClick={()=>setCapsLockOn(false)}
                    style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',
                      fontSize:14,color:'#92400E',fontWeight:800,padding:'0 4px'}}>✕</button>
                </div>
              )}
            </div>
          </div>
        )}

        {screen==='mp-setup'&&(
          <MPSetupScreen
            mode={mpSetupMode} busy={mpBusy}
            onBack={()=>setScreen('lessons')}
            onSelect={(les,lives)=>{
              if(mpSetupMode==='1v1') handleCreate1v1(les);
              else handleCreateBR(les,lives||3);
            }}/>
        )}
        {screen==='mp-lobby'&&(
          <LobbyScreen
            roomCode={roomCode} roomInfo={roomInfo}
            roomPlayers={roomPlayers} isHost={isHost}
            roomType={roomType} myName={myRoomName.current||studentName||'ผู้เล่น1'}
            onStart={handleStartRace} onLeave={handleLeaveRoom}/>
        )}
        {screen==='countdown'&&(
          <CountdownScreen num={countNum} roomCode={roomCode} roomType={roomType}/>
        )}
        {screen==='results'&&lesson?.story&&exercise?.isChoice?(
          <StoryChoiceScreen exercise={exercise}
            adventureName={adventureName||'นักผจญภัย'}
            onChoose={(saves)=>{
              if(saves.storyPath){setStoryPath(saves.storyPath);try{localStorage.setItem('storyPath',saves.storyPath);}catch(e){}}
              if(saves.storyPower){setStoryPower(saves.storyPower);try{localStorage.setItem('storyPower',saves.storyPower);}catch(e){}}
              setScreen('lessons');
            }}/>
        ):screen==='results'&&(
          <ResultsScreen cpm={kpm} accuracy={accuracy} errors={errors}
            totalChars={totalChars} lesson={lesson}
            saveStatus={saveStatus} studentName={studentName}
            ghostData={ghostData} newRecord={newRecord}
            roomCode={roomCode} roomType={roomType}
            roomPlayers={roomPlayers} myName={myRoomName.current||studentName||'ผู้เล่น1'}
            onRestart={()=>{
              if(rcRef.current){handleLeaveRoom();}
              else if(lesson&&exercise) startExercise(lesson,exercise);
              else setScreen('lessons');
            }}
            onBack={()=>{
              if(rcRef.current){handleLeaveRoom();}
              else setScreen('lessons');
            }}/>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ThaiTypingApp/>);
</script></body></html>
