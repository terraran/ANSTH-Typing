// ── SAFE ZONE CONFIG ──────────────────────────────────────────────────
// Zone starts 30s into the race, advances at ZONE_CPM chars/min.
// Players more than ZONE_GAP chars behind lose 1 life every ZONE_TICK ms.
// Text display: show ~2 lines at a time, advance on completion
const CHUNK_CHARS = 76; // chars per chunk (~2 lines at 34px Thai font)

// Build word-boundary chunks — extracted to module level so Babel handles it reliably
function buildChunks(targetChars) {
  if (!targetChars.length) return [{start:0,end:0}];
  const result = [];
  let start = 0;
  while (start < targetChars.length) {
    let end = Math.min(start + CHUNK_CHARS, targetChars.length);
    if (end < targetChars.length) {
      // Advance to end of current word — never split mid-word
      while (end < targetChars.length && targetChars[end] !== ' ') end++;
      // Include the trailing space in this chunk
      if (end < targetChars.length) end++;
    }
    result.push({start, end});
    start = end;
    if (result.length > 200) break; // safety cap
  }
  return result;
}

const ZONE_GRACE = 25;    // seconds before the first circle starts closing
const ZONE_GAP   = 38;    // characters of breathing room behind the zone
const ZONE_TICK  = 10000; // lose one life every 10 seconds outside the zone
const ZONE_PHASES = [
  { after: 0,   cpm: 60 },
  { after: 60,  cpm: 84 },
  { after: 120, cpm: 108 },
  { after: 180, cpm: 132 },
];
const ZONE_TICK_SECS = ZONE_TICK / 1000;

function getZoneSpeed(elapsedSeconds) {
  const phase = [...ZONE_PHASES].reverse().find(p => elapsedSeconds >= ZONE_GRACE + p.after);
  return phase ? phase.cpm : 0;
}

function getZonePos(startTime, totalChars) {
  if (!startTime) return 0;
  const elapsed = (Date.now() - startTime) / 1000;
  if (elapsed < ZONE_GRACE) return 0;
  let remaining = elapsed - ZONE_GRACE;
  let chars = 0;
  for (let i = 0; i < ZONE_PHASES.length; i++) {
    const phase = ZONE_PHASES[i];
    const next = ZONE_PHASES[i + 1];
    const duration = next ? next.after - phase.after : Infinity;
    const inPhase = Math.min(remaining, duration);
    chars += (inPhase / 60) * phase.cpm;
    remaining -= inPhase;
    if (remaining <= 0) break;
  }
  return Math.min(Math.floor(chars), totalChars);
}

function mapKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return null;
  const entry = KEYMAP[e.code];

}

function validateInput(expected, typed) {
  const pos = typed.length - 1;
  if (pos < 0) return { ok: true };
  const got = typed[pos], want = expected[pos];
  if (got === want) return { ok: true, position: pos };
  if (pos >= expected.length) return { ok:false, errorType:'OVERFLOW', costsLife:true };
  const gC = CHAR_CLASS[got] ?? 'NON', wC = CHAR_CLASS[want] ?? 'NON';
  if (wC==='AV'  && gC==='TONE') return { ok:false, expected:want, got, hint:`พิมพ์สระ (${want}) ก่อนวรรณยุกต์ (${got})`, costsLife:false };
  if (wC==='TONE'&& gC==='AV')   return { ok:false, expected:want, got, hint:`พิมพ์วรรณยุกต์ (${want}) หลังสระ`,          costsLife:false };
  if (wC==='LV'  && gC==='CONS') return { ok:false, expected:want, got, hint:`สระหน้า (${want}) พิมพ์ก่อนพยัญชนะ (${got})`, costsLife:false };
  return { ok:false, hint:null, costsLife:true };
}

function findKeyForChar(char) {
  for (const [code, [u, s]] of Object.entries(KEYMAP)) {
    if (u === char) return { code, needsShift: false };
    if (s === char) return { code, needsShift: true };
  }
  return null;
}

// TEXT GENERATOR

function generateText(words, minChars, rng = Math.random) {
  const arr = [...words];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const result = [];
  let chars = 0, i = 0;
  while (chars < minChars) {
    const word = arr[i % arr.length];
    result.push(word);
    chars += [...word].length + 1;
    i++;
    if (i > arr.length * 6) break;
  }
  return result.join(' ');
}

// Deterministic RNG so every student in a grade gets the same weekly test text.
function seededRng(seedText) {
  let h = 2166136261;
  for (const c of String(seedText)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => {
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function charBasePoints(ch) {
  if (SCORE_RARE.has(ch)) return 500;
  const k = findKeyForChar(ch);
  if (!k) return 100;
  if (k.needsShift) return 400;
  if (SCORE_HOME.has(k.code)) return 100;
  if (SCORE_ROWS.has(k.code)) return 200;
  return 300;
}
// Target speed rises gently through the lessons (keystrokes per minute).
function lessonTargetKpm(lessonId) { return Math.min(160, 60 + (Math.max(1, Number(lessonId)||1) - 1) * 8); }
// ×1.0 at or above target speed, down to ×0.5 at half speed (average of last 5 keys).
function speedMultiplier(intervals, lessonId) {
  if (!intervals.length) return 1;
  const avg = intervals.reduce((a,b)=>a+b,0) / intervals.length;
  const targetMs = 60000 / lessonTargetKpm(lessonId);
  return Math.max(0.5, Math.min(1, targetMs / Math.max(1, avg)));
}
// +10% per 10 correct keys in a row, max ×1.5. `streak` = correct keys before this one.
function comboMultiplier(streak) { return 1 + Math.min(5, Math.floor(streak / 10)) * 0.1; }
// Perfect run: full speed, no mistakes.
function maxScoreFor(chars) {
  return chars.reduce((sum, ch, i) => sum + Math.round(charBasePoints(ch) * comboMultiplier(i)), 0);
}
function starsFor(score, maxScore) {
  const pct = maxScore > 0 ? score / maxScore * 100 : 0;
  return pct >= 85 ? 3 : pct >= 65 ? 2 : pct >= 45 ? 1 : 0;
}
// Practice high scores are keyed like the backend: "lessonId|1.1" (number prefix
// survives exercise renames). Signed-in: from Sheets. Guest: this device only.
function hsKey(lessonId, title) {
  const t=String(title||'').trim();
  const m=t.match(/^(\d+\.\d+)/);
  return (Number(lessonId)||0)+'|'+(m?m[1]:t);
}

function writeGuestHighScores(map) { try { localStorage.setItem('highScores_guest', JSON.stringify(map)); } catch {} }

// WEEKLY TEST — one 2-minute test per grade level per week
// ═══════════════════════════════════════════════════════════════
const TEST_SECS      = 120;
const TEST_MIN_CHARS = 700;   // longer than anyone can type in 2 minutes

// Reshuffles the word bank pass after pass until the text is long enough.
function generateTimedText(words, minChars, rng) {
  const pool = cleanTypingWords(words);
  if (!pool.length) return '';
  const out = [];
  let chars = 0;
  while (chars < minChars) {
    const arr = [...pool];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    for (const w of arr) {
      out.push(w);
      chars += [...w].length + 1;
      if (chars >= minChars) break;
    }
  }
  return out.join(' ');
}
// Target score (100%): every key correct at the lesson's target speed for the full 2 minutes.
// Fast, accurate students can go above 100%.
function testTargetScore(chars, lessonId) {
  const budget = lessonTargetKpm(lessonId) * TEST_SECS / 60;
  let keys = 0, n = 0;
  while (n < chars.length) {
    const k = findKeyForChar(chars[n]);
    keys += k && k.needsShift ? 2 : 1;
    if (keys > budget) break;
    n++;
  }
  return Math.max(1, maxScoreFor(chars.slice(0, n)));
}
function parseYmd(s) {
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function fmtWeekRange(ymd) {
  const a = parseYmd(ymd);
  if (!a) return '';
  const b = new Date(a); b.setDate(b.getDate() + 6);
  const f = d => d.toLocaleDateString('th-TH', {day:'numeric', month:'short'});
  return f(a) + ' – ' + f(b);
}
function fmtTimeLeft(ms) {
  if (!(ms > 0)) return 'ปิดแล้ว';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if (d > 0) return `เหลือ ${d} วัน ${h % 24} ชม.`;
  if (h > 0) return `เหลือ ${h} ชม. ${Math.floor(ms % 3600000 / 60000)} นาที`;
  return `เหลือ ${Math.max(1, Math.ceil(ms / 60000))} นาที`;
}
function pctOf(score, max) { return max > 0 ? Math.round(score / max * 100) : 0; }

// KEY component

function Key({ kdef, nextCode, needsShift, flashCode, shiftHeld, correctShiftCode }) {
  const { c, lbl, w=1, sp=false } = kdef;
  const meta=KEY_META[c], chars=KEYMAP[c];
  const isNext=(nextCode===c);
  const isShift=(c==='ShiftLeft'||c==='ShiftRight')&&needsShift&&
    (correctShiftCode ? c===correctShiftCode : true);
  const isFlash=flashCode===c, active=isNext||isShift;
  const shifted   = shiftHeld && chars && chars.length>1 && chars[1]!==chars[0];
  const mainChar  = chars ? (shifted ? chars[1] : chars[0]) : '';
  const smallChar = chars ? (shifted ? chars[0] : chars[1]) : '';
  const bg=isFlash?'#FCA5A5':active?'#1D4ED8':sp?'var(--c-key-sp)':meta?FINGER_COLORS[meta.f]:'var(--c-key-def)';
  const shadow=active?'0 0 0 2px #1D4ED8,0 0 16px #93C5FD':'0 1px 3px rgba(0,0,0,.2)';
  return (
    <div style={{ flex:w,height:44,background:bg,boxShadow:shadow,borderRadius:6,
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      position:'relative',cursor:'default',userSelect:'none',
      transition:'background .1s,box-shadow .1s',minWidth:0 }}>
      {sp ? (
        <span style={{fontSize:11,fontWeight:700,color:active?'#fff':'#475569'}}>{lbl}</span>
      ) : chars ? (
        <>
          <span style={{position:'absolute',
            top:shifted?'auto':3, bottom:shifted?3:'auto',
            right:shifted?'auto':5, left:shifted?4:'auto',
            fontSize:9,color:active?'rgba(255,255,255,.5)':'#94A3B8',fontWeight:600,
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>{smallChar}</span>
          <span style={{fontSize:18,fontWeight:700,lineHeight:1,
            color:active?'#fff':'var(--c-t1)',
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>{mainChar}</span>
          {meta?.home&&!shifted&&<span style={{position:'absolute',bottom:3,width:4,height:4,
            borderRadius:'50%',background:active?'#BFDBFE':'rgba(0,0,0,.25)'}}/>}
        </>
      ) : null}
    </div>
  );
}

// TEXT DISPLAY

const COMBINING_CLS = new Set(['AV','BV','BD','TONE','AD']);

function TextDisplay({ displayChars, displayPos }) {
  const tokens = [];
  let wordBuf=[], wordStart=0;
  displayChars.forEach((ch,i) => {
    if (ch===' ') {
      if (wordBuf.length) { tokens.push({type:'word',chars:wordBuf,start:wordStart}); wordBuf=[]; }
      tokens.push({type:'space',start:i});
    } else {
      if (!wordBuf.length) wordStart=i;
      wordBuf.push({ch,idx:i});
    }
  });
  if (wordBuf.length) tokens.push({type:'word',chars:wordBuf,start:wordStart});

  const cursorOnCombining = displayPos < displayChars.length &&
    COMBINING_CLS.has(CHAR_CLASS[displayChars[displayPos]] ?? '');
  let baseIdxForCombining = -1;
  if (cursorOnCombining) {
    let bi = displayPos - 1;
    while (bi >= 0 && COMBINING_CLS.has(CHAR_CLASS[displayChars[bi]] ?? '')) bi--;
    baseIdxForCombining = bi;
  }

  return (
    <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
      fontSize:34,lineHeight:2,display:'flex',flexWrap:'wrap',
      alignContent:'flex-start',gap:'0 2px',minHeight:130}}>
      {tokens.map((tok,ti) => {
        if (tok.type==='space') {
          const done=tok.start<displayPos,cur=tok.start===displayPos;
          return (
            <span key={ti} style={{display:'inline-block',width:14,textAlign:'center',
              color:done?'#059669':'#CBD5E1',
              background:cur?'#FEF08A':'transparent',
              borderBottom:cur?'3px solid #F59E0B':'none'}}>
              {done?'·':cur?'⎵':' '}
            </span>
          );
        }
        return (
          <span key={ti} style={{display:'inline-block',whiteSpace:'nowrap'}}>
            {tok.chars.map(({ch,idx}) => {
              const done = idx < displayPos;
              const cur  = idx === displayPos;
              const isBaseForCombiningCursor = cursorOnCombining && idx === baseIdxForCombining;
              const showHighlight = cur || isBaseForCombiningCursor;
              return (
                <span key={idx} style={{
                  color:done?'#059669':cur?'var(--c-t1)':'var(--c-txt-future)',
                  background:showHighlight?'#FEF08A':'transparent',
                  borderBottom:showHighlight?'3px solid #F59E0B':'none',
                }}>{ch}</span>
              );
            })}
          </span>
        );
      })}
    </div>
  );
}

// WEEKLY TEST CLOCK — ring shrinks with the time left; green → yellow (30 s) → red (10 s)

function TestTimer({ startTime, now, endTime }) {
  const total = TEST_SECS * 1000;
  const used = startTime ? Math.min(total, Math.max(0, (endTime ?? now) - startTime)) : 0;
  const leftMs = total - used;
  const left = Math.ceil(leftMs / 1000);
  const frac = leftMs / total;
  const color = left <= 10 ? '#DC2626' : left <= 30 ? '#F59E0B' : '#059669';
  const R = 30, C = 2 * Math.PI * R;
  const finalTen = !!startTime && !endTime && left <= 10 && left > 0;
  const label = left <= 10 ? String(left) : `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  return (
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{position:'relative',width:72,height:72,flexShrink:0}}
        role="timer" aria-label={`เหลือเวลา ${left} วินาที`}>
        <svg width="72" height="72" viewBox="0 0 72 72" style={{transform:'rotate(-90deg)',display:'block'}}>
          <circle cx="36" cy="36" r={R} fill="none" stroke="var(--c-border)" strokeWidth="6"/>
          <circle cx="36" cy="36" r={R} fill="none" stroke={color} strokeWidth="6" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - frac)}
            style={{transition:'stroke-dashoffset .25s linear, stroke .4s'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span key={finalTen ? left : 'clock'} className={finalTen ? 'timer-beat' : ''}
            style={{fontSize:left<=10?26:17,fontWeight:800,color,fontVariantNumeric:'tabular-nums'}}>
            {label}
          </span>
        </div>
      </div>
      {!startTime && (
        <span style={{fontSize:12,color:'var(--c-t2)',fontWeight:700,lineHeight:1.4,
          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
          2 นาที<br/>เริ่มนับเมื่อกดปุ่มแรก
        </span>
      )}
    </div>
  );
}

          <div style={{fontSize:34,marginBottom:6}}>💀</div>

          <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>ยิ่งชีวิตน้อย ยิ่งท้าทาย</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {BR_DIFFICULTIES.map(d=>(
            <button key={d.lives} onClick={()=>!busy&&onSelect(pickedLesson,d.lives)}
              disabled={busy}
              style={{background:'#fff',border:`2px solid ${d.color}`,borderRadius:14,
                padding:'14px 18px',cursor:busy?'not-allowed':'pointer',
                display:'flex',alignItems:'center',gap:14,textAlign:'left',
                transition:'all .15s',opacity:busy?0.5:1}}
              onMouseEnter={e=>{if(!busy){e.currentTarget.style.background=d.bg;e.currentTarget.style.transform='translateY(-2px)';}}}
              onMouseLeave={e=>{e.currentTarget.style.background='#fff';e.currentTarget.style.transform='none';}}>
              <span style={{fontSize:28}}>{d.emoji}</span>
              <div style={{flex:1}}>
                <div style={{fontFamily:tf,fontSize:15,fontWeight:800,color:'var(--c-t1)',lineHeight:1.4}}>{d.thai}</div>
                <div style={{fontSize:11,color:'var(--c-t3)',marginTop:2}}>{d.en}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:18,fontWeight:800,color:d.color}}>
                  {'❤️'.repeat(Math.min(d.lives,5))}{d.lives>5?'…':''}</div>
                <div style={{fontSize:11,color:d.color,fontWeight:700}}>{d.lives} ชีวิต</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={{fontFamily:tf}}>
      <div style={{background:`linear-gradient(135deg,${MODE.from},${MODE.to})`,
        borderRadius:16,padding:'20px 20px 18px',marginBottom:20,
        position:'relative',overflow:'hidden',textAlign:'center'}}>
        <div style={{position:'absolute',top:-25,right:-25,width:90,height:90,
          borderRadius:'50%',background:'rgba(255,255,255,.08)'}}/>
        <button onClick={onBack}
          style={{position:'absolute',top:12,left:12,background:'rgba(255,255,255,.18)',
            border:'none',borderRadius:8,padding:'5px 10px',cursor:'pointer',
            fontSize:12,color:'#fff',fontWeight:700}}>← ออก</button>
        <div style={{fontSize:34,marginBottom:6}}>{MODE.icon}</div>
        <div style={{fontSize:10,color:'rgba(255,255,255,.7)',fontWeight:700,
          letterSpacing:2,marginBottom:3}}>{MODE.label}</div>
        <div style={{fontSize:20,fontWeight:800,color:'#fff',fontFamily:tf}}>เลือก Arena</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{MODE.hint}</div>
      </div>
      {CHAPTERS.map(ch=>{
        const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
        if (!chLessons.length) return null;
        return (
          <div key={ch.id} style={{marginBottom:18}}>
            <div style={{fontSize:10,fontWeight:800,color:'var(--c-t3)',
              letterSpacing:1,marginBottom:8,paddingLeft:4}}>
              {ch.label.toUpperCase()} · {ch.title}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {chLessons.map(lesson=>(
                <button key={lesson.id}
                  onClick={()=>{if(busy)return; isRoyale?setPickedLesson(lesson):onSelect(lesson);}}
                  disabled={busy}
                  style={{background:busy?'#F8FAFC':'#fff',border:`2px solid ${lesson.accent}`,
                    borderRadius:12,padding:'12px 14px',cursor:busy?'not-allowed':'pointer',
                    textAlign:'left',opacity:busy?0.5:1,transition:'all .15s'}}
                  onMouseEnter={e=>{if(!busy){e.currentTarget.style.background=lesson.al;e.currentTarget.style.transform='translateY(-2px)';}}}
                  onMouseLeave={e=>{e.currentTarget.style.background='#fff';e.currentTarget.style.transform='none';}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                    <span style={{background:lesson.al,color:lesson.accent,borderRadius:6,
                      padding:'2px 7px',fontSize:9,fontWeight:800}}>บท {lesson.id}</span>
                  </div>
                  <div style={{fontFamily:tf,fontSize:13,fontWeight:800,color:'var(--c-t1)',lineHeight:1.3}}>
                    {lesson.thaiName}</div>
                  <div style={{fontSize:10,color:'var(--c-t3)',marginTop:2}}>
                    {busy?'⏳':'→'} {(lesson.exercises||lesson.exercisesA||[]).length} exercises</div>
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// LESSON SELECTOR

function LessonScreen({ studentName, classCode, onSelect, onOpenSetup, onJoin, joinCode, setJoinCode, joinError, mpBusy, storyPath, storyPower, onViewStats, onLogin, weekly, onOpenWeekly, highScores }) {
  const savedCh=(()=>{try{return Math.min(parseInt(localStorage.getItem('lastChapter')||'0')||0,CHAPTERS.length-1);}catch{return 0;}})();
  const getExercises=(lesson)=>{
    if(!lesson.story) return lesson.exercises||[];
    if(lesson.id===15) return storyPath==='B'?(lesson.exercisesB||[]):(lesson.exercisesA||[]);
    if(lesson.id===16){
      if(storyPath==='B') return lesson.exercisesCave||[];
      return storyPower==='lightning'?(lesson.exercisesLightning||[]):(lesson.exercisesGold||[]);
    }
    return lesson.exercises||[];
  };
  const [chIdx,       setChIdx]       = useState(savedCh);
  const [openLesson,  setOpenLesson]  = useState(null);
  const [cardW,       setCardW]       = useState(0);
  const carouselRef = useRef(null);
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  useEffect(()=>{ if(carouselRef.current) setCardW(carouselRef.current.offsetWidth); },[]);

  const gotoChapter = (i) => {
    const c=Math.max(0,Math.min(i,CHAPTERS.length-1));
    setChIdx(c); setOpenLesson(null);
    try{ localStorage.setItem('lastChapter',String(c)); }catch{}
  };

  const PEEK=28, GAP=10;
  const cw = cardW>0 ? cardW-PEEK : 0;
  const stripTransform = cw>0
    ? `translateX(-${chIdx*(cw+GAP)}px)`
    : `translateX(-${chIdx*100}%)`;
  const minCardW = cw>0 ? cw+'px' : '100%';

  const atFirst = chIdx===0;
  const atLast  = chIdx===CHAPTERS.length-1;

  return (
    <div style={{fontFamily:tf}}>

      {/* ── Login prompt / Player badge — mutually exclusive ── */}
      {!studentName&&SCRIPT_URL&&(
        <div style={{background:'linear-gradient(135deg,#1D4ED8,#3B82F6)',borderRadius:14,
          padding:'14px 18px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:24}}>👤</span>
          <div style={{flex:1,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
            <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>ยังไม่ได้เข้าสู่ระบบ</div>
            <div style={{fontSize:11,color:'#BFDBFE'}}>เข้าสู่ระบบด้วย Google เพื่อบันทึกผลและดูสถิติ</div>
          </div>
          <button onClick={()=>onLogin&&onLogin()}
            style={{background:'#fff',color:'#1D4ED8',border:'none',borderRadius:8,
              padding:'9px 16px',cursor:'pointer',fontSize:13,fontWeight:800,
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",whiteSpace:'nowrap'}}>
            Sign in with Google
          </button>
        </div>
      )}
      {studentName&&(
        <div style={{display:'flex',alignItems:'center',gap:12,background:'var(--c-surf)',
          borderRadius:14,padding:'12px 16px',marginBottom:20,border:'1.5px solid var(--c-border)'}}>
          <div style={{width:42,height:42,borderRadius:'50%',flexShrink:0,
            background:'linear-gradient(135deg,#1D4ED8,#7C3AED)',
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>👤</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:800,color:'var(--c-t1)'}}>{studentName}</div>
            <div style={{fontSize:11,color:'var(--c-t3)'}}>ห้อง {classCode}</div>
          </div>
          <button onClick={()=>onViewStats&&onViewStats()}
            style={{background:'var(--c-surf)',border:'1.5px solid var(--c-border)',color:'#2563EB',
              borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:12,
              fontWeight:700,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
              whiteSpace:'nowrap'}}>
            📊 สถิติ
          </button>
        </div>
      )}

      {/* ── Weekly test (one per grade level) ── */}
      {studentName && SCRIPT_URL && (()=>{
        const t = weekly?.test, me = weekly?.me;
        const pending = !!t && !me;
        const sub = !weekly ? 'กระดานอันดับของระดับชั้น · จับเวลา 2 นาที'
          : !weekly.grade ? 'ห้องนี้ยังไม่มีแบบทดสอบประจำสัปดาห์'
          : !t ? 'สัปดาห์นี้ครูยังไม่ได้ตั้งแบบทดสอบ'
          : me ? `${t.exerciseTitle} · อันดับ ${me.rank} จาก ${weekly.total} คนใน ${weekly.grade}`
          : `${t.exerciseTitle} · ยังไม่ได้ทำ · จับเวลา 2 นาที`;
        return (
          <button onClick={()=>onOpenWeekly&&onOpenWeekly()}
            style={{width:'100%',display:'flex',alignItems:'center',gap:12,marginBottom:20,
              background:pending?'linear-gradient(135deg,#1D4ED8,#7C3AED)':'var(--c-surf)',
              color:pending?'#fff':'var(--c-t1)',border:pending?'none':'1.5px solid var(--c-border)',
              borderRadius:14,padding:'14px 18px',cursor:'pointer',textAlign:'left',
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
            <span style={{fontSize:26}}>📝</span>
            <span style={{flex:1,minWidth:0}}>
              <span style={{display:'block',fontSize:16,fontWeight:800}}>แบบทดสอบประจำสัปดาห์</span>
              <span style={{display:'block',fontSize:12,opacity:.85}}>{sub}</span>
            </span>
            <span style={{fontSize:14,fontWeight:800,whiteSpace:'nowrap'}}>🏆 เปิด</span>
          </button>
        );
      })()}

      {/* ── Chapter carousel ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,
          marginBottom:12,textAlign:'center'}}>🎮 เลือก CHAPTER</div>

        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {/* Prev */}
          <button onClick={()=>gotoChapter(chIdx-1)} disabled={atFirst}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid var(--c-border)',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atFirst?'default':'pointer',
              color:atFirst?'#CBD5E1':'#64748B',opacity:atFirst?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ‹
          </button>

          {/* Card strip */}
          <div ref={carouselRef} style={{flex:1,overflow:'hidden'}}>
            <div style={{display:'flex',gap:GAP+'px',transition:'transform .35s cubic-bezier(.4,0,.2,1)',
              transform:stripTransform}}>
              {CHAPTERS.map(ch=>{
                const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
                return (
                  <div key={ch.id} style={{minWidth:minCardW,flexShrink:0}}>
                    <div style={{background:`linear-gradient(135deg,${ch.from},${ch.to})`,
                      borderRadius:18,padding:'22px 20px',textAlign:'center',
                      position:'relative',overflow:'hidden'}}>
                      <div style={{position:'absolute',top:-20,right:-20,width:80,height:80,
                        borderRadius:'50%',background:'rgba(255,255,255,.08)'}}/>
                      <div style={{fontSize:30,marginBottom:6}}>{ch.icon}</div>
                      <div style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.65)',
                        letterSpacing:1,marginBottom:3}}>{ch.label.toUpperCase()}</div>
                      <div style={{fontSize:19,fontWeight:800,color:'#fff',marginBottom:4,
                        fontFamily:tf}}>{ch.title}</div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.75)'}}>
                        {chLessons.length} บทเรียน · {ch.subtitle}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Next */}
          <button onClick={()=>gotoChapter(chIdx+1)} disabled={atLast}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid var(--c-border)',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atLast?'default':'pointer',
              color:atLast?'#CBD5E1':'#64748B',opacity:atLast?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ›
          </button>
        </div>

        {/* Dots */}
        <div style={{display:'flex',justifyContent:'center',gap:6,marginTop:10}}>
          {CHAPTERS.map((_,ci)=>(
            <div key={ci} onClick={()=>gotoChapter(ci)}
              style={{width:chIdx===ci?20:6,height:6,borderRadius:99,cursor:'pointer',
                background:chIdx===ci?(CHAPTERS[ci]?.dot||'#1D4ED8'):'#CBD5E1',
                transition:'all .25s'}}/>
          ))}
        </div>
      </div>

      {/* ── Lesson list ── */}
      {(()=>{
        const ch=CHAPTERS[chIdx];
        const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
        return (
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,marginBottom:10}}>
              บทเรียนใน {ch.label.toUpperCase()}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {chLessons.map((lesson)=>{
                const ghostKey=ex=>'ghostv2_'+lesson.id+'_'+encodeURIComponent(ex.title);
                const exHasGhost=ex=>{try{return !!localStorage.getItem(ghostKey(ex));}catch{return false;}};
                const lessonExs=getExercises(lesson);
                const allDone=lessonExs.every(exHasGhost);
                const hasGhost=lessonExs.some(exHasGhost);
                const isOpen=openLesson===lesson.id;
                const cardBg=allDone?lesson.accent:'var(--c-card)';
                const cardBorder=allDone?`2px solid ${lesson.accent}`:`1.5px solid var(--c-border)`;
                const numBg=allDone?'rgba(255,255,255,.22)':lesson.al;
                const numColor=allDone?'#fff':lesson.accent;
                const titleColor=allDone?'#fff':'var(--c-t1)';
                const subColor=allDone?'rgba(255,255,255,.7)':'var(--c-t3)';
                const arrowColor=allDone?'rgba(255,255,255,.8)':'var(--c-t3)';
                return (
                  <div key={lesson.id}>
                    <div onClick={()=>setOpenLesson(o=>o===lesson.id?null:lesson.id)}
                      style={{background:cardBg,border:cardBorder,
                        borderRadius:isOpen?'12px 12px 0 0':12,
                        padding:'12px 16px',display:'flex',alignItems:'center',gap:12,
                        cursor:'pointer',transition:'opacity .15s, border-radius .1s'}}
                      onMouseEnter={e=>e.currentTarget.style.opacity='.88'}
                      onMouseLeave={e=>e.currentTarget.style.opacity='1'}>

// 1v1 RESULT — decided by score; equal score → whoever finished the text first

function duelOutcome(roomPlayers, myScore, waited) {
  const uid=currentFirebaseUid();
  const racers=Object.entries(roomPlayers||{}).filter(([,p])=>!p.isSpectator);
  const me=racers.find(([k,p])=>k===uid||p.uid===uid)?.[1]||{};
  const rv=racers.find(([k,p])=>k!==uid&&p.uid!==uid)?.[1]||null;
  const rvScore=Number(rv?.score)||0;
  const settled=!rv || rv.status==='done' || waited;
  let outcome='wait';
  if (settled) {
    if (!rv) outcome='win';
    else if (myScore!==rvScore) outcome=myScore>rvScore?'win':'lose';
    else {
      // finishedAt > 0 means that player typed the whole text
      const a=Number(me.finishedAt)||0, b=Number(rv.finishedAt)||0;
      if (a&&b) outcome=a===b?'draw':a<b?'win':'lose';
      else if (a) outcome='win';
      else if (b) outcome='lose';
      else outcome='draw';
    }
  }
  return {outcome,rvName:rv?.name||'คู่แข่ง',rvScore,tie:settled&&!!rv&&myScore===rvScore};
}

// ── STORY UTILITIES ──────────────────────────────────────
// Keep a clean, deduplicated wordbank for each lesson. Battle Royale uses only
// the selected lesson's bank, so later keyboard rows cannot leak into its text.
const UNSUITABLE_WORDS = ['เด้า','ฆ่า','ฆาตกรรม','เฆี่ยน','ห่า','ด่า'];
function cleanTypingWords(words) {
  return [...new Set((words||[]).filter(word=>word && !UNSUITABLE_WORDS.includes(word)))];
}
function buildLessonWordList(lesson) {
  const exercises=lesson?.exercises||lesson?.exercisesA||lesson?.exercisesGold||[];
  return cleanTypingWords(exercises.flatMap(ex=>ex.words||[]));
}
const LESSON_WORDLISTS=Object.fromEntries(LESSONS.map(lesson=>[lesson.id,buildLessonWordList(lesson)]));

function generateBRText(startLesson, startExercise, minLength) {
  const wordPool=LESSON_WORDLISTS[startLesson.id]||buildLessonWordList(startLesson);
  if (!wordPool.length) return generateText(cleanTypingWords(startExercise?.words),minLength);
  return generateText(wordPool,Math.max(minLength,500));
}

function generateStoryText(words, name) {
  const n = name||'นักผจญภัย';
  return words.map(w=>w.replace(/__NAME__/g,n)).join(' ');
}

  return <div>choice</div>;
}

function NameModal({ onConfirm }) {

// PROGRESS CHART

function ProgressChart({ sessions }) {
  const [tab, setTab] = useState('wpm'); // 'wpm' | 'both'
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  // Reverse to chronological order, take last 20
  const data = [...sessions].reverse().slice(-20).map((s, i) => ({
    n:    i + 1,
    wpm:  Math.round(s.cpm / 5),
    acc:  s.accuracy,
    ex:   s.exercise,
  }));

  if (data.length < 2) return (
    <div style={{textAlign:'center',padding:24,color:'var(--c-t3)',fontSize:13,fontFamily:tf,
      background:'var(--c-surf)',borderRadius:12,border:'1.5px solid var(--c-border)'}}>
      ต้องมีอย่างน้อย 2 เซสชั่น จึงจะแสดงกราฟได้
    </div>
  );

  const W = 520, H = 200, PL = 40, PR = 40, PT = 16, PB = 32;
  const IW = W - PL - PR, IH = H - PT - PB;

  const maxWpm = Math.max(...data.map(d => d.wpm), 10);
  const yMaxWpm = Math.ceil(maxWpm / 10) * 10 + 10;

  const xOf  = d => PL + ((d.n - 1) / (data.length - 1)) * IW;
  const yWpm = d => PT + IH - (d.wpm / yMaxWpm) * IH;
  const yAcc = d => PT + IH - ((d.acc - 50) / 50) * IH;  // acc range 50-100

  const polyline = (pts, color) => {
    const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    return <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>;
  };

  const wpmPts = data.map(d => ({ x: xOf(d), y: yWpm(d) }));
  const accPts = data.map(d => ({ x: xOf(d), y: yAcc(d) }));

  const yGrids = [0, 25, 50, 75, 100];

  return (
    <div>
      {/* Tab switcher */}
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['wpm','📈 WPM'],['both','📊 WPM + ความแม่น']].map(([key,lbl])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'5px 12px',borderRadius:8,border:'1.5px solid '+(tab===key?'#2563EB':'#E2E8F0'),
              background:tab===key?'#2563EB':'#fff',color:tab===key?'#fff':'#64748B',
              cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:tf,transition:'all .15s'}}>
            {lbl}
          </button>
        ))}
      </div>

      {/* Legend */}
      <div style={{display:'flex',gap:16,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:20,height:3,borderRadius:2,background:'#2563EB'}}/>
          <span style={{fontSize:11,color:'var(--c-t2)',fontFamily:tf}}>WPM</span>
        </div>
        {tab==='both'&&(
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:20,height:3,borderRadius:2,background:'#059669'}}/>
            <span style={{fontSize:11,color:'var(--c-t2)',fontFamily:tf}}>ความแม่น %</span>
          </div>
        )}
      </div>

      {/* Chart */}
      <div style={{overflowX:'auto'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:280,display:'block'}}>
          {/* Grid lines */}
          {yGrids.map(pct => {
            const y = PT + IH - (pct / 100) * IH;
            return (
              <g key={pct}>
                <line x1={PL} y1={y} x2={W-PR} y2={y}
                  stroke="#F1F5F9" strokeWidth="1"/>
                <text x={PL-6} y={y+4} textAnchor="end"
                  fontSize="9" fill="#CBD5E1">{tab==='wpm' ? Math.round(pct/100*yMaxWpm) : pct+'%'}</text>
              </g>
            );
          })}

          {/* WPM y-labels when both shown */}
          {tab==='both' && yGrids.map(pct => {
            const y = PT + IH - (pct / 100) * IH;
            return (
              <text key={'r'+pct} x={W-PR+6} y={y+4} textAnchor="start"
                fontSize="9" fill="#BFDBFE">{Math.round(pct/100*yMaxWpm)}</text>
            );
          })}

          {/* X axis labels */}
          {data.filter((_, i) => data.length <= 10 || i % Math.ceil(data.length/8) === 0 || i === data.length-1).map(d => (
            <text key={d.n} x={xOf(d)} y={H-8} textAnchor="middle" fontSize="9" fill="#94A3B8">
              {d.n}
            </text>
          ))}

          {/* Lines */}
          {tab==='both' && polyline(accPts, '#059669')}
          {polyline(wpmPts, '#2563EB')}

          {/* Dots — WPM */}
          {data.map(d => (
            <circle key={d.n} cx={xOf(d)} cy={yWpm(d)} r="3.5"
              fill="#2563EB" stroke="#fff" strokeWidth="1.5">
              <title>Session {d.n} · {d.wpm} WPM · {d.ex}</title>
            </circle>
          ))}

          {/* Dots — accuracy */}
          {tab==='both' && data.map(d => (
            <circle key={'a'+d.n} cx={xOf(d)} cy={yAcc(d)} r="3.5"
              fill="#059669" stroke="#fff" strokeWidth="1.5">
              <title>Session {d.n} · {d.acc}% · {d.ex}</title>
            </circle>
          ))}

          {/* Axes */}
          <line x1={PL} y1={PT} x2={PL} y2={H-PB} stroke="#E2E8F0" strokeWidth="1"/>
          <line x1={PL} y1={H-PB} x2={W-PR} y2={H-PB} stroke="#E2E8F0" strokeWidth="1"/>

          {/* X-axis label */}
          <text x={W/2} y={H} textAnchor="middle" fontSize="9" fill="#94A3B8">ลำดับ session</text>
        </svg>
      </div>
    </div>
  );
}

function ClassPickerScreen({ googleUser, onSelect, onBack }) {

// GOOGLE SIGN-IN SCREEN

function GoogleSignInScreen({ onSignIn, onSolo }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  useEffect(() => {
    let attempts = 0;
    const init = () => {
      if (typeof google === 'undefined' || !google.accounts) {
        if (attempts++ < 30) setTimeout(init, 200);
        return;
      }
      if (!_googleGISInitialized) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: (response) => {
            const profile = parseJwt(response.credential);
            if (profile) onSignIn(profile, response.credential);
          },
          auto_select: false,
          ux_mode: 'popup',
          // Prefer the browser-mediated Sign in with Google button flow. This
          // avoids relying on cross-window postMessage from a popup where the
          // hosting platform does not let us configure COOP response headers.
          use_fedcm_for_button: true,
        });
        _googleGISInitialized = true;
      }
      const btn = document.getElementById('google-signin-btn');
      if (btn) {
        google.accounts.id.renderButton(btn, {
          theme: 'filled_blue', size: 'large',
          width: 280, text: 'signin_with', locale: 'th',
          shape: 'pill',
        });
      }
    };
    init();
  }, []);

  return (
    <div style={{fontFamily:tf}}>
      <div style={{background:'linear-gradient(150deg,#1E3A8A 0%,#2563EB 55%,#3B82F6 100%)',
        borderRadius:20,padding:'36px 24px 28px',position:'relative',overflow:'hidden',
        marginBottom:16}}>
        <div style={{position:'absolute',top:-40,right:-40,width:130,height:130,
          borderRadius:'50%',background:'rgba(255,255,255,.07)'}}/>
        <div style={{textAlign:'center',position:'relative'}}>
          <div style={{fontSize:56,marginBottom:8}}>⌨️</div>
          <h1 style={{fontFamily:tf,fontSize:27,fontWeight:800,color:'#fff',margin:'0 0 4px'}}>
            แบบฝึกพิมพ์ไทย</h1>
          <p style={{fontSize:11,color:'#93C5FD',margin:'0 0 28px',fontWeight:700,letterSpacing:1}}>
            KEDMANEE TYPING · TIS 820-2538</p>
          <div style={{background:'rgba(255,255,255,.12)',borderRadius:14,padding:'20px',
            display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
            <div style={{fontSize:13,color:'rgba(255,255,255,.8)',fontFamily:tf,fontWeight:600}}>
              เข้าสู่ระบบด้วย Google เพื่อบันทึกผลและดูสถิติ
            </div>

        </button>
      </div>
    </div>
  );

                {me && me.rank>10 && (
                  <>
                    <div style={{textAlign:'center',color:'var(--c-t3)',fontSize:12,lineHeight:1}}>⋮</div>
                    {row({...me,me:true},'me')}
                  </>
                )}
              </>
            ) : (
              <div style={{textAlign:'center',padding:20,fontSize:13,color:'var(--c-t3)'}}>
                ยังไม่มีใครทำ — เป็นคนแรกบนกระดานได้เลย!</div>
            )}
          </div>
          <div style={{fontSize:11,color:'var(--c-t3)',marginTop:6,textAlign:'right'}}>
            อัปเดตอัตโนมัติทุก 1 นาที</div>
        </div>
      )}

      {/* Week-by-week progress */}
      {data.history && data.history.length>0 && (
        <div>
          <div style={{fontSize:15,fontWeight:800,color:'var(--c-t1)',marginBottom:6}}>📈 พัฒนาการของฉัน</div>
          <div style={{background:'var(--c-card)',border:'1.5px solid var(--c-border)',borderRadius:14,overflow:'hidden'}}>
            {data.history.map((h,i)=>{
              const older = data.history[i+1];
              const pct = pctOf(h.score,h.max);
              const diff = older ? pct - pctOf(older.score,older.max) : null;
              return (
                <div key={h.weekStart} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',
                  borderTop:i?'1px solid var(--c-border)':'none'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:800,color:'var(--c-t1)'}}>{fmtWeekRange(h.weekStart)}</div>
                    <div style={{fontSize:11,color:'var(--c-t3)'}}>{h.exerciseTitle}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:15,fontWeight:800,color:'#D97706',fontVariantNumeric:'tabular-nums'}}>{fmtScore(h.score)}</div>
                    <div style={{fontSize:11,color:'var(--c-t2)'}}>{pct}% ของเป้าหมาย</div>
                  </div>
                  <div style={{width:52,textAlign:'right',fontSize:12,fontWeight:800,
                    color:diff===null?'var(--c-t3)':diff>0?'#059669':diff<0?'#DC2626':'var(--c-t2)'}}>
                    {diff===null?'–':diff>0?`▲ ${diff}%`:diff<0?`▼ ${-diff}%`:'= 0%'}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{fontSize:11,color:'var(--c-t3)',marginTop:6}}>
            ▲▼ เทียบ % ของคะแนนเป้าหมายกับสัปดาห์ก่อน (แต่ละสัปดาห์แบบฝึกไม่เหมือนกัน)</div>
        </div>
      )}
      {back}
    </div>
  );
}

// SPECTATOR VIEW — render the selected player's text, not the host's local chunk.
function SpectatorView({ playerName, targetChars, progress, onBack }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  // Apply same chunking logic as practice screen so page scrolls with player
  const chunks = buildChunks(targetChars);
  const pos    = progress || 0;
  const chunkIdx = (() => {
    for (let i=0; i<chunks.length; i++) { if (pos < chunks[i].end) return i; }
    return Math.max(0, chunks.length-1);
  })();
  const curChunk   = chunks[chunkIdx] || {start:0, end:targetChars.length};
  const chunkChars = targetChars.slice(curChunk.start, curChunk.end);
  const chunkPos   = Math.max(0, pos - curChunk.start);

  return (
    <div style={{fontFamily:tf}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <button onClick={onBack}
          style={{background:'var(--c-surf)',border:'1.5px solid var(--c-border)',
            color:'var(--c-t2)',borderRadius:7,padding:'5px 10px',cursor:'pointer',
            fontSize:12,fontFamily:tf}}>← กลับ</button>
        <div style={{fontSize:14,fontWeight:800,color:'var(--c-t1)'}}>
          👁 กำลังดู: {playerName}</div>
        <div style={{marginLeft:'auto',fontSize:11,color:'var(--c-t3)'}}>
          หน้า {chunkIdx+1}/{chunks.length}
        </div>
      </div>
      <div style={{background:'var(--c-surf)',borderRadius:14,padding:'22px 18px',
        border:'1.5px solid var(--c-border)',minHeight:96,
        display:'flex',alignItems:'center',justifyContent:'center'}}>
        <TextDisplay displayChars={chunkChars} displayPos={chunkPos}/>
      </div>
    </div>
  );
}

// 1v1 HUD — live score of both players (score decides the winner) + progress lanes

function OneVsOneHud({ roomCode, roomPlayers, myName, pos, totalChars, score, streak }) {
  const roster=Object.entries(roomPlayers||{}).filter(([,p])=>!p.isSpectator);
  const uid=currentFirebaseUid();
  const mine=roster.find(([key,p])=>key===uid||p.uid===uid)?.[1]||{};
  const other=roster.find(([key,p])=>key!==uid&&p.uid!==uid);
  const rivalName=other?.[1]?.name||'คู่แข่ง';
  const rival=other?.[1]||{};
  const myPos=Math.max(pos,mine.pos||0);
  const rivalPos=rival.pos||0;
  const myPct=totalChars?Math.max(0,Math.min(100,Math.round(myPos/totalChars*100))):0;
  const rivalPct=totalChars?Math.max(0,Math.min(100,Math.round(rivalPos/totalChars*100))):0;
  const rivalScore=Number(rival.score)||0;
  const lead=score-rivalScore;
  const gap=Math.abs(lead);
  const mult=comboMultiplier(streak);
  const finalSprint=Math.max(myPct,rivalPct)>=80;
  const result=gap<100?'🤝 คะแนนสูสีมาก!':lead>0?`✨ คุณนำ ${fmtScore(gap)} คะแนน`:`⚡ ตามอยู่ ${fmtScore(gap)} คะแนน`;
  const lanes=[{name:myName||'คุณ',pct:myPct,color:'#347ED0',icon:'🧑‍🚀',mine:true},{name:rivalName,pct:rivalPct,color:'#E79035',icon:'🦊'}];
  const boxes=[
    {label:(myName||'คุณ')+' (คุณ)',value:score,color:'#347ED0',lead:lead>0},
    {label:rivalName,value:rivalScore,color:'#E79035',lead:lead<0},
  ];
  return (
    <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",border:'1px solid #DBE7F2',borderRadius:14,overflow:'hidden',marginBottom:10,boxShadow:'0 4px 15px rgba(37,73,111,.07)'}}>
      <div style={{minHeight:35,padding:'5px 10px',display:'flex',alignItems:'center',gap:8,background:'linear-gradient(100deg,#234D91,#377FD0)',color:'#fff'}}>
        <span style={{fontSize:9,fontWeight:800,letterSpacing:.5}}>⚡ 1V1 · {roomCode}</span>
        <span style={{height:18,width:1,background:'#ffffff50'}}/>
        <span style={{fontSize:11,fontWeight:800}}>🔥 คอมโบ {streak}{mult>1?` · ×${mult.toFixed(1)}`:''}</span>
        <span style={{marginLeft:'auto',fontSize:9,fontWeight:800,color:'#FFE59A'}}>⭐ ชนะด้วยคะแนน</span>
      </div>
      {finalSprint&&<div style={{padding:'5px 10px',background:'linear-gradient(90deg,#FFF1CC,#FFE3A1)',color:'#995A0C',fontSize:10,fontWeight:800}}>🏁 ช่วงเร่งท้ายเกม! เหลืออีกนิดเดียว อย่ายอมแพ้!</div>}
      <div style={{padding:'8px 10px 9px',background:'#fff'}}>
        {/* Live scores */}
        <div style={{display:'flex',gap:8,marginBottom:7}}>
          {boxes.map(b=>(
            <div key={b.label} style={{flex:1,minWidth:0,borderRadius:10,padding:'5px 10px',textAlign:'center',
              background:b.lead?b.color+'1A':'#F5F8FB',border:`1.5px solid ${b.lead?b.color:'#E3EAF1'}`,transition:'all .3s'}}>
              <div style={{fontSize:10,fontWeight:700,color:'#667F97',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                {b.lead?'👑 ':''}{b.label}</div>
              <div style={{fontSize:22,fontWeight:800,color:b.color,lineHeight:1.15,fontVariantNumeric:'tabular-nums'}}>{fmtScore(b.value)}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:10,fontWeight:800,color:lead>=100?'#287347':lead<=-100?'#A86417':'#47647E',marginBottom:7}}>{result}</div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          {lanes.map(lane=>(
            <div key={lane.name+(lane.mine?'-me':'')}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:9,fontWeight:700,color:'#667F97',marginBottom:3}}><span>{lane.icon} {lane.name}{lane.mine?' (คุณ)':''}</span><span>{lane.pct}%</span></div>
              <div style={{height:10,position:'relative',borderRadius:20,background:'#E9EFF5',margin:'0 5px'}}>
                <div style={{position:'absolute',inset:'0 auto 0 0',width:`${lane.pct}%`,borderRadius:20,background:lane.color,transition:'width .35s'}}/>
                <div style={{position:'absolute',left:`${lane.pct}%`,top:-6,transform:'translateX(-50%)',fontSize:16,lineHeight:'20px',transition:'left .35s',zIndex:1}}>{lane.icon}</div>
                <span style={{position:'absolute',right:-6,top:-5,fontSize:14}}>🏁</span>
              </div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'#8A9DAF',marginTop:6}}><span>พิมพ์ถูกต่อเนื่องคอมโบยิ่งสูง · ผิดแล้วคอมโบเริ่มใหม่</span><span>{myPos} / {totalChars} ตัว</span></div>
      </div>
    </div>
  );
}

function BattleRoyaleResults({ roomCode, roomPlayers, onBack }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  const rows = Object.entries(roomPlayers||{})
    .filter(([,p])=>!p.isSpectator)
    .sort((a,b)=>{
      const rank = p => p.status==='done'?0:(p.lives||0)>0?1:2;
      const diff = rank(a[1])-rank(b[1]);
      if (diff) return diff;
      if (a[1].status==='done' && b[1].status==='done') return (a[1].finishedAt||0)-(b[1].finishedAt||0);
      if ((a[1].lives||0)!==(b[1].lives||0)) return (b[1].lives||0)-(a[1].lives||0);
      return (b[1].pos||0)-(a[1].pos||0);
    });
  return (
    <div style={{fontFamily:tf}}>
      <div style={{textAlign:'center',padding:'24px 12px 18px',background:'linear-gradient(135deg,#1C1917,#D97706)',borderRadius:16,color:'#fff',marginBottom:14}}>
        <div style={{fontSize:42}}>🏆</div>
        <div style={{fontSize:22,fontWeight:800}}>จบการแข่งขัน Battle Royale</div>
        <div style={{fontSize:13,opacity:.8}}>ห้อง {roomCode} · สรุปผลผู้เล่น</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {rows.map(([uid,p],i)=>(
          <div key={uid} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:12,border:'1.5px solid var(--c-border)',background:'var(--c-surf)'}}>
            <div style={{fontSize:19,fontWeight:800,width:32,textAlign:'center',color:i===0?'#D97706':'var(--c-t3)'}}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:800,color:'var(--c-t1)'}}>{p.name||'ผู้เล่น'}</div>
              <div style={{fontSize:11,color:'var(--c-t2)'}}>{p.status==='done'?'พิมพ์จบแล้ว':(p.lives||0)>0?'ยังอยู่ในการแข่งขัน':'ถูกคัดออก'} · {p.pos||0} ตัวอักษร</div>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:'var(--c-t2)'}}>{Math.round((p.cpm||p.wpm||0)/5)} WPM</div>
          </div>
        ))}
      </div>
      <button onClick={onBack} style={{marginTop:16,width:'100%',background:'transparent',border:'1.5px solid var(--c-border)',color:'var(--c-t2)',borderRadius:8,padding:10,cursor:'pointer',fontSize:13,fontFamily:tf}}>กลับแดชบอร์ดผู้ดู</button>
    </div>
  );
}

function BattleRoyaleHud({ roomCode, roomPlayers, myName, pos, totalChars, zonePos, playerLives, startTime }) {
  const elapsed=startTime?Math.max(0,(Date.now()-startTime)/1000):0;
  const untilZone=Math.max(0,ZONE_GRACE-Math.floor(elapsed));
  const outsideBy=Math.max(0,zonePos-pos-ZONE_GAP);
  const outside=zonePos>0&&outsideBy>0;
  const progress=totalChars?Math.max(0,Math.min(100,Math.round(pos/totalChars*100))):0;
  const edge=totalChars?Math.max(0,Math.min(100,Math.round(zonePos/totalChars*100))):0;
  const drainIn=ZONE_TICK_SECS-Math.floor(elapsed%ZONE_TICK_SECS);
  const players=Object.entries(roomPlayers||{}).filter(([,p])=>!p.isSpectator);
  const alive=players.filter(([,p])=>p.status!=='eliminated'&&p.status!=='done'&&(p.lives||0)>0).length;
  const hearts=playerLives>6?`❤️×${playerLives}`:Array.from({length:Math.max(0,playerLives)},()=>"❤️").join(' ');
  return (
    <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",border:'1px solid #DCE8F3',borderRadius:13,overflow:'hidden',marginBottom:10,boxShadow:'0 3px 12px rgba(30,70,110,.06)'}}>
      <div style={{height:34,padding:'0 10px',display:'flex',alignItems:'center',gap:9,background:'linear-gradient(100deg,#1C477F,#2A73C7)',color:'#fff'}}>
        <span style={{fontSize:9,fontWeight:800,letterSpacing:.5,whiteSpace:'nowrap'}}>🏆 BR · {roomCode}</span>
        <span style={{height:19,width:1,background:'#ffffff50'}}/>
        <span style={{fontSize:12,fontWeight:800,whiteSpace:'nowrap'}}>❤️ {hearts||'0 ชีวิต'}</span>
        <span style={{marginLeft:'auto',fontSize:9,fontWeight:700,whiteSpace:'nowrap'}}>👤 {alive} รอด</span>
      </div>
      <div style={{minHeight:28,padding:'4px 10px',display:'flex',alignItems:'center',gap:7,background:outside?'#FFF4E7':zonePos===0?'#EFF7FF':'#EFF9F2',borderBottom:'1px solid #E6EDF3'}}>
        <span style={{fontSize:13}}>{outside?'🌪️':zonePos===0?'⏳':'🛡️'}</span>
        <span style={{fontSize:10,fontWeight:800,color:outside?'#A85411':zonePos===0?'#2B659A':'#277449',flex:1}}>{outside?`ตามหลังขอบวง ${outsideBy} ตัว · เร่งพิมพ์กลับเข้าวง`:zonePos===0?`วงเริ่มเคลื่อนใน ${untilZone} วินาที`:'อยู่ใน Safezone'}</span>
        {outside&&<span style={{fontSize:9,fontWeight:800,color:'#A85411',whiteSpace:'nowrap'}}>❤️ ลดใน {drainIn}s</span>}
      </div>
      <div style={{padding:'7px 10px 6px',background:'#fff'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:9,fontWeight:700,color:'#657E96',marginBottom:5}}>
          <span>เส้นทาง</span><span>คุณ {progress}% · ขอบวง {edge}%</span>
        </div>
        <div style={{height:12,position:'relative',borderRadius:20,background:'#E8EEF4',margin:'0 6px'}}>
          <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${edge}%`,background:'linear-gradient(90deg,#9DDFB8,#D2F2DC)',borderRadius:'20px 0 0 20px',transition:'width .3s'}}/>
          <div style={{position:'absolute',left:`${edge}%`,top:-2,bottom:-2,width:3,background:'#239B60',borderRadius:3,transition:'left .3s'}}/>
          <div style={{position:'absolute',left:`${progress}%`,top:-7,transform:'translateX(-50%)',fontSize:17,lineHeight:'20px',zIndex:1,transition:'left .3s'}}>{playerLives>0?'🧑‍🚀':'💀'}</div>
          <span style={{position:'absolute',right:-7,top:-5,fontSize:14}}>🏁</span>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:8,color:'#8296A9',margin:'4px 5px 0'}}><span>เริ่ม</span><span style={{color:'#25875A',fontWeight:800}}>ขอบ Safezone</span><span>{pos} / {totalChars} ตัว</span><span>เส้นชัย</span></div>
      </div>
    </div>
  );
}

// DEAD SCREEN — shown to eliminated BR players
function DeadScreen({ standings, onLeave }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  const [live, setLive] = useState(standings||{});
  useEffect(()=>{ setLive(standings||{}); }, [standings]);
  const sorted = Object.entries(live)
    .filter(([,p])=>!p.isSpectator)
    .sort((a,b)=>(b[1].wpm||0)-(a[1].wpm||0));
  return (
    <div style={{position:'absolute',inset:0,background:'rgba(15,23,42,.92)',
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      zIndex:100,borderRadius:16,padding:24,fontFamily:tf}}>
      <div style={{fontSize:48,marginBottom:8}}>💀</div>
      <div style={{fontSize:22,fontWeight:800,color:'#fff',marginBottom:4}}>
        คุณถูกคัดออก</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:20}}>
        คุณสามารถดูผลแบบ real-time ได้</div>
      <div style={{width:'100%',maxWidth:340}}>
        {sorted.slice(0,8).map(([uid,p],i)=>(
          <div key={uid} style={{display:'flex',alignItems:'center',gap:10,
            padding:'8px 12px',marginBottom:6,borderRadius:8,
            background:(p.lives??0)>0?'rgba(5,150,105,.2)':'rgba(255,255,255,.06)'}}>
            <div style={{fontSize:14,fontWeight:800,color:'rgba(255,255,255,.4)',width:20}}>{i+1}</div>
            <div style={{fontSize:14,fontWeight:700,color:'#fff',flex:1}}>{p.name||'ผู้เล่น'}</div>
            <div style={{fontSize:13,color:(p.lives??0)>0?'#34D399':'rgba(255,255,255,.4)'}}>
              {(p.lives??0)>0?`${p.wpm||0} WPM`:'💀'}</div>
          </div>
        ))}
      </div>
      <button onClick={onLeave}
        style={{marginTop:16,background:'rgba(255,255,255,.1)',border:'1.5px solid rgba(255,255,255,.2)',
          color:'#fff',borderRadius:8,padding:'10px 24px',cursor:'pointer',
          fontSize:13,fontWeight:700,fontFamily:tf}}>
        ออกจากห้อง
      </button>
    </div>
  );
}
