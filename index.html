<style>
/* Parchment palette (matches the pixel panels in assets/ui) */
:root,[data-theme="light"]{
  --c-bg:#05638F;--c-card:#F3E6C0;--c-surf:#F8EED2;
  --c-border:#C9A66B;--c-border2:#A9854F;
  --c-t1:#3B2416;--c-t2:#6A4A30;--c-t3:#8C6E4E;--c-t4:#5A3A22;
  --c-key-sp:#D9C49A;--c-key-def:#EFE2BF;
  --c-txt-future:#B9A27E;--c-input-bg:#FFF9E6;
}

[data-theme="dark"]{
  --c-bg:#0F172A;--c-card:#1E293B;--c-surf:#263248;
  --c-border:#334155;--c-border2:#475569;
  --c-t1:#F1F5F9;--c-t2:#94A3B8;--c-t3:#64748B;--c-t4:#94A3B8;
  --c-key-sp:#334155;--c-key-def:#2D3F55;
  --c-txt-future:#64748B;--c-input-bg:#1E293B;
}
/* Fit-to-screen sizes: --fp frame padding, --fg gap between blocks, --cp card padding, --hb small button, --hh green title bar, --sb big start button, --hud/--hud-t typing HUD height (without/with timer) */
:root{--fp:14px 16px;--fg:14px;--cp:10px 8px;--hb:44px;--hh:56px;--sb:64px;--hud:96px;--hud-t:116px}
@media (max-height:820px){:root{--fp:8px 12px;--fg:8px;--cp:4px 6px;--hb:36px;--hh:44px;--sb:52px;--hud:76px;--hud-t:96px}}
html,body{height:100%;overflow:hidden}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--c-bg);font-family:'Noto Sans Thai Looped','Sarabun',sans-serif;color:var(--c-t1);transition:background .3s,color .3s;}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
flex-direction:column;gap:12px;font-family:'Noto Sans Thai Looped','Sarabun',sans-serif;font-size:18px;color:#FFF6D8;background:#05638F;z-index:9999}
#loading span{font-size:40px}
  /* +points pop-up while typing */
  @keyframes scorePop { 0%{opacity:0;transform:translateY(6px) scale(.8)} 25%{opacity:1;transform:translateY(0) scale(1.15)} 100%{opacity:0;transform:translateY(-14px) scale(1)} }
  .score-pop { display:inline-block; animation:scorePop .9s ease-out forwards; }
  /* Weekly test clock: each of the last 10 seconds "beats" */
  @keyframes timerBeat { 0%{transform:scale(1.45)} 55%{transform:scale(1)} 100%{transform:scale(1)} }
  .timer-beat { display:inline-block; animation:timerBeat .9s ease-out; }
  @keyframes timeUpPop { 0%{opacity:0;transform:scale(.6)} 18%{opacity:1;transform:scale(1.1)} 32%{transform:scale(1)} 100%{opacity:1;transform:scale(1)} }
  .timeup-pop { animation:timeUpPop 1.4s ease-out forwards; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
</style>
