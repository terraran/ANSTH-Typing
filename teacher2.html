<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>หน้าครู · คีย์บอร์ดเควส</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Teacher page, style "B": clean layout in the game's colours (parchment, ink, CraftPix green) and fonts.
   The whole page fits the screen (1366×657 lab PCs and up); only the table scrolls. */
:root{--ink:#3B2416;--paper:#FFFCF3;--bg:#F4ECD8;--line:#EADFC6;--green:#3FA36B;--gold:#FFC23D;--red:#D9483B;--blue:#2F78C4;--purple:#7A5BC2;
  --px:'Press Start 2P',monospace;--fs:clamp(13px,2.05vh,17px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai Looped','Sarabun',sans-serif;font-size:var(--fs);line-height:1.35}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
#root{height:100%}
.num{font-family:var(--px);font-size:.72em}
.hint{font-size:.85em;opacity:.8}
.dim{opacity:.5}
.sm{font-size:.9em}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.spacer{flex:1}
.empty{padding:24px;text-align:center;opacity:.75}
.app{height:100%;display:flex;flex-direction:column;padding:0 1.6vw 1.4vh;gap:1.2vh}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-shrink:0;background:#2E5E45;color:#FFF6D8;margin:0 -1.6vw;padding:.8vh 1.6vw}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15em;white-space:nowrap}
.brand img{height:4.4vh;min-height:28px;image-rendering:pixelated}
.who{display:flex;align-items:center;gap:10px;font-size:.88em;white-space:nowrap}

/* pieces */
.card{background:var(--paper);border:2px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 rgba(59,36,22,.25);padding:12px}
.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-weight:700;text-decoration:none;
  background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);padding:3px 11px;min-height:4.4vh}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.sm{min-height:0;padding:2px 9px}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.purple{background:var(--purple)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,.stat.care:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 9px;font-size:.82em;font-weight:700;white-space:nowrap}
.chip.warn{background:#FBE0DA;color:#9C2A1F}
.chip.mid{background:#FFF0C7;color:#B86E00}
.chip.none{background:#E4E0D8;color:#6F655A}
.chip.ok{background:#DDF2E3;color:#1F6B3D}
.stat{background:#FBF5E6;border:1px solid #E1D3B2;border-radius:6px;padding:2px 10px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;font-size:.88em}
.stat.care{color:#9C2A1F;cursor:pointer}
.stat.care.on{background:#FBE0DA;border-color:#9C2A1F}
.well{background:#FBF5E6;border:1px solid #E1D3B2;border-radius:6px}
.seg{display:inline-flex}
.seg button{padding:2px 9px;cursor:pointer;font-weight:700;font-size:.88em;margin-left:-2px;background:var(--paper);border:2px solid var(--ink)}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--gold)}
.seg button:disabled{cursor:default;opacity:.6}
.x{background:none;border:0;cursor:pointer;font-weight:700;font-size:1.15em;padding:0 4px}
.alert{display:flex;align-items:center;gap:10px;padding:5px 12px;flex-shrink:0;font-size:.92em;border-radius:8px;border:2px solid #E0A526;background:#FFF0C7}
.alert.ok{border-color:var(--green);background:#DDF2E3}
.alert.err{border-color:var(--red);background:#FBE0DA}
.alert .grow{flex:1}

/* login */
.login{height:100%;display:grid;place-items:center;padding:16px}
.login-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 36px;text-align:center;max-width:420px}
.login-logo{height:18vh;max-height:160px;image-rendering:pixelated}
.login h1{font-size:1.5em}
.err{color:#9C2A1F;font-weight:700;font-size:.9em}

/* class page */
.layout{flex:1;min-height:0;display:flex;gap:12px}
.roomhead{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.roomhead h2{font-size:1.3em;white-space:nowrap;margin-right:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}

/* room list on the left */
.sidebar{width:150px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:8px;min-height:0}
.side-title{padding:0 4px}
.side-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
.sidebar h4{font-size:.8em;opacity:.65;margin:6px 4px 2px}
.side-list button{text-align:left;border:0;background:none;padding:4px 10px;border-radius:6px;font-weight:700;cursor:pointer;flex-shrink:0}
.side-list button:hover{background:#FFF3CF}
.side-list button.on{background:var(--gold);box-shadow:0 2px 0 var(--ink)}
.side-list button:focus-visible,.stagepick button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.side-link{font-size:.78em;opacity:.8;padding:6px 4px 0;border-top:1px solid var(--line);text-decoration:none}
.side-link:hover{opacity:1;text-decoration:underline}

/* unlock dialog */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);display:grid;place-items:center;z-index:10;padding:16px}
.modal{width:min(560px,100%);display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.modal h3{font-size:1.15em;display:flex;align-items:center;gap:6px}
.modal h3 .x{margin-left:auto}
.stagepick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.stagepick button{border:2px solid var(--ink);border-radius:7px;background:var(--paper);padding:4px 8px;font-weight:700;cursor:pointer;font-size:.85em;text-align:left}
.stagepick button:hover{background:#FFF3CF}
.stagepick button.on{background:var(--gold)}
.stagepick button small{display:block;font-weight:400;opacity:.75;font-size:.85em}
.tablewrap{flex:1;min-height:0;display:flex;gap:12px}
.tbox{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;padding:8px 10px}
.tscroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
table.grid{width:100%;border-collapse:collapse;font-size:.92em}
table.grid th{position:sticky;top:0;z-index:2;text-align:left;padding:5px 8px;white-space:nowrap;cursor:pointer;user-select:none;font-size:.9em;background:#F1E4C4;border-bottom:2px solid var(--ink)}
table.grid th .ar{opacity:.4;font-size:.8em}
table.grid th.sorted .ar{opacity:1}
table.grid tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
table.grid tbody tr:hover{background:#FFF3CF}
table.grid tbody tr.sel{background:#FFE7A0}
table.grid td{padding:3px 8px;white-space:nowrap}
table.grid .c{text-align:center}
table.grid .r{text-align:right}
table.grid input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
table.grid .nm{max-width:16vw;overflow:hidden;text-overflow:ellipsis}
table.grid .bt{opacity:.6;font-size:.85em}
table.grid.narrow .bt{display:none}
table.grid.narrow td,table.grid.narrow th{padding-left:5px;padding-right:5px}
.stg{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.stg i{width:9px;height:12px;background:#D8C9A6;border:1px solid rgba(59,36,22,.35)}
.stg i.f{background:var(--green)}
.stg i.u{background:repeating-linear-gradient(45deg,var(--gold) 0 3px,#FFE39A 3px 6px)}
.trend{font-size:.8em;margin-left:4px}
.up{color:#1F8A4C}.down{color:var(--red)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8em;padding-top:5px;flex-shrink:0}
.foot>span:first-child{opacity:.8}

/* tabs under the room name: นักเรียน / การบ้าน / แบบทดสอบ */
.tabs{display:flex;gap:4px;align-items:flex-end;border-bottom:2px solid var(--ink);flex-shrink:0;margin-bottom:-.4vh}
.tabs button{border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#EFE5CC;padding:3px 14px;font-weight:700;cursor:pointer;margin-bottom:-2px}
.tabs button.on{background:var(--paper);padding-bottom:5px;box-shadow:0 3px 0 var(--gold) inset}
.tabs button:focus-visible,.item:focus-visible,.week:focus-visible,.chipbtn:focus-visible,.starpick button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabs .cnt{font-family:var(--px);font-size:.6em;background:var(--ink);color:#fff;border-radius:99px;padding:2px 6px;margin-left:5px;vertical-align:middle}
table.grid.static tbody tr{cursor:default}
.split{flex:1;min-height:0;display:flex;gap:12px}
.list{width:min(400px,32vw);flex-shrink:0;display:flex;flex-direction:column;gap:6px;min-height:0;padding:8px 10px}
.list .scroll,.weeks .scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;padding:2px}
.list h4{font-size:.8em;opacity:.7;margin:4px 2px 0}
.item,.week{border:2px solid #D9C9A3;border-radius:8px;padding:6px 10px;cursor:pointer;background:#FFFDF7;flex-shrink:0}
.item:hover,.week:hover{border-color:var(--ink)}
.item.on,.week.on{border-color:var(--ink);background:#FFF3CF;box-shadow:0 2px 0 var(--ink)}
.item .t{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.item .t .who{font-size:.8em;color:#B86E00;font-weight:600}
.item .m{font-size:.78em;opacity:.75;margin:1px 0 4px}
.bar{display:flex;align-items:center;gap:8px;font-size:.78em;min-width:260px}
.bar .track{flex:1;height:8px;background:#E8DCC0;border-radius:99px;overflow:hidden;border:1px solid rgba(59,36,22,.25);min-width:60px}
.bar .fill{height:100%;background:var(--green)}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0;padding:10px 12px}
.detail h3{font-size:1.05em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail h3 .hint{font-weight:400}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.weeks{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;min-height:0}
.week{padding:5px 10px;font-size:.88em}
.week b{display:block}
.week .tag{font-size:.75em;font-weight:700;color:#1F6B3D}
.week.empty{border-style:dashed;opacity:.85}
.two{flex:1;min-height:0;display:flex;gap:12px}
.two>div{min-height:0;display:flex;flex-direction:column}
.notdone{width:min(300px,28%);flex-shrink:0;font-size:.85em;overflow:auto;display:block!important}
.notdone .room{margin-bottom:6px}
.notdone .room.me{background:#FFF3CF;border-radius:6px;padding:2px 6px}
.field{display:flex;flex-direction:column;gap:4px}
.field>b{font-size:.9em}
.datechips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datechips input{border:2px solid #CDBB94;border-radius:6px;padding:2px 6px;background:#fff}
.chipbtn{border:2px solid var(--ink);border-radius:99px;background:var(--paper);padding:1px 10px;font-weight:700;font-size:.85em;cursor:pointer}
.chipbtn.on{background:var(--gold)}
.starpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.starpick button{border:2px solid var(--ink);border-radius:7px;background:var(--paper);padding:4px 8px;font-weight:700;cursor:pointer;font-size:.85em;text-align:left}
.starpick button.on{background:var(--gold)}
.starpick small{display:block;font-weight:400;opacity:.75;font-size:.85em}
.modal select{border:2px solid #CDBB94;border-radius:6px;padding:3px 6px;background:#fff;font-weight:600;max-width:100%}

/* ── code classrooms (public edition) ── */
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit}
.more{position:relative}
.more .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;display:flex;flex-direction:column;padding:6px;min-width:250px}
.more .menu button{text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap}
.more .menu button:hover{background:#FFF3CF}
.more .menu button:disabled{opacity:.45;cursor:default;background:none}
.alert.drop{border-color:var(--blue);background:#DCEBFA}
.top-msg{flex:0 1 auto;max-width:55vw;padding:3px 10px;color:var(--ink)}
.dropveil{position:fixed;inset:0;z-index:50;background:rgba(47,120,196,.25);border:6px dashed var(--blue);display:none;place-items:center;font-size:2em;font-weight:700;color:#0E3D70;pointer-events:none}
body.dragging .dropveil{display:grid}
input.big{font-size:1.25em;padding:6px 10px;width:100%;border:2px solid #CDBB94;border-radius:6px;background:#fff}
.bignum{font-family:var(--px);font-size:1.2em;width:4.5em;text-align:center;padding:6px;border:2px solid #CDBB94;border-radius:6px;background:#fff}
.pastebox{min-height:120px;resize:vertical;font:inherit;padding:6px 8px;border:2px solid #CDBB94;border-radius:6px}
/* create-room wizard */
.wiz{align-items:center}
.steps{display:flex;gap:10px;align-items:center;flex-shrink:0;margin-top:.4vh}
.step{display:flex;align-items:center;gap:8px;font-weight:700;padding:3px 12px;border-radius:99px;opacity:.6;background:#FFFCF3}
.step b{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:var(--px);font-size:.7em}
.step.on{opacity:1;background:var(--gold)}
.step.done{opacity:1}.step.done b{background:var(--green)}
.steps i{width:30px;height:3px;background:#CDBB94}
.wbox{width:min(1040px,94vw);flex:1;min-height:0;display:flex;flex-direction:column}
.wbox .head{font-weight:700;font-size:1.1em;margin-bottom:6px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vh}
.wcenter{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh;max-width:640px;margin:0 auto;width:100%}
.wfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-shrink:0}
.two-opt{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;flex:1;min-height:0}
.opt{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;cursor:pointer;opacity:.75}
.opt.on{opacity:1;outline:3px solid var(--gold);outline-offset:-1px}
.opt h4{display:flex;gap:8px;align-items:center}
.opt .radio{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);display:inline-block;flex-shrink:0}
.opt.on .radio{background:radial-gradient(var(--ink) 40%,transparent 45%)}
.paste{display:flex;gap:10px;flex:1;min-height:0}
.paste textarea{flex:1;min-height:0;resize:none;font:inherit;font-size:.9em;padding:6px 8px;border:2px solid #CDBB94;border-radius:6px}
.paste .preview{flex:1;min-height:0;overflow:auto;font-size:.85em;padding:4px 6px}
.paste .preview>div{display:flex;gap:8px}
.paste .preview .num{width:2.4em;text-align:right;opacity:.6;padding-top:.25em;flex-shrink:0}
.codes{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;align-content:start;padding:2px}
.codes .c{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:.88em;white-space:nowrap;overflow:hidden}
.codes .no{opacity:.6;width:2em;text-align:right}
.codes .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.names-edit{height:min(44vh,calc(100vh - 340px))}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.names-edit textarea{white-space:pre;overflow:auto}
.sidebar .new-room{justify-content:center;margin:2px 0 4px}
.codes .cd{font-family:var(--px);font-size:.68em;color:#1F6B3D}
/* printable cards */
.cards-view{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;gap:16px;padding:1.4vh 1.6vw}
.cards-side{width:290px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.cards-side label{cursor:pointer}
.cards-preview{flex:1;min-width:0;overflow:auto;display:flex;justify-content:center}
.sheets{zoom:var(--k,.5);display:flex;flex-direction:column;gap:24px;padding-bottom:24px}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);padding:8mm;color:#222;flex-shrink:0}
.kcard{border:1.5px dashed #999;margin:-0.75px;padding:4mm 4.5mm;display:grid;grid-template-columns:1fr 27mm;grid-template-rows:auto auto auto 1fr;column-gap:4mm;position:relative;font-size:10.5pt;line-height:1.3;overflow:hidden}
.kcard .ct{grid-column:1/3;display:flex;align-items:center;gap:2mm;font-weight:700;font-size:9.5pt;border-bottom:1.5px solid #3B2416;padding-bottom:1.2mm;margin-bottom:1.5mm;color:#3B2416;white-space:nowrap}
.kcard .ct img{height:5.5mm}
.kcard .ct .rm{margin-left:auto;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.kcard .who2{font-weight:700;font-size:11pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .who2 .no{font-family:var(--px);font-size:7.5pt;margin-right:1.5mm;background:#3B2416;color:#fff;padding:.6mm 1.2mm;border-radius:1mm}
.kcard .code{font-family:var(--px);font-size:13.5pt;letter-spacing:.8mm;margin:2mm 0 1.6mm;color:#1F4E36;white-space:nowrap}
.kcard .code small{display:block;font-family:'Noto Sans Thai Looped',sans-serif;font-size:7.5pt;letter-spacing:0;color:#666;margin-bottom:.6mm}
.kcard ol{margin:0;padding-left:4.2mm;font-size:8pt;color:#333}
.kcard .qr{grid-column:2;grid-row:2/5;align-self:center;text-align:center;font-size:6.5pt;color:#555}
.kcard .qr svg,.kcard .qr-wait{width:27mm;height:27mm;display:block}
.scissor{position:absolute;left:1mm;top:-1mm;font-size:8pt;color:#999;line-height:1}
@media print{
  @page{size:A4;margin:0}
  html,body,#root{height:auto;overflow:visible;background:#fff}
  body *{visibility:hidden}
  .sheets,.sheets *{visibility:visible}
  .cards-view{position:static;padding:0;display:block}
  .cards-preview{overflow:visible;display:block}
  .sheets{zoom:1;position:absolute;left:0;top:0;gap:0;padding:0}
  .sheet{box-shadow:none;page-break-after:always;break-after:page}
}

/* student panel */
.side{width:min(360px,26vw);flex-shrink:0;display:flex;flex-direction:column;min-height:0;gap:7px;padding:10px 12px}
.side h3{display:flex;align-items:center;gap:8px;font-size:1.05em}
.side h3 .x{margin-left:auto}
.badge{background:var(--ink);color:#fff;padding:3px 6px;border-radius:3px}
.row6{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv .stat{display:block;text-align:center;padding:3px 4px}
.kv b{display:block;margin:2px 0}
.kv small{font-size:.75em;opacity:.75}
.chart{flex:1;min-height:70px;display:flex;flex-direction:column}
.chart svg{flex:1;min-height:0;width:100%}
.legend{display:flex;gap:10px;font-size:.75em;opacity:.85;flex-wrap:wrap}
.stars9{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;font-size:.72em;text-align:center}
.stars9 .stat{display:block;padding:2px 0}
.stars9 b{display:block;font-size:.9em}
.recent-list{max-height:13vh;overflow:auto;font-size:.8em;scrollbar-width:thin}
.recent-list>div{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:baseline;padding:1px 0;border-bottom:1px solid var(--line)}
