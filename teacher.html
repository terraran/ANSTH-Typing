<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Panel — Thai Typing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *  { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun','Noto Sans Thai',system-ui,sans-serif;
           background: #F1F5F9; color: #0F172A; min-height: 100vh; }

    /* ── NAV BAR ── */
    #navbar { display: none; background: #0F172A; color: #fff; padding: 0 24px;
               height: 56px; align-items: center; gap: 16px; position: sticky;
               top: 0; z-index: 100; }
    #navbar.visible { display: flex; }
    .nav-title { font-size: 16px; font-weight: 800; flex: 1; }
    .nav-class-tabs { display: flex; gap: 6px; }
    .tab-btn { background: rgba(255,255,255,.12); border: none; color: #fff;
                border-radius: 6px; padding: 5px 12px; cursor: pointer;
                font-size: 12px; font-weight: 700; font-family: inherit;
                transition: background .15s; letter-spacing: .5px; }
    .tab-btn:hover   { background: rgba(255,255,255,.22); }
    .tab-btn.active  { background: #2563EB; }
    .nav-btn { background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.25);
               color: #fff; border-radius: 7px; padding: 5px 13px; cursor: pointer;
               font-size: 12px; font-weight: 600; font-family: inherit; transition: background .15s; }
    .nav-btn:hover { background: rgba(255,255,255,.18); }
    .nav-btn.back   { display: none; }
    .nav-btn.danger { border-color: #FCA5A5; color: #FCA5A5; }
    .nav-btn.danger:hover { background: rgba(239,68,68,.2); }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── LOGIN ── */
    #s-login { display: flex; align-items: center; justify-content: center;
                min-height: 100vh; padding: 24px; }
    .login-card { background: #fff; border-radius: 20px;
                   box-shadow: 0 4px 24px rgba(0,0,0,.08);
                   padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; }
    .login-emoji { font-size: 56px; margin-bottom: 12px; }
    .login-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .login-sub   { font-size: 12px; color: #94A3B8; margin-bottom: 28px; }
    .field-label { display: block; font-size: 12px; font-weight: 700; color: #475569;
                    text-align: left; margin-bottom: 6px; }
    .field-input { width: 100%; padding: 12px 14px; border: 2px solid #E2E8F0;
                    border-radius: 10px; font-size: 16px; font-family: inherit;
                    outline: none; margin-bottom: 14px; letter-spacing: 2px;
                    transition: border-color .15s; }
    .field-input:focus { border-color: #2563EB; }
    .primary-btn { width: 100%; background: #0F172A; color: #fff; border: none;
                    border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700;
                    font-family: inherit; cursor: pointer; transition: opacity .15s; }
    .primary-btn:disabled { opacity: .45; cursor: not-allowed; }
    .primary-btn:hover:not(:disabled) { opacity: .85; }
    .error-msg { color: #DC2626; font-size: 12px; margin-bottom: 10px; }
    .login-hint { font-size: 11px; color: #94A3B8; margin-top: 16px; }

    /* ── DASHBOARD ── */
    #s-dash { padding: 24px; max-width: 1000px; margin: 0 auto; }
    .summary-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .summary-card { background: #fff; border-radius: 12px; border: 1.5px solid #E2E8F0;
                     padding: 14px 20px; text-align: center; min-width: 100px; flex: 1; }
    .summary-val  { font-size: 24px; font-weight: 800; }
    .summary-lbl  { font-size: 10px; color: #94A3B8; font-weight: 600;
                     letter-spacing: .5px; margin-top: 2px; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-title { font-size: 16px; font-weight: 800; }
    .filter-btns { display: flex; gap: 6px; margin-left: auto; }
    .filter-btn { background: transparent; border: 1.5px solid #CBD5E1;
                   border-radius: 6px; padding: 4px 10px; cursor: pointer;
                   font-size: 11px; font-weight: 600; color: #64748B; font-family: inherit; }
    .filter-btn.active { background: #0F172A; border-color: #0F172A; color: #fff; }
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                     gap: 12px; }
    .student-card { background: #fff; border-radius: 12px; border: 1.5px solid #E2E8F0;
                     padding: 16px; cursor: pointer; transition: all .15s; position: relative; }
    .student-card:hover { transform: translateY(-2px);
                           box-shadow: 0 8px 24px rgba(0,0,0,.1); }
    .status-dot  { width: 10px; height: 10px; border-radius: 50%;
                    position: absolute; top: 14px; right: 14px; }
    .status-green  { background: #10B981; }
    .status-yellow { background: #F59E0B; }
    .status-red    { background: #EF4444; }
    .card-name   { font-size: 17px; font-weight: 800; margin-bottom: 10px; padding-right: 18px; }
    .card-stats  { display: flex; gap: 12px; margin-bottom: 8px; }
    .card-stat   { text-align: center; }
    .card-stat-val { font-size: 18px; font-weight: 800; }
    .card-stat-lbl { font-size: 9px; color: #94A3B8; font-weight: 600; letter-spacing: .5px; }
    .card-meta   { font-size: 10px; color: #94A3B8; margin-top: 6px; }
    .card-warn   { font-size: 10px; font-weight: 700; margin-top: 6px; }
    .warn-red    { color: #DC2626; }
    .warn-yellow { color: #D97706; }
    .empty-msg   { color: #94A3B8; font-size: 14px; padding: 40px; text-align: center; }
    .loading-msg { color: #94A3B8; font-size: 14px; padding: 32px; text-align: center; }

    /* ── STUDENT DETAIL ── */
    #s-detail { padding: 24px; max-width: 860px; margin: 0 auto; }
    .detail-header { margin-bottom: 22px; }
    .detail-name   { font-size: 26px; font-weight: 800; }
    .detail-class  { font-size: 12px; color: #94A3B8; font-weight: 600;
                      letter-spacing: .5px; margin-top: 2px; }
    .stats-row     { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-pill     { background: #fff; border: 1.5px solid #E2E8F0; border-radius: 12px;
                      padding: 10px 18px; text-align: center; min-width: 90px; }
    .stat-val      { font-size: 22px; font-weight: 800; }
    .stat-lbl      { font-size: 10px; color: #94A3B8; font-weight: 600; letter-spacing: .5px; }
    .sessions-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
    .sessions-table { width: 100%; border-collapse: collapse;
                       background: #fff; border-radius: 12px; overflow: hidden;
                       border: 1.5px solid #E2E8F0; font-size: 13px; }
    .sessions-table th { background: #F8FAFC; font-size: 10px; font-weight: 700;
                          color: #64748B; letter-spacing: .5px; padding: 10px 14px;
                          text-align: left; border-bottom: 1.5px solid #E2E8F0; }
    .sessions-table td { padding: 10px 14px; border-bottom: 1px solid #F1F5F9; }
    .sessions-table tr:last-child td { border-bottom: none; }
    .sessions-table tr:hover td { background: #F8FAFC; }
    .acc-good { color: #059669; font-weight: 700; }
    .acc-ok   { color: #D97706; font-weight: 700; }
    .acc-low  { color: #DC2626; font-weight: 700; }
    .no-sessions { color: #94A3B8; font-size: 13px; padding: 24px;
                    text-align: center; background: #fff; border-radius: 12px;
                    border: 1.5px solid #E2E8F0; }
  </style>
</head>
<body>

  <!-- NAV BAR -->
  <nav id="navbar">
    <div class="nav-title">🎓 Teacher Panel</div>
    <div class="nav-class-tabs" id="class-tabs"></div>
    <button class="nav-btn back" id="btn-back" onclick="showDash()"
      style="background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);
      color:#fff;border-radius:7px;padding:5px 13px;font-size:12px;font-weight:600;
      font-family:inherit;cursor:pointer;transition:background .15s">← กลับ</button>
    <a href="index.html" class="nav-btn" style="text-decoration:none;background:rgba(255,255,255,.1);
      border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:5px 13px;
      font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
      transition:background .15s">⌨️ นักเรียน</a>
    <button class="nav-btn danger" onclick="logout()">ออกจากระบบ</button>
  </nav>

  <!-- SCREEN 1: LOGIN -->
  <div id="s-login">
    <div class="login-card">
      <div class="login-emoji">🎓</div>
      <div class="login-title">Teacher Panel</div>
      <div class="login-sub">แผงครู — Thai Typing App</div>

      <label class="field-label">รหัสผ่านครู / Teacher Password</label>
      <input id="tc-input" class="field-input" type="password"
        placeholder="••••••••" autocomplete="off"
        onkeydown="if(event.key==='Enter') tryLogin()">
      <div class="error-msg" id="login-err" style="display:none"></div>
      <button class="primary-btn" id="login-btn" onclick="tryLogin()">เข้าสู่ระบบ →</button>
      <a href="index.html" style="display:block;margin-top:12px;padding:11px;
        background:#F1F5F9;border:1.5px solid #E2E8F0;border-radius:10px;
        text-align:center;text-decoration:none;color:#475569;font-size:14px;
        font-weight:600;font-family:inherit;transition:background .15s"
        onmouseover="this.style.background='#E2E8F0'"
        onmouseout="this.style.background='#F1F5F9'">
        ⌨️ ไปหน้านักเรียน
      </a>
    </div>
  </div>

  <!-- SCREEN 2: DASHBOARD -->
  <div class="screen" id="s-dash">
    <div class="summary-row" id="summary-row">
      <div class="summary-card"><div class="summary-val" id="sum-students">—</div><div class="summary-lbl">นักเรียน</div></div>
      <div class="summary-card"><div class="summary-val" id="sum-sessions">—</div><div class="summary-lbl">เซสชั่นรวม</div></div>
      <div class="summary-card"><div class="summary-val" id="sum-cpm">—</div><div class="summary-lbl">CPM เฉลี่ย</div></div>
      <div class="summary-card"><div class="summary-val" id="sum-acc">—</div><div class="summary-lbl">แม่น เฉลี่ย</div></div>
      <div class="summary-card" style="border-color:#FCA5A5">
        <div class="summary-val" id="sum-attn" style="color:#DC2626">—</div>
        <div class="summary-lbl" style="color:#DC2626">ต้องดูแล ⚠️</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title" id="dash-heading">นักเรียน</div>
      <div class="filter-btns">
        <button class="filter-btn active" id="f-all"  onclick="setFilter('all')">ทั้งหมด</button>
        <button class="filter-btn"         id="f-attn" onclick="setFilter('attn')">⚠️ ต้องดูแล</button>
      </div>
    </div>

    <div class="student-grid" id="student-grid">
      <div class="loading-msg">กำลังโหลด...</div>
    </div>
  </div>

  <!-- SCREEN 3: STUDENT DETAIL -->
  <div class="screen" id="s-detail">
    <div class="detail-header">
      <div class="detail-name" id="detail-name">—</div>
      <div class="detail-class" id="detail-class">—</div>
    </div>
    <div class="stats-row" id="detail-stats"></div>
    <div class="sessions-title">ประวัติการฝึก / Session History</div>
    <div id="detail-sessions"></div>
  </div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG  (same Apps Script URL as student app)
// ─────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpp0IvmQjrv0O8MZ6XSX3SQDfJIIii4RsidX5IvaPDaKyJ5x0QLhbdKPle4TX4BKhsmQ/exec';

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let teacherCode  = sessionStorage.getItem('teacherCode') || '';
let classes      = [];
let currentClass = '';
let allStudents  = [];   // for the currently loaded class
let filterMode   = 'all';

// ─────────────────────────────────────────────────────────────
// INIT — auto-login if session has a code
// ─────────────────────────────────────────────────────────────
if (teacherCode) {
  initDashboard();
} // else login screen is already visible by default

// ─────────────────────────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────────────────────────
async function tryLogin() {
  const btn   = document.getElementById('login-btn');
  const input = document.getElementById('tc-input');
  const err   = document.getElementById('login-err');
  const code  = input.value.trim();
  if (!code) return;

  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  err.style.display = 'none';

  try {
    const url  = SCRIPT_URL + '?action=getClasses&tc=' + encodeURIComponent(code);
    const res  = await fetch(url, { redirect: 'follow' });
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    // Success
    teacherCode = code;
    sessionStorage.setItem('teacherCode', code);
    classes = data.classes || [];
    initDashboard();
  } catch (e) {
    err.textContent  = 'รหัสผ่านไม่ถูกต้อง หรือเชื่อมต่อไม่ได้';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ →';
  }
}

// ─────────────────────────────────────────────────────────────
// DASHBOARD INIT
// ─────────────────────────────────────────────────────────────
async function initDashboard() {
  // If classes aren't loaded yet (auto-login path), fetch them
  if (!classes.length) {
    try {
      const url  = SCRIPT_URL + '?action=getClasses&tc=' + encodeURIComponent(teacherCode);
      const res  = await fetch(url, { redirect: 'follow' });
      const data = await res.json();
      if (data.error) { logout(); return; }
      classes = data.classes || [];
    } catch { logout(); return; }
  }

  // Show UI
  document.getElementById('s-login').style.display  = 'none';
  document.getElementById('navbar').classList.add('visible');
  showDash();

  // Build class tabs
  buildClassTabs();

  // Load first class automatically
  if (classes.length) loadClass(classes[0]);
  else document.getElementById('student-grid').innerHTML =
    '<div class="empty-msg">ยังไม่มีข้อมูล — รอให้นักเรียนเล่นก่อน</div>';
}

function buildClassTabs() {
  const container = document.getElementById('class-tabs');
  container.innerHTML = '';
  classes.forEach(code => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (code === currentClass ? ' active' : '');
    btn.textContent = code;
    btn.onclick = () => loadClass(code);
    container.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────
// LOAD CLASS DATA
// ─────────────────────────────────────────────────────────────
async function loadClass(code) {
  currentClass = code;
  filterMode   = 'all';
  document.getElementById('f-all').classList.add('active');
  document.getElementById('f-attn').classList.remove('active');

  // Update active tab
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === code);
  });

  document.getElementById('dash-heading').textContent = 'นักเรียน — ห้อง ' + code;
  document.getElementById('student-grid').innerHTML = '<div class="loading-msg">กำลังโหลด...</div>';

  try {
    const url  = SCRIPT_URL + '?action=getClassData&classCode=' +
                 encodeURIComponent(code) + '&tc=' + encodeURIComponent(teacherCode);
    const res  = await fetch(url, { redirect: 'follow' });
    const data = await res.json();

    if (data.error) throw new Error(data.error);
    allStudents = data.students || [];
    renderSummary();
    renderStudentCards();
  } catch (e) {
    document.getElementById('student-grid').innerHTML =
      '<div class="empty-msg">โหลดข้อมูลไม่ได้: ' + e.message + '</div>';
  }
}

// ─────────────────────────────────────────────────────────────
// SUMMARY ROW
// ─────────────────────────────────────────────────────────────
function renderSummary() {
  const n = allStudents.length;
  if (!n) {
    ['sum-students','sum-sessions','sum-cpm','sum-acc','sum-attn']
      .forEach(id => document.getElementById(id).textContent = '—');
    return;
  }
  const totalSessions = allStudents.reduce((s, st) => s + st.totalSessions, 0);
  const avgCpm  = Math.round(allStudents.reduce((s, st) => s + st.avgCpm, 0) / n);
  const avgAcc  = Math.round(allStudents.reduce((s, st) => s + st.avgAcc, 0) / n);
  const attnCnt = allStudents.filter(needsAttention).length;

  document.getElementById('sum-students').textContent = n;
  document.getElementById('sum-sessions').textContent = totalSessions;
  document.getElementById('sum-cpm').textContent      = avgCpm;
  document.getElementById('sum-acc').textContent      = avgAcc + '%';
  document.getElementById('sum-attn').textContent     = attnCnt;
}

// ─────────────────────────────────────────────────────────────
// STUDENT CARDS
// ─────────────────────────────────────────────────────────────
function setFilter(mode) {
  filterMode = mode;
  document.getElementById('f-all').classList.toggle('active',  mode === 'all');
  document.getElementById('f-attn').classList.toggle('active', mode === 'attn');
  renderStudentCards();
}

function renderStudentCards() {
  const list = filterMode === 'attn'
    ? allStudents.filter(needsAttention)
    : allStudents;

  const grid = document.getElementById('student-grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty-msg">' +
      (filterMode === 'attn' ? '✅ นักเรียนทุกคนทำได้ดี!' : 'ยังไม่มีข้อมูล') +
      '</div>';
    return;
  }

  grid.innerHTML = '';
  list.forEach(st => {
    const status = statusOf(st);
    const days   = daysSince(st.lastActive);
    const card   = document.createElement('div');
    card.className = 'student-card';
    card.onclick   = () => showStudentDetail(st);

    const accColor = st.avgAcc >= 95 ? '#059669' : st.avgAcc >= 85 ? '#D97706' : '#DC2626';
    const cpmColor = st.avgCpm >= 30 ? '#059669' : st.avgCpm >= 20 ? '#D97706' : '#DC2626';

    let warnHtml = '';
    if (days > 7)       warnHtml = '<div class="card-warn warn-red">⚠️ ไม่ได้ฝึก ' + days + ' วัน</div>';
    else if (status === 'yellow')
      warnHtml = '<div class="card-warn warn-yellow">⚠️ ต้องการความช่วยเหลือ</div>';

    card.innerHTML = `
      <div class="status-dot status-${status}"></div>
      <div class="card-name">${st.name}</div>
      <div class="card-stats">
        <div class="card-stat">
          <div class="card-stat-val" style="color:${cpmColor}">${st.avgCpm}</div>
          <div class="card-stat-lbl">CPM เฉลี่ย</div>
        </div>
        <div class="card-stat">
          <div class="card-stat-val" style="color:${accColor}">${st.avgAcc}%</div>
          <div class="card-stat-lbl">ความแม่น</div>
        </div>
        <div class="card-stat">
          <div class="card-stat-val">${st.totalSessions}</div>
          <div class="card-stat-lbl">เซสชั่น</div>
        </div>
      </div>
      <div class="card-meta">ล่าสุด ${days === 0 ? 'วันนี้' : days + ' วันที่แล้ว'}</div>
      ${warnHtml}
    `;
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────
// STUDENT DETAIL
// ─────────────────────────────────────────────────────────────
function showStudentDetail(student) {
  // Update nav
  document.getElementById('btn-back').style.display = 'inline-block';

  // Show detail screen, hide dashboard
  document.getElementById('s-dash').classList.remove('active');
  document.getElementById('s-detail').classList.add('active');

  // Header
  document.getElementById('detail-name').textContent  = student.name;
  document.getElementById('detail-class').textContent = 'ห้อง ' + currentClass +
    ' · ' + student.totalSessions + ' เซสชั่น';

  // Stats row
  const days = daysSince(student.lastActive);
  const statsHtml = [
    ['CPM เฉลี่ย',   student.avgCpm, student.avgCpm>=30?'#059669':student.avgCpm>=20?'#D97706':'#DC2626'],
    ['WPM เฉลี่ย',   Math.round(student.avgCpm/5), '#2563EB'],
    ['ความแม่น',     student.avgAcc+'%', student.avgAcc>=95?'#059669':student.avgAcc>=85?'#D97706':'#DC2626'],
    ['CPM สูงสุด',   student.bestCpm, '#7C3AED'],
    ['ล่าสุด',       days===0?'วันนี้':days+' วัน', days<=3?'#059669':days<=7?'#D97706':'#DC2626'],
  ].map(([lbl,val,color]) =>
    `<div class="stat-pill">
       <div class="stat-val" style="color:${color}">${val}</div>
       <div class="stat-lbl">${lbl}</div>
     </div>`
  ).join('');
  document.getElementById('detail-stats').innerHTML = statsHtml;

  // Session history table
  if (!student.sessions.length) {
    document.getElementById('detail-sessions').innerHTML =
      '<div class="no-sessions">ยังไม่มีเซสชั่น</div>';
    return;
  }

  const rows = student.sessions.map(s => {
    const accClass = s.accuracy >= 95 ? 'acc-good' : s.accuracy >= 85 ? 'acc-ok' : 'acc-low';
    return `<tr>
      <td>${formatDate(s.date)}</td>
      <td>${s.exercise}</td>
      <td><strong>${s.cpm}</strong></td>
      <td>${s.wpm}</td>
      <td class="${accClass}">${s.accuracy}%</td>
      <td>${s.errors}</td>
      <td>${s.chars}</td>
      <td style="color:#94A3B8">${formatDuration(s.duration)}</td>
    </tr>`;
  }).join('');

  document.getElementById('detail-sessions').innerHTML = `
    <table class="sessions-table">
      <thead><tr>
        <th>วันที่</th><th>แบบฝึก</th><th>CPM</th><th>WPM</th>
        <th>ความแม่น</th><th>ผิด</th><th>ตัวอักษร</th><th>เวลา</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
function needsAttention(st) {
  return daysSince(st.lastActive) > 7 || st.avgAcc < 85 || st.avgCpm < 15;
}

function statusOf(st) {
  if (daysSince(st.lastActive) > 7) return 'red';
  if (st.avgAcc < 85 || st.avgCpm < 15) return 'yellow';
  return 'green';
}

function daysSince(dateVal) {
  if (!dateVal) return 999;
  const d = dateVal instanceof Date ? dateVal : new Date(dateVal);
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function formatDate(dateVal) {
  if (!dateVal) return '—';
  const d = dateVal instanceof Date ? dateVal : new Date(dateVal);
  if (isNaN(d.getTime())) return String(dateVal).slice(0, 10);
  // Show as DD/MM/YY (Buddhist year +543)
  const dd  = String(d.getDate()).padStart(2,'0');
  const mm  = String(d.getMonth()+1).padStart(2,'0');
  const yy  = String(d.getFullYear()+543).slice(-2);
  const hh  = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} ${hh}:${min}`;
}

function formatDuration(seconds) {
  if (!seconds) return '—';
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
