// ── SAFE ZONE CONFIG ──────────────────────────────────────────────────
// Zone starts 30s into the race, advances at ZONE_CPM chars/min.
// Players more than ZONE_GAP chars behind lose 1 life every ZONE_TICK ms.
// Text display: show ~2 lines at a time, advance on completion
const CHUNK_CHARS = 76; // chars per chunk (~2 lines at 34px Thai font)

// Build word-boundary chunks — extracted to module level so Babel handles it reliably
function buildChunks(targetChars) {
  if (!targetChars.length) return [{start:0,end:0}];
  const result = [];
  let start = 0;
  while (start < targetChars.length) {
    let end = Math.min(start + CHUNK_CHARS, targetChars.length);
    if (end < targetChars.length) {
      // Advance to end of current word — never split mid-word
      while (end < targetChars.length && targetChars[end] !== ' ') end++;
      // Include the trailing space in this chunk
      if (end < targetChars.length) end++;
    }
    result.push({start, end});
    start = end;
    if (result.length > 200) break; // safety cap
  }
  return result;
}

const ZONE_GRACE = 25;    // seconds before the first circle starts closing
const ZONE_GAP   = 38;    // characters of breathing room behind the zone
const ZONE_TICK  = 10000; // lose one life every 10 seconds outside the zone
const ZONE_PHASES = [
  { after: 0,   cpm: 60 },
  { after: 60,  cpm: 84 },
  { after: 120, cpm: 108 },
  { after: 180, cpm: 132 },
];
const ZONE_TICK_SECS = ZONE_TICK / 1000;

function getZoneSpeed(elapsedSeconds) {
  const phase = [...ZONE_PHASES].reverse().find(p => elapsedSeconds >= ZONE_GRACE + p.after);
  return phase ? phase.cpm : 0;
}

function getZonePos(startTime, totalChars) {
  if (!startTime) return 0;
  const elapsed = (Date.now() - startTime) / 1000;
  if (elapsed < ZONE_GRACE) return 0;
  let remaining = elapsed - ZONE_GRACE;
  let chars = 0;
  for (let i = 0; i < ZONE_PHASES.length; i++) {
    const phase = ZONE_PHASES[i];
    const next = ZONE_PHASES[i + 1];
    const duration = next ? next.after - phase.after : Infinity;
    const inPhase = Math.min(remaining, duration);
    chars += (inPhase / 60) * phase.cpm;
    remaining -= inPhase;
    if (remaining <= 0) break;
  }
  return Math.min(Math.floor(chars), totalChars);
}

function mapKey(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return null;
  const entry = KEYMAP[e.code];
  return entry ? (entry[e.shiftKey ? 1 : 0] ?? null) : null;
}

function validateInput(expected, typed) {
  const pos = typed.length - 1;
  if (pos < 0) return { ok: true };
  const got = typed[pos], want = expected[pos];
  if (got === want) return { ok: true, position: pos };
  if (pos >= expected.length) return { ok:false, errorType:'OVERFLOW', costsLife:true };
  const gC = CHAR_CLASS[got] ?? 'NON', wC = CHAR_CLASS[want] ?? 'NON';
  if (wC==='AV'  && gC==='TONE') return { ok:false, expected:want, got, hint:`พิมพ์สระ (${want}) ก่อนวรรณยุกต์ (${got})`, costsLife:false };
  if (wC==='TONE'&& gC==='AV')   return { ok:false, expected:want, got, hint:`พิมพ์วรรณยุกต์ (${want}) หลังสระ`,          costsLife:false };
  if (wC==='LV'  && gC==='CONS') return { ok:false, expected:want, got, hint:`สระหน้า (${want}) พิมพ์ก่อนพยัญชนะ (${got})`, costsLife:false };
  return { ok:false, hint:null, costsLife:true };
}

function findKeyForChar(char) {
  for (const [code, [u, s]] of Object.entries(KEYMAP)) {
    if (u === char) return { code, needsShift: false };
    if (s === char) return { code, needsShift: true };
  }
  return null;
}

// TEXT GENERATOR

function generateText(words, minChars) {
  const arr = [...words];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const result = [];
  let chars = 0, i = 0;
  while (chars < minChars) {
    const word = arr[i % arr.length];
    result.push(word);
    chars += [...word].length + 1;
    i++;
    if (i > arr.length * 6) break;
  }
  return result.join(' ');
}

  [ {c:'ShiftLeft',lbl:'⇧ Shift',w:2.25,sp:true},
    {c:'KeyZ'},{c:'KeyX'},{c:'KeyC'},{c:'KeyV'},{c:'KeyB'},{c:'KeyN'},{c:'KeyM'},
    {c:'Comma'},{c:'Period'},{c:'Slash'},
    {c:'ShiftRight',lbl:'⇧ Shift',w:2.75,sp:true} ],
  [ {c:'CtrlL',lbl:'Ctrl',w:1.5,sp:true},{c:'AltL',lbl:'Alt',w:1.5,sp:true},
    {c:'Space',lbl:'⎵ Space',w:7,sp:true},
    {c:'AltR',lbl:'Alt',w:1.5,sp:true},{c:'CtrlR',lbl:'Ctrl',w:1.5,sp:true} ],
];

// KEY component

function Key({ kdef, nextCode, needsShift, flashCode, shiftHeld, correctShiftCode }) {
  const { c, lbl, w=1, sp=false } = kdef;
  const meta=KEY_META[c], chars=KEYMAP[c];
  const isNext=(nextCode===c);
  const isShift=(c==='ShiftLeft'||c==='ShiftRight')&&needsShift&&
    (correctShiftCode ? c===correctShiftCode : true);
  const isFlash=flashCode===c, active=isNext||isShift;
  const shifted   = shiftHeld && chars && chars.length>1 && chars[1]!==chars[0];
  const mainChar  = chars ? (shifted ? chars[1] : chars[0]) : '';
  const smallChar = chars ? (shifted ? chars[0] : chars[1]) : '';
  const bg=isFlash?'#FCA5A5':active?'#1D4ED8':sp?'var(--c-key-sp)':meta?FINGER_COLORS[meta.f]:'var(--c-key-def)';
  const shadow=active?'0 0 0 2px #1D4ED8,0 0 16px #93C5FD':'0 1px 3px rgba(0,0,0,.2)';
  return (
    <div style={{ flex:w,height:44,background:bg,boxShadow:shadow,borderRadius:6,
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      position:'relative',cursor:'default',userSelect:'none',
      transition:'background .1s,box-shadow .1s',minWidth:0 }}>
      {sp ? (
        <span style={{fontSize:11,fontWeight:700,color:active?'#fff':'#475569'}}>{lbl}</span>
      ) : chars ? (
        <>
          <span style={{position:'absolute',
            top:shifted?'auto':3, bottom:shifted?3:'auto',
            right:shifted?'auto':5, left:shifted?4:'auto',
            fontSize:9,color:active?'rgba(255,255,255,.5)':'#94A3B8',fontWeight:600,
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>{smallChar}</span>
          <span style={{fontSize:18,fontWeight:700,lineHeight:1,
            color:active?'#fff':'var(--c-t1)',
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>{mainChar}</span>
          {meta?.home&&!shifted&&<span style={{position:'absolute',bottom:3,width:4,height:4,
            borderRadius:'50%',background:active?'#BFDBFE':'rgba(0,0,0,.25)'}}/>}
        </>
      ) : null}
    </div>
  );
}

// TEXT DISPLAY

const COMBINING_CLS = new Set(['AV','BV','BD','TONE','AD']);

function TextDisplay({ displayChars, displayPos }) {
  const tokens = [];
  let wordBuf=[], wordStart=0;
  displayChars.forEach((ch,i) => {
    if (ch===' ') {
      if (wordBuf.length) { tokens.push({type:'word',chars:wordBuf,start:wordStart}); wordBuf=[]; }
      tokens.push({type:'space',start:i});
    } else {
      if (!wordBuf.length) wordStart=i;
      wordBuf.push({ch,idx:i});
    }
  });
  if (wordBuf.length) tokens.push({type:'word',chars:wordBuf,start:wordStart});

  const cursorOnCombining = displayPos < displayChars.length &&
    COMBINING_CLS.has(CHAR_CLASS[displayChars[displayPos]] ?? '');
  let baseIdxForCombining = -1;
  if (cursorOnCombining) {
    let bi = displayPos - 1;
    while (bi >= 0 && COMBINING_CLS.has(CHAR_CLASS[displayChars[bi]] ?? '')) bi--;
    baseIdxForCombining = bi;
  }

  return (
    <div style={{fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
      fontSize:34,lineHeight:2,display:'flex',flexWrap:'wrap',
      alignContent:'flex-start',gap:'0 2px',minHeight:130}}>
      {tokens.map((tok,ti) => {
        if (tok.type==='space') {
          const done=tok.start<displayPos,cur=tok.start===displayPos;
          return (
            <span key={ti} style={{display:'inline-block',width:14,textAlign:'center',
              color:done?'#059669':'#CBD5E1',
              background:cur?'#FEF08A':'transparent',
              borderBottom:cur?'3px solid #F59E0B':'none'}}>
              {done?'·':cur?'⎵':' '}
            </span>
          );
        }
        return (
          <span key={ti} style={{display:'inline-block',whiteSpace:'nowrap'}}>
            {tok.chars.map(({ch,idx}) => {
              const done = idx < displayPos;
              const cur  = idx === displayPos;
              const isBaseForCombiningCursor = cursorOnCombining && idx === baseIdxForCombining;
              const showHighlight = cur || isBaseForCombiningCursor;
              return (
                <span key={idx} style={{
                  color:done?'#059669':cur?'var(--c-t1)':'var(--c-txt-future)',
                  background:showHighlight?'#FEF08A':'transparent',
                  borderBottom:showHighlight?'3px solid #F59E0B':'none',
                }}>{ch}</span>
              );
            })}
          </span>
        );
      })}
    </div>
  );
}

              borderBottom:'3px solid rgba(255,255,255,.5)',color:'#fff',
              outline:'none',fontFamily:'system-ui,monospace',
              boxSizing:'border-box',caretColor:'#fff',marginBottom:14}}/>
          {errMsg&&<div style={{color:'#FCA5A5',fontSize:12,marginBottom:10,
            fontFamily:tf,textAlign:'center'}}>{errMsg}</div>}
          <button onClick={submit}
            disabled={code.trim().length<4||status==='loading'}
            style={{width:'100%',background:'#22C55E',color:'#fff',border:'none',
              borderRadius:10,padding:'14px',fontSize:15,fontWeight:800,fontFamily:tf,
              cursor:code.trim().length<4?'not-allowed':'pointer',
              opacity:code.trim().length<4?0.5:1,transition:'opacity .15s',letterSpacing:.5}}>
            {status==='loading'?'กำลังโหลด...' :'เข้าร่วม → JOIN'}
          </button>
        </div>
      </div>
      <div style={{textAlign:'center',marginTop:14}}>
        <button onClick={onSolo}
          style={{background:'transparent',border:'none',color:'var(--c-t3)',
            cursor:'pointer',fontSize:12,fontFamily:tf,textDecoration:'underline'}}>
          Anonymous mode — ฝึกคนเดียว (ไม่บันทึกผล)
        </button>
      </div>
    </div>
  );
}

            borderRadius:8,fontSize:14,marginBottom:14,outline:'none',
            fontFamily:thaiFont,boxSizing:'border-box'}}/>

// Chapter groupings for lesson selector
const CHAPTERS = [
  { id:1, label:'Chapter 1', title:'แถวหลัก',   subtitle:'ไม่ต้องใช้ Shift',       icon:'🎹', from:'#1D4ED8', to:'#3B82F6', dot:'#1D4ED8', lessonIds:[1,2,3,4] },
  { id:2, label:'Chapter 2', title:'Shift ง่าย', subtitle:'ตัวอักษรที่ใช้บ่อย',    icon:'⇧',  from:'#059669', to:'#34D399', dot:'#059669', lessonIds:[5,6,7,8] },
  { id:3, label:'Chapter 3', title:'Shift ยาก',  subtitle:'ตัวอักษรหายาก',         icon:'⚡', from:'#DC2626', to:'#F87171', dot:'#DC2626', lessonIds:[9,10,11] },
  { id:4, label:'Chapter 4', title:'ตัวพิเศษ',  subtitle:'เลขไทยและเครื่องหมาย',  icon:'🔢', from:'#7C3AED', to:'#A78BFA', dot:'#7C3AED', lessonIds:[12,13] },
];

// LESSON SELECTOR

function LessonScreen({ studentName, classCode, onSelect, onOpenSetup, onJoin, joinCode, setJoinCode, joinError, mpBusy, storyPath, storyPower, onViewStats, onLogin, assignments, onAssignmentSelect }) {
  const savedCh=(()=>{try{return Math.min(parseInt(localStorage.getItem('lastChapter')||'0')||0,CHAPTERS.length-1);}catch{return 0;}})();
  const getExercises=(lesson)=>{
    if(!lesson.story) return lesson.exercises||[];
    if(lesson.id===15) return storyPath==='B'?(lesson.exercisesB||[]):(lesson.exercisesA||[]);
    if(lesson.id===16){
      if(storyPath==='B') return lesson.exercisesCave||[];
      return storyPower==='lightning'?(lesson.exercisesLightning||[]):(lesson.exercisesGold||[]);
    }
    return lesson.exercises||[];
  };
  const [chIdx,       setChIdx]       = useState(savedCh);
  const [openLesson,  setOpenLesson]  = useState(null);
  const [cardW,       setCardW]       = useState(0);
  const carouselRef = useRef(null);
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  useEffect(()=>{ if(carouselRef.current) setCardW(carouselRef.current.offsetWidth); },[]);

  const gotoChapter = (i) => {
    const c=Math.max(0,Math.min(i,CHAPTERS.length-1));
    setChIdx(c); setOpenLesson(null);
    try{ localStorage.setItem('lastChapter',String(c)); }catch{}
  };

  const PEEK=28, GAP=10;
  const cw = cardW>0 ? cardW-PEEK : 0;
  const stripTransform = cw>0
    ? `translateX(-${chIdx*(cw+GAP)}px)`
    : `translateX(-${chIdx*100}%)`;
  const minCardW = cw>0 ? cw+'px' : '100%';

  const atFirst = chIdx===0;
  const atLast  = chIdx===CHAPTERS.length-1;

  return (
    <div style={{fontFamily:tf}}>

      {/* ── Login prompt / Player badge — mutually exclusive ── */}
      {!studentName&&SCRIPT_URL&&(
        <div style={{background:'linear-gradient(135deg,#1D4ED8,#3B82F6)',borderRadius:14,
          padding:'14px 18px',marginBottom:20,display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:24}}>👤</span>
          <div style={{flex:1,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
            <div style={{fontSize:14,fontWeight:800,color:'#fff'}}>ยังไม่ได้เข้าสู่ระบบ</div>
            <div style={{fontSize:11,color:'#BFDBFE'}}>เข้าสู่ระบบด้วย Google เพื่อบันทึกผลและดูสถิติ</div>
          </div>
          <button onClick={()=>onLogin&&onLogin()}
            style={{background:'#fff',color:'#1D4ED8',border:'none',borderRadius:8,
              padding:'9px 16px',cursor:'pointer',fontSize:13,fontWeight:800,
              fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",whiteSpace:'nowrap'}}>
            Sign in with Google
          </button>
        </div>
      )}
      {studentName&&(
        <div style={{display:'flex',alignItems:'center',gap:12,background:'var(--c-surf)',
          borderRadius:14,padding:'12px 16px',marginBottom:20,border:'1.5px solid var(--c-border)'}}>
          <div style={{width:42,height:42,borderRadius:'50%',flexShrink:0,
            background:'linear-gradient(135deg,#1D4ED8,#7C3AED)',
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>👤</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:800,color:'var(--c-t1)'}}>{studentName}</div>
            <div style={{fontSize:11,color:'var(--c-t3)'}}>ห้อง {classCode}</div>
          </div>
          <button onClick={()=>onViewStats&&onViewStats()}
            style={{background:'var(--c-surf)',border:'1.5px solid var(--c-border)',color:'#2563EB',
              borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:12,
              fontWeight:700,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
              whiteSpace:'nowrap'}}>
            📊 สถิติ
          </button>
        </div>
      )}

      {/* ── Assignments ── */}
      {studentName && assignments && assignments.length > 0 && (
        <AssignmentCard
          assignments={assignments}
          onSelect={onAssignmentSelect}
        />
      )}

      {/* ── Chapter carousel ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,
          marginBottom:12,textAlign:'center'}}>🎮 เลือก CHAPTER</div>

        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {/* Prev */}
          <button onClick={()=>gotoChapter(chIdx-1)} disabled={atFirst}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid var(--c-border)',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atFirst?'default':'pointer',
              color:atFirst?'#CBD5E1':'#64748B',opacity:atFirst?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ‹
          </button>

          {/* Card strip */}
          <div ref={carouselRef} style={{flex:1,overflow:'hidden'}}>
            <div style={{display:'flex',gap:GAP+'px',transition:'transform .35s cubic-bezier(.4,0,.2,1)',
              transform:stripTransform}}>
              {CHAPTERS.map(ch=>{
                const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
                return (
                  <div key={ch.id} style={{minWidth:minCardW,flexShrink:0}}>
                    <div style={{background:`linear-gradient(135deg,${ch.from},${ch.to})`,
                      borderRadius:18,padding:'22px 20px',textAlign:'center',
                      position:'relative',overflow:'hidden'}}>
                      <div style={{position:'absolute',top:-20,right:-20,width:80,height:80,
                        borderRadius:'50%',background:'rgba(255,255,255,.08)'}}/>
                      <div style={{fontSize:30,marginBottom:6}}>{ch.icon}</div>
                      <div style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.65)',
                        letterSpacing:1,marginBottom:3}}>{ch.label.toUpperCase()}</div>
                      <div style={{fontSize:19,fontWeight:800,color:'#fff',marginBottom:4,
                        fontFamily:tf}}>{ch.title}</div>
                      <div style={{fontSize:11,color:'rgba(255,255,255,.75)'}}>
                        {chLessons.length} บทเรียน · {ch.subtitle}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Next */}
          <button onClick={()=>gotoChapter(chIdx+1)} disabled={atLast}
            style={{width:36,height:36,borderRadius:'50%',border:'1.5px solid var(--c-border)',
              background:'#fff',fontSize:20,flexShrink:0,fontWeight:700,
              cursor:atLast?'default':'pointer',
              color:atLast?'#CBD5E1':'#64748B',opacity:atLast?0.35:1,
              display:'flex',alignItems:'center',justifyContent:'center',transition:'opacity .2s'}}>
            ›
          </button>
        </div>

        {/* Dots */}
        <div style={{display:'flex',justifyContent:'center',gap:6,marginTop:10}}>
          {CHAPTERS.map((_,ci)=>(
            <div key={ci} onClick={()=>gotoChapter(ci)}
              style={{width:chIdx===ci?20:6,height:6,borderRadius:99,cursor:'pointer',
                background:chIdx===ci?(CHAPTERS[ci]?.dot||'#1D4ED8'):'#CBD5E1',
                transition:'all .25s'}}/>
          ))}
        </div>
      </div>

      {/* ── Lesson list ── */}
      {(()=>{
        const ch=CHAPTERS[chIdx];
        const chLessons=LESSONS.filter(l=>ch.lessonIds.includes(l.id));
        return (
          <div style={{marginBottom:20}}>
            <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,marginBottom:10}}>
              บทเรียนใน {ch.label.toUpperCase()}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {chLessons.map((lesson)=>{
                const ghostKey=ex=>'ghostv2_'+lesson.id+'_'+encodeURIComponent(ex.title);
                const exHasGhost=ex=>{try{return !!localStorage.getItem(ghostKey(ex));}catch{return false;}};
                const lessonExs=getExercises(lesson);
                const allDone=lessonExs.every(exHasGhost);
                const hasGhost=lessonExs.some(exHasGhost);
                const isOpen=openLesson===lesson.id;
                const cardBg=allDone?lesson.accent:'var(--c-card)';
                const cardBorder=allDone?`2px solid ${lesson.accent}`:`1.5px solid var(--c-border)`;
                const numBg=allDone?'rgba(255,255,255,.22)':lesson.al;
                const numColor=allDone?'#fff':lesson.accent;
                const titleColor=allDone?'#fff':'var(--c-t1)';
                const subColor=allDone?'rgba(255,255,255,.7)':'var(--c-t3)';
                const arrowColor=allDone?'rgba(255,255,255,.8)':'var(--c-t3)';
                return (
                  <div key={lesson.id}>
                    <div onClick={()=>setOpenLesson(o=>o===lesson.id?null:lesson.id)}
                      style={{background:cardBg,border:cardBorder,
                        borderRadius:isOpen?'12px 12px 0 0':12,
                        padding:'12px 16px',display:'flex',alignItems:'center',gap:12,
                        cursor:'pointer',transition:'opacity .15s, border-radius .1s'}}
                      onMouseEnter={e=>e.currentTarget.style.opacity='.88'}
                      onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                      <div style={{width:36,height:36,borderRadius:10,background:numBg,
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:13,fontWeight:800,color:numColor,flexShrink:0}}>
                        {lesson.id}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:800,color:titleColor}}>{lesson.thaiName}</div>
                        <div style={{fontSize:11,color:subColor,marginTop:1}}>
                          {getExercises(lesson).length} exercises{hasGhost?' · 👻':''}
                        </div>
                      </div>
                      <span style={{color:arrowColor,fontSize:16,flexShrink:0}}>{isOpen?'▲':'▼'}</span>
                    </div>
                    {isOpen&&(
                      <div style={{border:cardBorder,borderTop:'none',
                        borderRadius:'0 0 12px 12px',background:'var(--c-card)',padding:'8px 10px'}}>
                        {lessonExs.map((ex,i)=>{
                          const hasEx=exHasGhost(ex);
                          return (
                            <button key={i} onClick={()=>onSelect(lesson,ex)}
                              style={{width:'100%',display:'flex',justifyContent:'space-between',
                                alignItems:'center',
                                background:hasEx?lesson.accent:'transparent',
                                border:`1.5px solid ${lesson.accent}`,borderRadius:8,
                                padding:'7px 10px',cursor:'pointer',fontFamily:tf,
                                marginBottom:i<lessonExs.length-1?6:0,
                                transition:'opacity .1s'}}
                              onMouseEnter={e=>e.currentTarget.style.opacity='.8'}
                              onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                              <span style={{fontSize:12,fontWeight:700,
                                color:hasEx?'#fff':lesson.accent}}>{ex.title}</span>
                              <span style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
                                {hasEx&&<span style={{fontSize:10}}>👻</span>}
                                <span style={{fontSize:10,
                                  color:hasEx?'rgba(255,255,255,.7)':'var(--c-t3)'}}>~{ex.minChars}ตัว</span>
                                <span style={{color:hasEx?'rgba(255,255,255,.8)':lesson.accent,fontSize:12}}>→</span>
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* ── Multiplayer ── */}
      <div style={{borderTop:'1.5px solid #E2E8F0',paddingTop:16}}>
        <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,
          marginBottom:12,textAlign:'center'}}>⚡ MULTIPLAYER</div>
        <div style={{display:'flex',gap:10,marginBottom:10}}>
          <button onClick={()=>onOpenSetup&&onOpenSetup('1v1')}
            style={{flex:1,background:'linear-gradient(135deg,#1D4ED8,#2563EB)',color:'#fff',
              border:'none',borderRadius:14,padding:'16px 14px',cursor:'pointer',
              textAlign:'center',fontFamily:tf,transition:'opacity .15s'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <div style={{fontSize:26,marginBottom:5}}>⚔️</div>
            <div style={{fontSize:14,fontWeight:800}}>1 vs 1</div>
            <div style={{fontSize:10,color:'#BFDBFE',marginTop:3}}>แข่ง 2 คน</div>
          </button>
          <button onClick={()=>onOpenSetup&&onOpenSetup('royale')}
            style={{flex:1,background:'linear-gradient(135deg,#92400E,#D97706)',color:'#fff',
              border:'none',borderRadius:14,padding:'16px 14px',cursor:'pointer',
              textAlign:'center',fontFamily:tf,transition:'opacity .15s'}}
            onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            <div style={{fontSize:26,marginBottom:5}}>🏆</div>
            <div style={{fontSize:14,fontWeight:800}}>Battle Royale</div>
            <div style={{fontSize:10,color:'#FDE68A',marginTop:3}}>แข่งหลายคน</div>
          </button>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={joinCode||''} onChange={e=>setJoinCode&&setJoinCode(e.target.value.toUpperCase())}
            onKeyDown={e=>e.key==='Enter'&&onJoin&&onJoin(joinCode)}
            placeholder="มีรหัสห้องอยู่แล้ว? — A7K2" maxLength={4}
            style={{flex:1,padding:'10px 14px',border:'1.5px solid var(--c-border)',borderRadius:10,
              fontSize:13,fontFamily:tf,outline:'none',boxSizing:'border-box'}}/>
          <button onClick={()=>onJoin&&onJoin(joinCode)}
            disabled={!joinCode||joinCode.length<4||mpBusy}
            style={{background:'#0F172A',color:'#fff',border:'none',borderRadius:10,
              padding:'10px 16px',cursor:'pointer',fontSize:13,fontWeight:700,
              opacity:(!joinCode||joinCode.length<4||mpBusy)?0.4:1,whiteSpace:'nowrap'}}>
            {mpBusy?'...':'เข้าร่วม →'}
          </button>
        </div>
        {joinError&&<div style={{fontSize:12,color:'#DC2626',marginTop:6,fontFamily:tf}}>{joinError}</div>}
      </div>
    </div>
  );
}

// RESULTS SCREEN

function ResultsScreen({ cpm, accuracy, errors, totalChars, lesson, saveStatus, studentName, ghostData, newRecord, roomCode, roomType, roomPlayers, myName, onRestart, onBack }) {
  const grade =
    accuracy>=98&&cpm>=40 ? {label:'ยอดเยี่ยม 🏆',color:'#D97706'} :
    accuracy>=95&&cpm>=25 ? {label:'ดีมาก ⭐',     color:'#2563EB'} :
    accuracy>=90           ? {label:'ดี 👍',         color:'#059669'} :
                             {label:'ฝึกต่อ 💪',    color:'#7C3AED'};
  return (
    <div style={{textAlign:'center',fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
      <div style={{fontSize:52,marginBottom:8}}>{accuracy>=95?'🎉':accuracy>=85?'👏':'💪'}</div>
      <h2 style={{fontSize:26,fontWeight:800,color:'var(--c-t1)',marginBottom:4}}>เสร็จแล้ว!</h2>
      <div style={{color:grade.color,fontWeight:800,fontSize:18,marginBottom:ghostData||newRecord?12:22}}>
        {grade.label}
      </div>
      {/* Ghost comparison */}
      {(ghostData || newRecord) && (
        <div style={{marginBottom:22,padding:'12px 20px',borderRadius:12,
          background: !ghostData ? '#EDE9FE'
            : cpm > ghostData.cpm ? '#D1FAE5'
            : cpm === ghostData.cpm ? '#EFF6FF'
            : '#EDE9FE',
          border:`1.5px solid ${!ghostData ? '#8B5CF6'
            : cpm > ghostData.cpm ? '#059669'
            : cpm === ghostData.cpm ? '#2563EB'
            : '#8B5CF6'}`,
          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
          fontSize:15, fontWeight:700,
        }}>
          {!ghostData
            ? `👻 บันทึก Ghost แล้ว! (${cpm} KPM) — ลองแข่งรอบหน้า`
            : cpm > ghostData.cpm
            ? `🏆 ชนะ Ghost! ${cpm} vs ${ghostData.cpm} KPM${newRecord ? ' — สถิติใหม่! 🎉' : ''}`
            : cpm === ghostData.cpm
            ? `🤝 เสมอกับ Ghost! (${cpm} KPM)`
            : `👻 Ghost ชนะ — ${ghostData.cpm} vs ${cpm} KPM — สู้ต่อไป!`}
        </div>
      )}
      <div style={{display:'flex',gap:14,justifyContent:'center',marginBottom:24,flexWrap:'wrap'}}>
        <StatPill label="KPM"       value={cpm}              color={cpm>=30?'#059669':'#D97706'}/>
        <StatPill label="WPM"       value={Math.round(cpm/5)} color="#2563EB"/>
        <StatPill label="ความแม่น" value={`${accuracy}%`}   color={accuracy>=95?'#059669':'#D97706'}/>
        <StatPill label="ผิด"       value={errors}           color={errors===0?'#059669':'#EF4444'}/>
        <StatPill label="ตัวอักษร" value={totalChars}/>
      </div>
      <div style={{background:'#F1F5F9',borderRadius:12,height:10,marginBottom:22,overflow:'hidden'}}>
        <div style={{width:`${accuracy}%`,height:'100%',borderRadius:12,
          background:accuracy>=95?'#059669':accuracy>=85?'#2563EB':'#F59E0B',
          transition:'width 1s ease-out'}}/>
      </div>
      {/* Race standings */}
      {roomCode && Object.keys(roomPlayers||{}).length > 0 && (
        <div style={{background:'var(--c-surf)',border:'1.5px solid var(--c-border)',borderRadius:12,
          padding:'14px 16px',marginBottom:20,textAlign:'left'}}>
          <div style={{fontSize:13,fontWeight:800,marginBottom:10,
            fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
            {roomType==='royale'?'🏆 Battle Royale':'⚡ 1v1'} — ผลการแข่ง</div>
          {Object.entries(roomPlayers)
            .sort((a,b)=>{
              const [,ap]=a, [,bp]=b;
              // Tier: finished (0) > still racing (1) > eliminated (2)
              const tier=p=>p.status==='done'?0:p.status==='eliminated'?2:1;
              const ta=tier(ap), tb=tier(bp);
              if (ta!==tb) return ta-tb;
              // Both finished → earliest finish time wins
              if (ta===0 && ap.finishedAt && bp.finishedAt) return ap.finishedAt-bp.finishedAt;
              // Otherwise → most characters typed
              if ((bp.pos||0)!==(ap.pos||0)) return (bp.pos||0)-(ap.pos||0);
              // Tiebreak → higher CPM
              return (bp.cpm||0)-(ap.cpm||0);
            })
            .map(([name,p],i)=>(
              <div key={name} style={{display:'flex',alignItems:'center',gap:10,
                padding:'8px 0',borderBottom:'1px solid var(--c-border)'}}>
                <span style={{fontSize:18,width:28}}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':'  '}</span>
                <span style={{flex:1,fontFamily:"'Sarabun','Noto Sans Thai',sans-serif",
                  fontWeight:700,color:name===(myName||'ผู้เล่น1')?'#059669':'#0F172A',fontSize:14}}>
                  {name}
                  {p.status==='done'&&' 🏁'}
                  {p.status==='eliminated'&&' 💀'}
                </span>
                <span style={{fontSize:13,color:'var(--c-t2)'}}>{p.cpm||0} KPM</span>
              </div>
            ))}
        </div>
      )}
      <div style={{display:'flex',gap:12,justifyContent:'center'}}>
        <button onClick={onRestart} style={{background:'#0F172A',color:'#fff',border:'none',
          borderRadius:10,padding:'11px 26px',cursor:'pointer',fontSize:14,fontWeight:700}}>
          สุ่มคำใหม่ / ลองอีกครั้ง
        </button>
        <button onClick={onBack} style={{background:'#F1F5F9',color:'var(--c-t1)',border:'none',
          borderRadius:10,padding:'11px 26px',cursor:'pointer',fontSize:14,fontWeight:600}}>
          เลือกบทเรียน
        </button>
      </div>
      {studentName && (
        <div style={{marginTop:18,fontSize:12,color:'var(--c-t3)',
          fontFamily:"'Sarabun','Noto Sans Thai',sans-serif"}}>
          {saveStatus==='saving' && '💾 กำลังบันทึกผล...'}
          {saveStatus==='saved'  && '✅ บันทึกผลแล้ว'}
          {saveStatus==='error'  && '⚠️ บันทึกไม่ได้ — ตรวจสอบสัญญาณ'}
        </div>
      )}
    </div>
  );
}

// Generate progressive BR text from multiple exercises
function generateBRText(startLesson, startExercise, minLength) {
  const allLessons = LESSONS;
  let text = '';
  let lessonIdx = allLessons.findIndex(l => l.id === startLesson.id);
  let exIdx = startLesson.exercises ? startLesson.exercises.indexOf(startExercise) : 0;
  if (exIdx < 0) exIdx = 0;

  // Collect words from current + subsequent exercises
  const wordPool = [];
  for (let li = lessonIdx; li < allLessons.length && wordPool.length < 200; li++) {
    const les = allLessons[li];
    const exs = les.exercises || les.exercisesA || les.exercisesGold || [];
    const startEx = li === lessonIdx ? exIdx : 0;
    for (let ei = startEx; ei < exs.length && wordPool.length < 200; ei++) {
      wordPool.push(...(exs[ei].words || []));
    }
  }

  // Generate shuffled text of sufficient length
  if (!wordPool.length) return generateText(startExercise.words, minLength);
  return generateText(wordPool, Math.max(minLength, 500));
}

function generateStoryText(words, name) {
  const n = name||'นักผจญภัย';
  return words.map(w=>w.replace(/__NAME__/g,n)).join(' ');
}

// PROGRESS CHART

function ProgressChart({ sessions }) {
  const [tab, setTab] = useState('wpm'); // 'wpm' | 'both'
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";

  // Reverse to chronological order, take last 20
  const data = [...sessions].reverse().slice(-20).map((s, i) => ({
    n:    i + 1,
    wpm:  Math.round(s.cpm / 5),
    acc:  s.accuracy,
    ex:   s.exercise,
  }));

  if (data.length < 2) return (
    <div style={{textAlign:'center',padding:24,color:'var(--c-t3)',fontSize:13,fontFamily:tf,
      background:'var(--c-surf)',borderRadius:12,border:'1.5px solid var(--c-border)'}}>
      ต้องมีอย่างน้อย 2 เซสชั่น จึงจะแสดงกราฟได้
    </div>
  );

  const W = 520, H = 200, PL = 40, PR = 40, PT = 16, PB = 32;
  const IW = W - PL - PR, IH = H - PT - PB;

  const maxWpm = Math.max(...data.map(d => d.wpm), 10);
  const yMaxWpm = Math.ceil(maxWpm / 10) * 10 + 10;

  const xOf  = d => PL + ((d.n - 1) / (data.length - 1)) * IW;
  const yWpm = d => PT + IH - (d.wpm / yMaxWpm) * IH;
  const yAcc = d => PT + IH - ((d.acc - 50) / 50) * IH;  // acc range 50-100

  const polyline = (pts, color) => {
    const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    return <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>;
  };

  const wpmPts = data.map(d => ({ x: xOf(d), y: yWpm(d) }));
  const accPts = data.map(d => ({ x: xOf(d), y: yAcc(d) }));

  const yGrids = [0, 25, 50, 75, 100];

  return (
    <div>
      {/* Tab switcher */}
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['wpm','📈 WPM'],['both','📊 WPM + ความแม่น']].map(([key,lbl])=>(
          <button key={key} onClick={()=>setTab(key)}
            style={{padding:'5px 12px',borderRadius:8,border:'1.5px solid '+(tab===key?'#2563EB':'#E2E8F0'),
              background:tab===key?'#2563EB':'#fff',color:tab===key?'#fff':'#64748B',
              cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:tf,transition:'all .15s'}}>
            {lbl}
          </button>
        ))}
      </div>

      {/* Legend */}
      <div style={{display:'flex',gap:16,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:20,height:3,borderRadius:2,background:'#2563EB'}}/>
          <span style={{fontSize:11,color:'var(--c-t2)',fontFamily:tf}}>WPM</span>
        </div>
        {tab==='both'&&(
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:20,height:3,borderRadius:2,background:'#059669'}}/>
            <span style={{fontSize:11,color:'var(--c-t2)',fontFamily:tf}}>ความแม่น %</span>
          </div>
        )}
      </div>

      {/* Chart */}
      <div style={{overflowX:'auto'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:280,display:'block'}}>
          {/* Grid lines */}
          {yGrids.map(pct => {
            const y = PT + IH - (pct / 100) * IH;
            return (
              <g key={pct}>
                <line x1={PL} y1={y} x2={W-PR} y2={y}
                  stroke="#F1F5F9" strokeWidth="1"/>
                <text x={PL-6} y={y+4} textAnchor="end"
                  fontSize="9" fill="#CBD5E1">{tab==='wpm' ? Math.round(pct/100*yMaxWpm) : pct+'%'}</text>
              </g>
            );
          })}

          {/* WPM y-labels when both shown */}
          {tab==='both' && yGrids.map(pct => {
            const y = PT + IH - (pct / 100) * IH;
            return (
              <text key={'r'+pct} x={W-PR+6} y={y+4} textAnchor="start"
                fontSize="9" fill="#BFDBFE">{Math.round(pct/100*yMaxWpm)}</text>
            );
          })}

          {/* X axis labels */}
          {data.filter((_, i) => data.length <= 10 || i % Math.ceil(data.length/8) === 0 || i === data.length-1).map(d => (
            <text key={d.n} x={xOf(d)} y={H-8} textAnchor="middle" fontSize="9" fill="#94A3B8">
              {d.n}
            </text>
          ))}

          {/* Lines */}
          {tab==='both' && polyline(accPts, '#059669')}
          {polyline(wpmPts, '#2563EB')}

          {/* Dots — WPM */}
          {data.map(d => (
            <circle key={d.n} cx={xOf(d)} cy={yWpm(d)} r="3.5"
              fill="#2563EB" stroke="#fff" strokeWidth="1.5">
              <title>Session {d.n} · {d.wpm} WPM · {d.ex}</title>
            </circle>
          ))}

          {/* Dots — accuracy */}
          {tab==='both' && data.map(d => (
            <circle key={'a'+d.n} cx={xOf(d)} cy={yAcc(d)} r="3.5"
              fill="#059669" stroke="#fff" strokeWidth="1.5">
              <title>Session {d.n} · {d.acc}% · {d.ex}</title>
            </circle>
          ))}

          {/* Axes */}
          <line x1={PL} y1={PT} x2={PL} y2={H-PB} stroke="#E2E8F0" strokeWidth="1"/>
          <line x1={PL} y1={H-PB} x2={W-PR} y2={H-PB} stroke="#E2E8F0" strokeWidth="1"/>

          {/* X-axis label */}
          <text x={W/2} y={H} textAnchor="middle" fontSize="9" fill="#94A3B8">ลำดับ session</text>
        </svg>
      </div>
    </div>
  );
}

// ASSIGNMENT CARD

function AssignmentCard({ assignments, onSelect, lesson, exercise }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  const pending = assignments.filter(a => !a.completed);
  const done    = assignments.filter(a => a.completed);
  if (!assignments.length) return null;

  const daysLeft = (deadline) => {
    if (!deadline) return null;
    const diff = Math.ceil((new Date(deadline) - Date.now()) / 86400000);
    return diff;
  };

  return (
    <div style={{marginBottom:20}}>
      <div style={{fontSize:11,fontWeight:800,color:'var(--c-t3)',letterSpacing:1,marginBottom:10}}>
        📋 งานที่ได้รับ ({pending.length} รอทำ · {done.length} เสร็จแล้ว)
      </div>
      {pending.map(a => {
        const dl = daysLeft(a.deadline);
        const overdue = dl !== null && dl < 0;
        const urgent  = dl !== null && dl <= 2 && dl >= 0;
        return (
          <div key={a.assignId}
            onClick={() => onSelect && onSelect(a)}
            style={{background:'var(--c-card)',border:`2px solid ${overdue?'#DC2626':urgent?'#F59E0B':'#2563EB'}`,
              borderRadius:12,padding:'12px 16px',marginBottom:8,cursor:'pointer',
              display:'flex',alignItems:'center',gap:12,transition:'all .15s'}}
            onMouseEnter={e=>e.currentTarget.style.transform='translateY(-1px)'}
            onMouseLeave={e=>e.currentTarget.style.transform='none'}>
            <div style={{fontSize:24,flexShrink:0}}>{overdue?'⚠️':urgent?'⏰':'📝'}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:800,color:'var(--c-t1)',fontFamily:tf}}>
                {a.exerciseTitle}</div>
              <div style={{fontSize:11,color:'var(--c-t3)',marginTop:2,fontFamily:tf}}>
                {a.deadline
                  ? overdue ? `เลยกำหนด ${Math.abs(dl)} วัน` : `เหลือ ${dl} วัน`
                  : 'ไม่มีกำหนดส่ง'}
              </div>
            </div>
            <div style={{background:overdue?'#FEE2E2':urgent?'#FEF3C7':'#EFF6FF',
              color:overdue?'#DC2626':urgent?'#D97706':'#2563EB',
              borderRadius:8,padding:'6px 12px',fontSize:12,fontWeight:800,
              fontFamily:tf,flexShrink:0,whiteSpace:'nowrap'}}>
              ทำเลย →
            </div>
          </div>
        );
      })}
      {done.length > 0 && (
        <div style={{fontSize:11,color:'var(--c-t3)',fontFamily:tf,
          padding:'6px 0',borderTop:'1px solid var(--c-border)',marginTop:4}}>
          ✅ ทำแล้ว: {done.map(a=>a.exerciseTitle).join(' · ')}
        </div>
      )}
    </div>
  );
}

// SPECTATOR VIEW — render the selected player's text, not the host's local chunk.
function SpectatorView({ playerName, targetChars, progress, onBack }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  // Apply same chunking logic as practice screen so page scrolls with player
  const chunks = buildChunks(targetChars);
  const pos    = progress || 0;
  const chunkIdx = (() => {
    for (let i=0; i<chunks.length; i++) { if (pos < chunks[i].end) return i; }
    return Math.max(0, chunks.length-1);
  })();
  const curChunk   = chunks[chunkIdx] || {start:0, end:targetChars.length};
  const chunkChars = targetChars.slice(curChunk.start, curChunk.end);
  const chunkPos   = Math.max(0, pos - curChunk.start);

  return (
    <div style={{fontFamily:tf}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <button onClick={onBack}
          style={{background:'var(--c-surf)',border:'1.5px solid var(--c-border)',
            color:'var(--c-t2)',borderRadius:7,padding:'5px 10px',cursor:'pointer',
            fontSize:12,fontFamily:tf}}>← กลับ</button>
        <div style={{fontSize:14,fontWeight:800,color:'var(--c-t1)'}}>
          👁 กำลังดู: {playerName}</div>
        <div style={{marginLeft:'auto',fontSize:11,color:'var(--c-t3)'}}>
          หน้า {chunkIdx+1}/{chunks.length}
        </div>
      </div>
      <div style={{background:'var(--c-surf)',borderRadius:14,padding:'22px 18px',
        border:'1.5px solid var(--c-border)',minHeight:96,
        display:'flex',alignItems:'center',justifyContent:'center'}}>
        <TextDisplay displayChars={chunkChars} displayPos={chunkPos}/>
      </div>
    </div>
  );
}

function BattleRoyaleResults({ roomCode, roomPlayers, onBack }) {
  const tf = "'Sarabun','Noto Sans Thai',sans-serif";
  const rows = Object.entries(roomPlayers||{})
    .filter(([,p])=>!p.isSpectator)
    .sort((a,b)=>{
      const rank = p => p.status==='done'?0:(p.lives||0)>0?1:2;
      const diff = rank(a[1])-rank(b[1]);
      if (diff) return diff;
      if (a[1].status==='done' && b[1].status==='done') return (a[1].finishedAt||0)-(b[1].finishedAt||0);
      if ((a[1].lives||0)!==(b[1].lives||0)) return (b[1].lives||0)-(a[1].lives||0);
      return (b[1].pos||0)-(a[1].pos||0);
    });
  return (
    <div style={{fontFamily:tf}}>
      <div style={{textAlign:'center',padding:'24px 12px 18px',background:'linear-gradient(135deg,#1C1917,#D97706)',borderRadius:16,color:'#fff',marginBottom:14}}>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:10,fontWeight:800,color:'#4F6E8A',marginBottom:8}}><span>🗺️ เส้นทางของคุณ</span><span>เฟส {phase||'เตรียมตัว'}{phase>0?` · ${getZoneSpeed(elapsed)} ตัว/นาที`:''}</span></div>
            <div style={{height:53,position:'relative',borderRadius:12,background:'#E6EEF5',overflow:'hidden'}}>

              <div style={{position:'absolute',top:0,bottom:0,left:`${percent}%`,width:3,background:outside?'#E67E22':'#276FD0',transition:'left .4s'}}/>
              <div style={{position:'absolute',top:7,left:`${percent}%`,transform:'translateX(-50%)',fontSize:23,filter:'drop-shadow(0 2px 2px #17324a25)',transition:'left .4s',zIndex:2}}>{playerLives>0?'🧑‍🚀':'💀'}</div>

          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginTop:10,padding:'8px 10px',background:'#FBFCFE',border:'1px solid #EDF1F5',borderRadius:12}}><span style={{fontSize:10,fontWeight:800,color:'#526B83'}}>พลังนักสำรวจ</span><span style={{fontSize:17,letterSpacing:2}}>{Array.from({length:Math.min(8,Math.max(1,playerLives))},(_,i)=>i<playerLives?'❤️':'🩶').join(' ')}</span><span style={{fontSize:10,fontWeight:700,color:'#7C91A5'}}>{playerLives} ชีวิต</span></div>
        </div>

      <section style={{...card,padding:'13px 13px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9}}><div style={{fontSize:13,fontWeight:800,color:'#203B56'}}>🏃 นักสำรวจ</div><div style={{fontSize:10,color:'#8297AA'}}>เรียงตามอันดับ</div></div>
        <div style={{display:'flex',flexDirection:'column',gap:7}}>
          {players.slice(0,6).map(([name,p],i)=>{
            const mine=name===myName;
            const pct=totalChars?Math.max(0,Math.min(100,Math.round((p.pos||0)/totalChars*100))):0;
            const dead=p.status==='eliminated'||(p.lives||0)<=0;
            return <div key={name} style={{padding:'8px 9px',borderRadius:11,background:mine?'#EFF6FF':dead?'#F5F6F8':'#FAFCFE',border:`1px solid ${mine?'#C9DDF8':'#EAF0F5'}`,opacity:dead ? 0.62 : 1}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:11,width:16,fontWeight:800,color:i===0?'#D28A17':'#8195A8'}}>{p.status==='done'?'🏁':i+1}</span><span style={{fontSize:11,fontWeight:800,color:'#344E67',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}{mine?' (คุณ)':''}</span><span style={{fontSize:10}}>{dead?'💀':(p.lives||0)<=5?'❤️'.repeat(Math.max(0,p.lives||0)):`❤️×${p.lives}`}</span></div>
              <div style={{height:5,background:'#E7EDF3',borderRadius:5,marginTop:6,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,borderRadius:5,background:dead?'#A8B2BD':p.status==='done'?'#E7A832':mine?'#3982D2':'#31AA78',transition:'width .35s'}}/></div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'#8296A9',marginTop:3}}><span>{p.status==='done'?'เข้าเส้นชัยแล้ว':dead?'ออกจากเกม':'กำลังแข่ง'}</span><span>{pct}%</span></div>
            </div>;
          })}
          {players.length===0&&<div style={{fontSize:11,color:'#8296A9',padding:14,textAlign:'center'}}>กำลังรอข้อมูลผู้เล่น…</div>}
        </div>
        {players.length>6&&<div style={{fontSize:10,color:'#8296A9',textAlign:'center',marginTop:8}}>และอีก {players.length-6} คน</div>}
      </section>
    </div>
    </>
  );
}
